<title>Terenska knjiga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first field app. Status header with site switcher, one scrolling view, tab bar at the bottom.
   High contrast for sunlight, large targets for gloved hands. Red is reserved for hazard. Documents render as paper forms. */
:root{
  --bg:#E8EBE3; --surface:#F7F8F4; --surface-2:#FFFFFF; --ink:#1A1F19; --muted:#59625A; --line:#CBD1C4;
  --accent:#1F3D35; --on-accent:#F3F7F2;
  --hazard:#BF2A1C; --on-hazard:#FFFFFF; --haz-soft:#F1D5CE;
  --cleared:#2B784A; --clr-soft:#C8E2D0;
  --work:#A86F0B; --work-soft:#F4DFAF;
  --paper:#FFFFFF; --paper-ink:#111511;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F120F; --surface:#171B16; --surface-2:#1E231D; --ink:#E5E9E0; --muted:#97A190; --line:#2C3229;
    --accent:#A8D0C2; --on-accent:#0D1915;
    --hazard:#EC5B45; --on-hazard:#1B0805; --haz-soft:#3A1C17;
    --cleared:#5CBF85; --clr-soft:#1B3223;
    --work:#E7B142; --work-soft:#3A2E12;
    --paper:#F4F3EE; --paper-ink:#111511;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F120F; --surface:#171B16; --surface-2:#1E231D; --ink:#E5E9E0; --muted:#97A190; --line:#2C3229;
  --accent:#A8D0C2; --on-accent:#0D1915;
  --hazard:#EC5B45; --on-hazard:#1B0805; --haz-soft:#3A1C17;
  --cleared:#5CBF85; --clr-soft:#1B3223;
  --work:#E7B142; --work-soft:#3A2E12;
  --paper:#F4F3EE; --paper-ink:#111511;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}

.app{position:relative;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.site-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;padding:4px 6px;margin:-4px -6px;border-radius:8px;text-align:left;min-width:0}
.site-btn:hover{background:var(--bg)}
.site-code{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:6px;white-space:nowrap}
.site-code svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2.2}
.site-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pack{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);font-weight:500;letter-spacing:0}
.sync{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--work);flex:none}
.sync.ok .dot{background:var(--cleared)}
.sync.busy .dot{animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.25}}

main{flex:1;overflow-y:auto;padding:14px 14px 22px;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.01em}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}

.big{font-family:var(--font-display);font-weight:700;font-size:50px;line-height:.95;font-variant-numeric:tabular-nums}
.big .unit{font-size:21px;margin-left:4px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--haz-soft);overflow:hidden;margin:12px 0 4px}
.bar span{display:block;height:100%;background:var(--cleared);border-radius:5px;transition:width .4s}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 0}
.kv3 dt{font-size:11.5px;color:var(--muted)}
.kv3 dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{background:var(--hazard);color:var(--on-hazard);border-color:var(--hazard)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 130px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:6px}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.chip.work{background:var(--work-soft);color:var(--ink)}
.chip.ok{background:var(--clr-soft);color:var(--ink)}
.chip.haz{background:var(--haz-soft);color:var(--ink)}
.tri{width:16px;height:14px;flex:none}
.tri path{fill:var(--hazard)}

/* pairs */
.pair{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pair:first-of-type{border-top:0}
.pair .tag{font-family:var(--font-display);font-weight:700;font-size:22px;width:34px;height:34px;border-radius:8px;background:var(--bg);display:grid;place-items:center}
.pair .t{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.pair.over .t{color:var(--hazard)}
.pair.over .tag{background:var(--haz-soft)}

/* compliance */
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.chk .ok .ic,.chk li.ok .ic{background:var(--clr-soft);color:var(--cleared)}
.chk li.warn .ic{background:var(--work-soft);color:var(--work)}
.chk li.bad .ic{background:var(--haz-soft);color:var(--hazard)}
.chk .v{font-family:var(--font-mono);font-size:12.5px;text-align:right;white-space:nowrap}

/* log */
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .tm{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);padding-top:1px}
.log li.find .ev{color:var(--hazard);font-weight:500}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.quick .btn{min-height:42px;padding:6px 8px;font-size:13px;font-weight:500}

.checks{list-style:none;margin:0;padding:0}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;font-size:14px}
.checks input{width:22px;height:22px;margin:0;accent-color:var(--cleared);flex:none}
.notice{font-size:13px;padding:9px 11px;border-radius:8px;background:var(--work-soft);margin:6px 0 10px}
.notice.haz{background:var(--haz-soft)}

/* map */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mapwrap{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.m-poly{fill:var(--haz-soft);stroke:var(--hazard);stroke-width:1.4;stroke-dasharray:5 3}
.m-safe{fill:var(--clr-soft)}
.m-zero{stroke:var(--ink);stroke-width:2}
.m-lane{fill:var(--cleared)}
.m-lane-p{fill:var(--work)}
.m-hit{fill:transparent;cursor:pointer}
.m-hit:hover{fill:rgba(0,0,0,.06)}
.m-sel{fill:none;stroke:var(--ink);stroke-width:1.5}
.m-mk{fill:var(--hazard);stroke:var(--surface-2);stroke-width:.8;pointer-events:none}
.m-t{fill:var(--muted);font-family:var(--font-mono);font-size:8.5px}
.m-t.ink{fill:var(--ink)}
.m-t.big{font-family:var(--font-display);font-weight:700;font-size:12px;fill:var(--ink)}
.m-gap{stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 2}
.m-tp{fill:var(--surface-2);stroke:var(--hazard);stroke-width:1.2}
.m-n{stroke:var(--ink);stroke-width:1.2;fill:none}
.m-nf{fill:var(--ink)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,14,10,.4);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--surface-2);border-top-left-radius:16px;border-top-right-radius:16px;padding:16px 16px 20px;border-top:1px solid var(--line);max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.sitecard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.sitecard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.packs{display:grid;gap:6px}
.packrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--bg)}

/* forms */
form{display:flex;flex-direction:column;gap:14px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.flabel{font-size:13px;font-weight:600;margin-bottom:6px;padding:0;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label span{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13.5px;cursor:pointer}
.chips.mono label span{font-family:var(--font-mono);font-size:13px}
.chips input:checked + span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
.field input,.field select,.field textarea{min-height:46px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:400;font-size:15px;width:100%}
.field textarea{min-height:90px;resize:vertical;font-family:var(--font-mono);font-size:13px}
.field small{font-weight:400;color:var(--muted);font-size:12px}
.calc{padding:11px 12px;border-radius:8px;background:var(--clr-soft);font-size:13px;display:flex;flex-direction:column;gap:3px}
.calc .mono{font-size:13.5px;font-weight:500}
.calc.warn{background:var(--work-soft)}
.photo{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;background:var(--surface-2);font-size:14px;font-weight:500}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.photo .ph{width:56px;height:56px;border-radius:6px;background:var(--bg);display:grid;place-items:center;flex:none}
.photo .ph svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:1.8}

/* reports list */
.doclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.docitem{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px}
.docitem .pn{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.05;text-align:center;background:var(--bg);border-radius:6px;padding:7px 2px}
.docitem b{display:block;font-size:14.5px;line-height:1.3}

/* paper document */
.doc{--ink:#111511;--muted:#4c544c;--surface-2:#fff;--hazard:#BF2A1C;--haz-soft:#F1D5CE;--cleared:#2B784A;--clr-soft:#C8E2D0;--work:#A86F0B;--work-soft:#F4DFAF;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:18px 16px;font-size:12.5px;line-height:1.4;box-shadow:0 1px 0 var(--line)}
.doc h4{font-family:var(--font-body);font-size:14px;font-weight:700;text-align:center;margin:6px 0 2px;letter-spacing:.04em}
.doc .dsub{text-align:center;font-size:11.5px;margin-bottom:12px}
.doc .dorg{border-bottom:1px dotted #111511;padding-bottom:2px;text-align:center;font-weight:600}
.doc .dsmall{font-size:10.5px;text-align:center;color:#3c433c}
.doc table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
.doc th,.doc td{border:1px solid #111511;padding:4px 5px;vertical-align:top;text-align:left;color:#111511}
.doc th{font-weight:600;background:#eef0ea;font-size:11px}
.doc td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc td.k{width:42%;font-weight:500}
.doc .box{display:inline-block;width:11px;height:11px;border:1px solid #111511;vertical-align:-1px;margin:0 3px 0 8px;text-align:center;line-height:9px;font-size:10px;font-weight:700}
.doc .sec{font-weight:700;margin:12px 0 4px;font-size:12.5px}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px;font-size:11px}
.doc .sig div{border-top:1px solid #111511;padding-top:3px}
.doc .miss{background:#f6dcc8;padding:0 3px}
.doc .note{font-size:10.5px;color:#3c433c;margin-top:8px}
.doc svg{display:block;width:100%;height:auto;border:1px solid #111511;margin:6px 0;background:#fff}
.tbl{overflow-x:auto}
.doc.wide{min-width:640px}
.missing{font-size:13px}
.missing li{margin:3px 0}
.out{white-space:pre-wrap;font-family:var(--font-mono);font-size:11.5px;background:var(--bg);padding:10px;border-radius:8px;max-height:220px;overflow:auto;margin:0;user-select:all}

/* emergency */
.sos{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:22px 16px;border-radius:12px;border:0;background:var(--hazard);color:var(--on-hazard)}
.sos b{font-family:var(--font-display);font-size:30px;letter-spacing:.04em;line-height:1}
.sos span{font-size:13.5px;opacity:.92}
.inc{background:var(--hazard);color:var(--on-hazard);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inc .label{color:inherit;opacity:.85}
.inc .tv{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0}
.steps li{border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.steps input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--hazard);flex:none}
.steps .t{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.contact{display:flex;align-items:center;gap:10px}
.contact .num{font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1}
.dtab{width:100%;border-collapse:collapse;font-size:13.5px}
.dtab td{padding:7px 0;border-top:1px solid var(--line)}
.dtab tr:first-child td{border-top:0}
.dtab td.n{text-align:right;font-family:var(--font-display);font-weight:700;font-size:20px;white-space:nowrap}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface-2);padding:4px 4px 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 2px;font-size:11.5px;font-weight:500;color:var(--muted);border-radius:8px;min-height:54px;justify-content:center}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tab[aria-current="page"]{color:var(--ink);background:var(--bg)}
.tab.add svg{stroke:var(--hazard)}
.tab.sos-t{color:var(--hazard)}
.toast{position:absolute;left:14px;right:14px;bottom:76px;z-index:9;background:var(--ink);color:var(--surface-2);padding:12px 14px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2)}

@media (max-width:480px){
  body{padding-block:0;padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
  .app{border-radius:0;border-left:0;border-right:0;max-width:none}
  main{padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}
  .top{padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;padding:0;height:auto}
  .app{display:block;border:0;height:auto;max-width:none;overflow:visible;background:#fff}
  .top,.tabs,.toast,.scrim,.noprint{display:none!important}
  main{overflow:visible;padding:0;display:block}
  .view{display:block}
  .doc{border:0;box-shadow:none;padding:0;font-size:11pt}
  .doc.wide{min-width:0}
}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="site-btn" type="button" data-act="sites" aria-label="Promijeni radilište i paket zemlje">
      <span class="site-code"><span id="hdrSite">MSP</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>

/* ================= geodesy: GK zone 6 (MGI 1901 / Bessel) and UTM 34N (WGS84) ================= */
const D2R=Math.PI/180;

const MGI_SHIFT=[682,-203,480]; // demo 3-parameter shift; confirm with BHMAC
function tmInv(E,N,el,lon0,k0,FE){const a=el.a,f=el.f,e2=2*f-f*f,ep2=e2/(1-e2);const x=E-FE,M=N/k0;
  const mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2*e2*e2/256));const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
  const s=Math.sin(p1),c=Math.cos(p1),t=Math.tan(p1);const C1=ep2*c*c,T1=t*t,N1=a/Math.sqrt(1-e2*s*s),R1=a*(1-e2)/Math.pow(1-e2*s*s,1.5),D=x/(N1*k0);
  const lat=p1-(N1*t/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon=lon0*D2R+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/c;return {lat:lat/D2R,lon:lon/D2R};}
function tmFwd(lat,lon,el,lon0,k0,FE){const a=el.a,f=el.f,e2=2*f-f*f,ep2=e2/(1-e2);const p=lat*D2R,s=Math.sin(p),c=Math.cos(p),t=Math.tan(p);
  const N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep2*c*c,A=c*(lon-lon0)*D2R;
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*p-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*p)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*p)-(35*e2**3/3072)*Math.sin(6*p));
  const x=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);
  const y=k0*(M+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));return {E:x+FE,N:y};}
function toEcef(lat,lon,el){const f=el.f,e2=2*f-f*f,p=lat*D2R,l=lon*D2R,s=Math.sin(p),N=el.a/Math.sqrt(1-e2*s*s);return [N*Math.cos(p)*Math.cos(l),N*Math.cos(p)*Math.sin(l),N*(1-e2)*s];}
function fromEcef(X,Y,Z,el){const a=el.a,f=el.f,e2=2*f-f*f,b=a*(1-f),ep2=(a*a-b*b)/(b*b),p=Math.hypot(X,Y),th=Math.atan2(Z*a,p*b);
  const lat=Math.atan2(Z+ep2*b*Math.sin(th)**3,p-e2*a*Math.cos(th)**3);return {lat:lat/D2R,lon:Math.atan2(Y,X)/D2R};}
function gk6ToWgs(Y,X){const g=tmInv(Y,X,ELL.bessel,18,0.9999,6500000);const e=toEcef(g.lat,g.lon,ELL.bessel);return fromEcef(e[0]+MGI_SHIFT[0],e[1]+MGI_SHIFT[1],e[2]+MGI_SHIFT[2],ELL.wgs84);}
function wgsToGk6(lat,lon){const e=toEcef(lat,lon,ELL.wgs84);const g=fromEcef(e[0]-MGI_SHIFT[0],e[1]-MGI_SHIFT[1],e[2]-MGI_SHIFT[2],ELL.bessel);const r=tmFwd(g.lat,g.lon,ELL.bessel,18,0.9999,6500000);return {Y:r.E,X:r.N};}
function wgsToUtm34(lat,lon){const r=tmFwd(lat,lon,ELL.wgs84,21,0.9996,500000);return {E:r.E,N:r.N};}

/* ================= site geometry ================= */
function frame(site){const a=site.az*D2R;return {F:[Math.sin(a),Math.cos(a)],Rt:[Math.cos(a),-Math.sin(a)]};}
function toGK(site,u,v){const {F,Rt}=frame(site);return {Y:site.nt.Y+u*Rt[0]+v*F[0],X:site.nt.X+u*Rt[1]+v*F[1]};}
function toLocal(site,Y,X){const {F,Rt}=frame(site);const dy=Y-site.nt.Y,dx=X-site.nt.X;return [dy*Rt[0]+dx*Rt[1],dy*F[0]+dx*F[1]];}
function inPoly(pt,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))c=!c;}return c;}
function polyArea(poly){let s=0;for(let i=0,j=poly.length-1;i<poly.length;j=i++)s+=(poly[j][0]+poly[i][0])*(poly[j][1]-poly[i][1]);return Math.abs(s/2);}
function bounds(poly){const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]);return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};}
function laneLen(site,i){const u=i-0.5;if(site._ll&&site._ll[i]!=null)return site._ll[i];let v=0.1,last=0;const b=bounds(site.poly);while(v<=b.y1+0.5){if(inPoly([u,v],site.poly))last=v;v+=0.25;}last=Math.round(last*2)/2;(site._ll=site._ll||{})[i]=last;return last;}
function laneCount(site){const b=bounds(site.poly);return Math.max(0,Math.floor(b.x1));}
function findPos(site,f){return toGK(site,f.lane-0.5+(f.off||0),f.dist);}

  let minGap=Infinity;for(let i=1;i<lanes.length;i++)minGap=Math.min(minGap,(lanes[i]-lanes[i-1])*R.lane);
  if(lanes.length>1)out.push({st:minGap>=R.pairGap?'ok':'bad',t:'Razmak između aktivnih staza (min. '+R.pairGap+' m)',v:num(minGap)+' m'});
  const over=s.pairs.filter(p=>pairState(p).over);
  if(s.pairs.length)out.push({st:over.length?'bad':'ok',t:'Smjena u stazi najviše '+R.shiftMax+' min',v:over.length?('prekoračeno: '+over.map(p=>p.id).join(', ')):'u redu'});

  out.push({st:ms<864e5?'warn':'ok',t:'Sedmični izvještaj (Prilog 11), ponedjeljak 16:00',v:'za '+(d?d+' d ':'')+h+' h'});
  return out;
}

/* ================= MAPA (staze) ================= */
function mapSVG(s,opts={}){
  const b=bounds(s.poly), W=opts.w||330, padL=26, padR=14, padT=22, padB=opts.paper?44:56;
  const sc=(W-padL-padR)/(b.x1-b.x0+2);
  const H=Math.round((b.y1+2.5)*sc+padT+padB);
  const X=u=>padL+(u-b.x0+1)*sc, Y=v=>padT+(b.y1+0.5-v)*sc;
  const lc=laneCount(s);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Skica ${esc(s.ci.oznaka)}: radne staze od nulte linije">`;
  g+=`<rect class="m-safe" x="${X(b.x0-0.5)}" y="${Y(0)}" width="${(b.x1-b.x0+1)*sc}" height="${2*sc}"/>`;
  g+=`<path class="m-poly" d="M${s.poly.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('L')}Z"/>`;
  const active={};s.pairs.forEach(p=>active[p.lane]=p.id);
  for(let i=1;i<=lc;i++){const L=laneLen(s,i);if(L<=0)continue;const d=Math.min(laneDone(s,i),L);
    if(d>0)g+=`<rect class="${active[i]?'m-lane-p':'m-lane'}" x="${X(i-1)+.3}" y="${Y(d)}" width="${Math.max(.6,sc-.6)}" height="${d*sc}"/>`;
    if(!opts.paper)g+=`<rect class="m-hit" x="${X(i-1)}" y="${Y(L)}" width="${sc}" height="${L*sc}" data-act="lane" data-l="${i}"><title>Staza ${i}</title></rect>`;
    if(selLane===i&&!opts.paper)g+=`<rect class="m-sel" x="${X(i-1)}" y="${Y(L)}" width="${sc}" height="${L*sc}"/>`;}
  g+=`<line class="m-zero" x1="${X(b.x0-0.5)}" x2="${X(b.x1+0.5)}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s.finds.forEach(f=>{const cx=X(f.lane-0.5+(f.off||0)),cy=Y(f.dist),r=opts.paper?3.2:4;g+=`<path class="m-mk" d="M${cx} ${cy-r}L${cx+r} ${cy+r*.8}H${cx-r}Z"/>`;});
  if(opts.paper){s.poly.forEach((p,i)=>{g+=`<circle class="m-tp" cx="${X(p[0])}" cy="${Y(p[1])}" r="2.4"/><text class="m-t ink" x="${X(p[0])+4}" y="${Y(p[1])-3}">T${i+1}</text>`;});}
  else{const ps=s.pairs.slice().sort((a,b)=>a.lane-b.lane);ps.forEach(p=>{g+=`<text class="m-t big" x="${X(p.lane-0.5)}" y="${Y(laneLen(s,p.lane))-4}" text-anchor="middle">${p.id}</text>`;});
    for(let i=1;i<ps.length;i++){const y=Y(0)+12+((i%2)*9);g+=`<line class="m-gap" x1="${X(ps[i-1].lane-0.5)}" x2="${X(ps[i].lane-0.5)}" y1="${y}" y2="${y}"/><text class="m-t" x="${(X(ps[i-1].lane-0.5)+X(ps[i].lane-0.5))/2}" y="${y-2}" text-anchor="middle">${(ps[i].lane-ps[i-1].lane)*R.lane} m</text>`;}}
  g+=`<circle cx="${X(0)}" cy="${Y(0)}" r="4.5" fill="var(--ink)"/><text class="m-t ink" x="${X(0)+2}" y="${Y(0)+(opts.paper?24:36)}">NT · nulta tačka</text>`;
  g+=`<text class="m-t" x="${X(b.x1+0.5)}" y="${Y(0)+(opts.paper?24:36)}" text-anchor="end">sigurna staza · nulta linija</text>`;
  Array.from({length:Math.floor(b.y1/10)+1},(_,i)=>i*10).forEach(m=>{g+=`<text class="m-t" x="${padL-4}" y="${Y(m)+3}" text-anchor="end">${m}</text>`;});
  const a=-s.az*D2R, nx=W-22, ny=24, L2=11, vx=Math.sin(-a)*-1, vy=Math.cos(a);
  const ex=nx+(-Math.sin(s.az*D2R))*L2, ey=ny-Math.cos(s.az*D2R)*L2;
  g+=`<circle class="m-n" cx="${nx}" cy="${ny}" r="13"/><line class="m-n" x1="${nx}" y1="${ny}" x2="${ex}" y2="${ey}" stroke-width="2"/><text class="m-t ink" x="${nx+(-Math.sin(s.az*D2R))*20}" y="${ny-Math.cos(s.az*D2R)*20+3}" text-anchor="middle">S</text>`;
  g+=`<text class="m-t" x="${padL}" y="12">m od nulte linije · azimut napredovanja ${s.az}°</text>`;
  g+='</svg>';return g;
}

function p6Fields(){const s=site();const done=s.status==='završeno';const fs=s.finds,by={};fs.forEach(f=>by[f.type]=(by[f.type]||0)+f.qty);

    [12,'Očišćeno pregama kroz radne staze unutar redukovane površine u m²','0'],[13,'Očišćeno manuelno kroz radne staze unutar redukovane površine u m²','0'],

function p6Annex(s){return [['a','Spisak osoba tima sa funkcijama',true],['b','Pregled radnih dana i sati rada sa postignutim efektima',true],['c','Dnevni izvještaji ('+new Set(s.progress.map(p=>p.day)).size+')',true],['d','Pregled korištene opreme',true],['e','Karta očišćene površine sa lomnim tačkama i nalazima',true],['f','Radna skica napredovanja',true],['g','Interni izvještaji o monitoringu ('+s.monitors.length+')',s.monitors.length>0],['h','Opis toka izvođenja aktivnosti',false],['i','Zapisnik o upoznavanju organa vlasti/krajnjeg korisnika',false],['k','Zapisnik o prikupljenim informacijama tokom TI',true]];}
function csvText(){const s=site();const q=v=>{v=String(v==null?'':v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head=['id','msp','ci_si','datum','vrijeme','kategorija','vrsta','kolicina','staza','udaljenost_m','bocno_m','dubina_cm','stanje','postupak',S.crs==='UTM34'?'utm34_E':'gk6_Y',S.crs==='UTM34'?'utm34_N':'gk6_X','wgs84_lat','wgs84_lon','napomena'];

function geoText(){const s=site();const w=(u,v)=>{const g=toGK(s,u,v),p=gk6ToWgs(g.Y,g.X);return [+p.lon.toFixed(7),+p.lat.toFixed(7)];};
  const feats=[{type:'Feature',properties:{vrsta:'POPO',msp:s.msp.id,ci_si:s.ci.oznaka},geometry:{type:'Polygon',coordinates:[s.poly.concat([s.poly[0]]).map(p=>w(p[0],p[1]))]}}];
  for(const l in s.lanes){const d=s.lanes[l];if(d>0)feats.push({type:'Feature',properties:{vrsta:'radna_staza',staza:+l,ocisceno_m:d,sirina_m:R.lane},geometry:{type:'LineString',coordinates:[w(l-0.5,0),w(l-0.5,d)]}});}
  s.finds.forEach(f=>feats.push({type:'Feature',properties:{vrsta:'nalaz',id:f.id,sredstvo:f.type,kategorija:P.cats[f.cat],dubina_cm:f.depth,datum:f.day},geometry:{type:'Point',coordinates:w(f.lane-0.5+(f.off||0),f.dist)}}));
  return JSON.stringify({type:'FeatureCollection',features:feats},null,1);}
function copy(text,label){const out=$('#copyOut');const show=()=>{if(out){out.textContent=text;out.hidden=false;}toast('Kopiranje nije dozvoljeno ovdje. Tekst je ispod.');};
  try{navigator.clipboard.writeText(text).then(()=>{if(out)out.hidden=true;toast(label+' kopiran.');},show);}catch(e){show();}}

/* ================= HITNO ================= */

  const s=site(), i=S.incident;let h='';
  if(!i){h+=`<button class="sos" type="button" data-act="incStart"><b>PRIJAVI NESREĆU</b><span>Zaustavlja rad, mjeri rok od 6 sati i popunjava Prilog 12</span></button>`;}
  else{
    h+=`<div class="inc"><div><div class="label">Od nesreće</div><div class="tv" id="incEl">00:00</div><div style="font-size:12.5px">${esc(i.start)} · staza ${i.lane}</div></div><div><div class="label">Rok za Prilog 12</div><div class="tv" id="incDl">6:00:00</div><div style="font-size:12.5px">BHMAC, 6 sati</div></div></div>
    <div class="card"><h3 style="margin-bottom:6px">Postupak</h3><ol class="steps">${STEPS.map((x,n)=>`<li><label><input type="checkbox" id="step${n}" data-act="step" data-i="${n}" ${i.steps[n]?'checked':''}><span>${esc(x)}</span><span class="t">${i.steps[n]||''}</span></label></li>`).join('')}</ol></div>
    <div class="card"><h3 style="margin-bottom:8px">Podaci za Prilog 12</h3>
      <div class="grid3">${[['ad','Odrasli'],['ch','Djeca'],['lt','Lakše povr.'],['hv','Teže povr.'],['k','Poginuli']].map(([k2,l])=>`<label class="field">${l}<input type="number" min="0" max="20" id="v_${k2}" data-v="${k2}" value="${i.v[k2]}" inputmode="numeric"></label>`).join('')}
      <label class="field">Vrsta ES<select id="iCat" data-ic="cat">${[['PP','PP mina'],['PT','PT mina'],['NUS','NUS'],['?','Nepoznato']].map(([a,b])=>`<option value="${a}" ${i.cat===a?'selected':''}>${b}</option>`).join('')}</select></label></div>
      <label class="field" style="margin-top:10px">Opis<textarea id="iDesc" data-ic="desc" style="font-family:var(--font-body);min-height:60px">${esc(i.desc||'')}</textarea></label>
      <div class="btnrow" style="margin-top:10px"><button class="btn primary" type="button" data-act="doc" data-k="p12" data-from="hitno">Pregledaj Prilog 12</button><button class="btn" type="button" data-act="incEnd">Zatvori incident</button></div></div>`;
  }
  h+=`<div class="card"><h3 style="margin-bottom:6px">Kontakti</h3><ul class="rows">${P.contacts.map(c=>`<li class="contact"><span class="grow"><span class="num">${esc(c[0])}</span><br><span class="sub">${esc(c[1])}</span></span><button class="btn sm" type="button" data-act="copyNum" data-v="${esc(c[0])}">Kopiraj</button></li>`).join('')}
    <li class="contact"><span class="grow"><b>Medicinar: ${esc(MEDIC)}</b><br><span class="sub">Na kontrolnoj tački, ${R.rest} m od radnih staza</span></span></li></ul></div>
  <div class="card"><h3>Sigurnosne udaljenosti</h3>
    <table class="dtab" style="margin-top:6px">${P.distances.map(d=>`<tr><td>${esc(d[0])}</td><td class="n">${esc(d[1])}</td></tr>`).join('')}</table>
    <div class="label" style="margin-top:12px">Pri uništavanju</div>
    <table class="dtab">${P.demolition.map(d=>`<tr><td>${esc(d[0])}</td><td class="n">${esc(d[1])}</td></tr>`).join('')}</table>
    <p class="fine">Izvor: Standard za PMA u BiH, poglavlje 3, Prilog 2. Vrijednosti dolaze iz paketa zemlje i ne mijenjaju se na terenu.</p></div>`;
  $('#v-hitno').innerHTML=h;tick();
}

/* ================= sites sheet ================= */
function openSites(){
  openSheet(`<div class="sheet-h"><div><div class="label">${esc(ORG)}</div><h2>Radilišta</h2></div><button class="x" type="button" data-act="close" aria-label="Zatvori">×</button></div>
    ${S.sites.map(x=>`<button class="sitecard${x.id===S.active?' on':''}" type="button" data-act="pickSite" data-id="${x.id}"><span class="grow"><b>${esc(x.msp.id)} ${esc(x.msp.naziv)} · ${esc(x.ci.oznaka)}</b><br><span class="sub">${esc(x.msp.ru)} · ${num(clearedM2(x))} / ${num(totalArea(x))} m² · ${esc(x.status)}</span></span><span class="chip ${x.status==='u radu'?'work':''}">${x.id===S.active?'aktivno':'otvori'}</span></button>`).join('')}
    <button class="btn primary" type="button" data-act="newSite">+ Novo radilište iz dosijea</button>
    <div><div class="label" style="margin-bottom:6px">Paket zemlje</div><div class="packs">
      <div class="packrow"><span><b>Bosna i Hercegovina</b><br><span class="sub">BHMAC · ${esc(P.standard)}</span></span><span class="chip ok">aktivan</span></div>
      <div class="packrow"><span><b>Srbija</b><br><span class="sub">CZRS · IMSMA Core, obrasci se traže od CZRS-a</span></span><span class="chip">u pripremi</span></div>
      <div class="packrow"><span><b>Slovenija</b><br><span class="sub">URSZR / DEVNUS · samo državna služba</span></span><span class="chip">nije tržište</span></div></div>
      <p class="fine">Jedna aplikacija za sve firme i zemlje. Paket određuje obrasce, koordinatni sistem, pravila i listu sredstava.</p></div>`);
}
function openNewSite(){
  const ex='6 571 898,00 4 922 400,00\n6 571 950,00 4 922 400,00\n6 571 956,00 4 922 440,00\n6 571 930,00 4 922 470,00\n6 571 900,00 4 922 462,00';
  openSheet(`<div class="sheet-h"><div><div class="label">Iz crvene fascikle / operativnog plana</div><h2>Novo radilište</h2></div><button class="x" type="button" data-act="close" aria-label="Zatvori">×</button></div>
  <form id="siteForm">
    <div class="grid2"><label class="field">Oznaka MSP<input id="nsMsp" value="MSP 0455"></label><label class="field">Naziv<input id="nsName" value="Kosa"></label></div>
    <div class="grid2"><label class="field">CI / SI<select id="nsTip"><option value="CI">CI · ciljana</option><option value="SI">SI · sistematska</option></select></label><label class="field">Oznaka<input id="nsCi" value="CI-1"></label></div>
    <label class="field">Koordinatni sistem dosijea<select id="nsCrs"><option value="GK6">Gaus-Kriger zona 6</option><option value="UTM34">UTM 34N</option></select></label>
    <div class="grid3"><label class="field">Nulta tačka Y/E<input id="nsY" value="6571900.00" inputmode="decimal"></label><label class="field">X/N<input id="nsX" value="4922400.00" inputmode="decimal"></label><label class="field">Azimut (°)<input id="nsAz" type="number" min="0" max="359" value="0" inputmode="numeric"></label></div>
    <label class="field">Lomne tačke (Y X, jedna po redu)<textarea id="nsTp">${ex}</textarea><small>Prepiši iz dosijea. Razmaci u broju su dozvoljeni, decimalni zarez ili tačka.</small></label>
    <button class="btn primary block" type="submit">Kreiraj radilište i staze</button>
  </form>`);
  $('#siteForm').addEventListener('submit',e=>{e.preventDefault();createSite();});
}
function parseNum(str){return parseFloat(String(str).replace(/\s/g,'').replace(',','.'));}
function toGkFromCrs(crs,a,b){if(crs==='UTM34'){const w=utm34ToWgs(a,b);return wgsToGk6(w.lat,w.lon);}return {Y:a,X:b};}
function createSite(){
  const crs=$('#nsCrs').value;const nt=toGkFromCrs(crs,parseNum($('#nsY').value),parseNum($('#nsX').value));
  const az=(+$('#nsAz').value||0)%360;
  const tps=$('#nsTp').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.replace(/(\d)\s+(?=\d{3}(\D|$))/g,'$1').split(/[\s;\t]+/).filter(Boolean);return toGkFromCrs(crs,parseNum(m[0]),parseNum(m[1]));});
  if(!isFinite(nt.Y)||!isFinite(nt.X)||tps.length<3||tps.some(p=>!isFinite(p.Y)||!isFinite(p.X))){toast('Provjeri koordinate: treba nulta tačka i najmanje 3 lomne tačke.');return;}
  const s={id:'s'+Date.now(),msp:{id:$('#nsMsp').value.trim()||'MSP',naziv:$('#nsName').value.trim()||'Novo',opcina:'Općina Primjer',ru:'RU Tuzla',karta:'—'},ci:{tip:$('#nsTip').value,oznaka:$('#nsCi').value.trim()||'CI-1',pmin:0,pmax:0},nt,az,poly:[],lanes:{},pairs:[],progress:[],finds:[],log:[],qc:[],monitors:[],info:[],start:null,estEnd:null,status:'planirano'};
  s.poly=tps.map(p=>toLocal(s,p.Y,p.X).map(v=>+v.toFixed(2)));
  const b=bounds(s.poly);if(b.y1<=0||b.x1<=0){toast('Lomne tačke su iza nulte linije ili lijevo od nulte tačke. Provjeri azimut.');return;}
  const A=polyArea(s.poly);s.ci.pmin=Math.round(A*0.9);s.ci.pmax=Math.round(A*1.1);
  S.sites.push(s);S.active=s.id;addQ('Novo radilište '+s.msp.id);save();closeSheet();go('mapa');toast('Radilište kreirano: '+num(A)+' m², '+laneCount(s)+' staza.');
}
function openSiteWork(){const s=site();const lc=laneCount(s);const l1=1,l2=Math.min(lc,1+R.pairGap+1),l3=Math.min(lc,l2+R.pairGap+1);
  s.pairs=[{id:'A',a:'D-01',b:'D-02',lane:l1,inA:true,shift:Date.now()}];if(l2-l1>=R.pairGap)s.pairs.push({id:'B',a:'D-03',b:'D-04',lane:l2,inA:true,shift:Date.now()});if(l3-l2>=R.pairGap)s.pairs.push({id:'C',a:'D-05',b:'D-06',lane:l3,inA:true,shift:Date.now()});
  s.status='u radu';s.start=TODAY;s.estEnd=dayKey(addDays(NOW0,30));s.log.push({t:hm(Date.now()),e:'Otvaranje radilišta; dvojci u stazama '+s.pairs.map(p=>p.lane).join(', ')});save();rerender();toast('Radilište otvoreno. Dvojci raspoređeni na najmanje '+R.pairGap+' m.');}

/* ================= event sheets ================= */
function openEvent(k){
  const s=site();const lanes=s.pairs.map(p=>p.lane);
  const F={
    det:{t:'Test detektora',body:`<p class="sub">Test na UPMAH-3 ukopanom na 10 cm (13 cm s vegetacijom).</p><label class="field">Ispravnih detektora<input id="eN" type="number" min="0" value="6"></label>`},
    qc:{t:'Interna kontrola kvaliteta',body:`<div class="grid2"><label class="field">Staza<input id="eLane" type="number" min="1" value="${lanes[0]||1}"></label><label class="field">Uzorak (m²)<input id="eM2" type="number" step="0.5" min="0.5" value="3"></label></div><label class="field">Metoda<select id="eMet"><option>detektor</option><option>pipalica</option><option>kombinacija</option><option>vizuelno</option></select></label><label class="field">Rezultat<select id="eRes"><option>bez nalaza</option><option>pronađena greška, staza vraćena na ponovni tretman</option></select></label>`},
    mon:{t:'Interni nadzor',body:`<label class="field">Nadzor obavio<input id="eBy" value="Supervizor I. Jukić"></label>`},
    dem:{t:'Uništavanje',body:`<p class="sub">Sredstva koja čekaju uništavanje:</p>${s.finds.filter(f=>f.act===ACTIONS[0]).map(f=>`<label style="display:flex;gap:10px;align-items:center;padding:6px 0"><input type="checkbox" class="dmf" value="${f.id}" checked style="width:20px;height:20px">${esc(f.id+' '+f.type+' · staza '+f.lane)}</label>`).join('')||'<p class="sub">Nema sredstava na čekanju.</p>'}<label class="field">Utrošeno ES (kg TNT)<input id="eKg" type="number" step="0.05" min="0" value="0.2"></label>`},
    visit:{t:'Posjeta',body:`<label class="field">Ko je posjetio<input id="eWho" value="Inspektor za KK, BHMAC"></label>`},
    info:{t:'Nova informacija o miniranosti',body:`<label class="field">Opis i izvor<textarea id="eInfo" style="font-family:var(--font-body)">Mještanin navodi da je 1993. put ispod kote miniran PROM-1.</textarea></label>`}
  }[k];
  openSheet(`<div class="sheet-h"><div><div class="label">Dnevnik · ${hm(Date.now())}</div><h2>${F.t}</h2></div><button class="x" type="button" data-act="close" aria-label="Zatvori">×</button></div>${F.body}<button class="btn primary block" type="button" data-act="evSave" data-k="${k}">Upiši u dnevnik</button>`);
}
function saveEvent(k){const s=site(),t=hm(Date.now());let e='';
  if(k==='det'){e='Test detektora na UPMAH-3 (10 cm): '+(+$('#eN').value||0)+' detektora ispravno';s.log.push({t,e,k:'det'});}
  if(k==='qc'){const m2=parseFloat($('#eM2').value)||0;e='Interna KK (vođa tima): staza '+$('#eLane').value+', '+$('#eMet').value+', uzorak '+num(m2,1)+' m², '+$('#eRes').value;s.qc.push({day:TODAY,m2});s.log.push({t,e,k:'qc'});}
  if(k==='mon'){const by=$('#eBy').value.trim();s.monitors.push({day:TODAY,by});e='Interni nadzor: '+by;s.log.push({t,e,k:'mon'});}
  if(k==='dem'){const ids=[...document.querySelectorAll('.dmf:checked')].map(x=>x.value);const kg=parseFloat($('#eKg').value)||0;ids.forEach(id=>{const f=s.finds.find(x=>x.id===id);if(f)f.act=ACTIONS[1];});e='Uništavanje na licu mjesta: '+(ids.join(', ')||'—')+'; utrošeno '+num(kg,2)+' kg TNT';s.log.push({t,e,k:'dem',kg});}
  if(k==='visit'){e='Posjeta: '+$('#eWho').value.trim();s.log.push({t,e});}
  if(k==='info'){const x=$('#eInfo').value.trim();s.info.push({day:TODAY,t:x});e='Nova informacija o miniranosti: '+x;s.log.push({t,e,k:'info'});}
  addQ(e.slice(0,40));save();closeSheet();rerender();toast('Upisano u dnevnik u '+t+'.');}

/* ================= timers ================= */
function tick(){
  const s=site();
  document.querySelectorAll('[data-timer]').forEach(el=>{const p=s.pairs.find(x=>x.id===el.dataset.timer);if(!p)return;const st=pairState(p);el.textContent=fmtRem(st.rem);const row=el.closest('.pair');if(row)row.classList.toggle('over',st.over);});
  const i=S.incident;if(i){const e=$('#incEl'),d=$('#incDl');const el=Date.now()-i.t0;if(e){const sec=Math.floor(el/1000);e.textContent=pad(Math.floor(sec/60))+':'+pad(sec%60);}
    if(d){const rem=Math.max(0,R.accidentH*36e5-el),sec=Math.floor(rem/1000);d.textContent=Math.floor(sec/3600)+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60);}}
}
setInterval(tick,1000);

/* ================= nav ================= */
const RENDER={danas:renderDanas,mapa:renderMapa,nalaz:renderNalaz,izvjestaji:renderIzvjestaji,hitno:renderHitno};
function go(t){tab=t;if(t!=='izvjestaji')docView=null;
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+t);
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  RENDER[t]();renderHeader();$('#main').scrollTop=0;try{localStorage.setItem(KEY+'-tab',t);}catch(e){}}
function rerender(){if(tab!=='nalaz')RENDER[tab]();renderHeader();}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='scrim')closeSheet();return;}
  const a=el.dataset.act, s=site();
  switch(a){
    case 'tab':closeSheet();go(el.dataset.tab);break;
    case 'close':closeSheet();break;
    case 'sites':openSites();break;
    case 'pickSite':S.active=el.dataset.id;save();closeSheet();go(tab==='nalaz'?'danas':tab);break;
    case 'newSite':openNewSite();break;
    case 'openSite':openSiteWork();break;
    case 'lane':openLane(+el.dataset.l);break;
    case 'adv':{const l=+el.dataset.l,m=parseFloat(el.dataset.m),L=laneLen(s,l),from=laneDone(s,l),to=Math.min(L,+(from+m).toFixed(2));if(to>from){s.progress.push({day:TODAY,lane:l,from,to});s.lanes[l]=to;addQ('Napredovanje staza '+l);save();}openLane(l);renderHeader();toast('Staza '+l+': očišćeno do '+num(to,1)+' m.');break;}
    case 'moveA':{const l=+el.dataset.l;const p=s.pairs[0];if(p){const others=s.pairs.filter(x=>x!==p);if(others.some(o=>Math.abs(o.lane-l)*R.lane<R.pairGap)){toast('Staza '+l+' je bliže od '+R.pairGap+' m drugom dvojcu. Izaberi drugu stazu.');break;}p.lane=l;s.log.push({t:hm(Date.now()),e:'Dvojac '+p.id+' premješten u stazu '+l});save();openLane(l);}break;}
    case 'findHere':{prefill={lane:+el.dataset.l,dist:laneDone(s,+el.dataset.l)};closeSheet();go('nalaz');break;}
    case 'shift':{const p=s.pairs.find(x=>x.id===el.dataset.p);const st=pairState(p);p.inA=!p.inA;p.shift=Date.now();s.log.push({t:hm(Date.now()),e:'Smjena u stazi '+p.lane+': '+st.support+' ulazi, '+st.inLane+' podrška na '+R.pairGap+' m'});save();renderDanas();break;}
    case 'ev':openEvent(el.dataset.k);break;
    case 'evSave':saveEvent(el.dataset.k);break;
    case 'brief':S.brief[+el.dataset.i]=el.checked;if(S.brief.every(Boolean))S.briefAt=hm(Date.now());save();renderDanas();break;
    case 'start':S.dayStarted=true;s.log.push({t:hm(Date.now()),e:'Početak rada'});save();renderDanas();break;
    case 'crs':S.crs=el.value;save();break;
    case 'doc':docView=el.dataset.k;if(tab!=='izvjestaji'){tab='izvjestaji';document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-izvjestaji');document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab==='izvjestaji')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}renderDoc(docView);$('#main').scrollTop=0;break;
    case 'docBack':docView=null;renderIzvjestaji();break;
    case 'print':try{window.print();}catch(err){}break;
    case 'copyDoc':copy($('#docEl').innerText,'Izvještaj');break;
    case 'copyCsv':copy(csvText(),'CSV');break;
    case 'copyGeo':copy(geoText(),'GeoJSON');break;
    case 'copyNum':copy(el.dataset.v,'Broj');break;
    case 'incStart':{const p=s.pairs[0]||{lane:1};S.incident={t0:Date.now(),day:TODAY,start:hm(Date.now()),lane:p.lane,dist:laneDone(s,p.lane),steps:STEPS.map(()=>null),v:{ad:1,ch:0,lt:0,hv:1,k:0},cat:'PP',desc:''};s.log.push({t:S.incident.start,e:'NESREĆA u stazi '+p.lane+'; rad zaustavljen',k:'find'});addQ('NESREĆA prijavljena');save();renderHitno();renderHeader();break;}
    case 'step':S.incident.steps[+el.dataset.i]=el.checked?hm(Date.now()):null;save();renderHitno();{const f=$('#step'+el.dataset.i);if(f)f.focus();}break;
    case 'incEnd':S.incidents.push(Object.assign({},S.incident,{end:hm(Date.now())}));S.incident=null;save();renderHitno();toast('Incident zatvoren i sačuvan.');break;
    case 'sync':{const b=$('#syncBtn');if(b.classList.contains('busy'))break;if(!S.queue.length){toast('Sve je već poslato.');break;}const n=S.queue.length;b.classList.add('busy');$('#syncLabel').textContent='Šaljem '+n+'…';
      setTimeout(()=>{S.queue=[];S.sites.forEach(x=>x.finds.forEach(f=>f.synced=true));S.lastSync=hm(Date.now());save();b.classList.remove('busy');renderHeader();toast('Poslato '+n+' zapisa šefu projekta.');},1300);break;}
    case 'reset':try{localStorage.removeItem(KEY);}catch(err){}S=seed();save();go('danas');toast('Početni podaci vraćeni.');break;
  }
});
document.addEventListener('input',e=>{const t=e.target;if(!S.incident)return;if(t.dataset.v){S.incident.v[t.dataset.v]=Math.max(0,+t.value||0);save();}if(t.dataset.ic){S.incident[t.dataset.ic]=t.value;save();}});
document.addEventListener('change',e=>{const t=e.target;if(S.incident&&t.dataset.ic==='cat'){S.incident.cat=t.value;save();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)closeSheet();});

let start='danas';try{const t=localStorage.getItem(KEY+'-tab');if(t&&RENDER[t])start=t;}catch(e){}
const hash=(location.hash||'').slice(1);if(RENDER[hash])start=hash;
go(start);
})();
</script>
