<title>Terenska knjiga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first field app. Status header with site switcher, one scrolling view, tab bar at the bottom.
   High contrast for sunlight, large targets for gloved hands. Red is reserved for hazard. Documents render as paper forms. */
:root{
  --bg:#E8EBE3; --surface:#F7F8F4; --surface-2:#FFFFFF; --ink:#1A1F19; --muted:#59625A; --line:#CBD1C4;
  --accent:#1F3D35; --on-accent:#F3F7F2;
  --hazard:#BF2A1C; --on-hazard:#FFFFFF; --haz-soft:#F1D5CE;
  --cleared:#2B784A; --clr-soft:#C8E2D0;
  --work:#A86F0B; --work-soft:#F4DFAF;
  --ok-ink:#1D5A36; --work-ink:#6B4404; --haz-ink:#8E1F14;
  --paper:#FFFFFF; --paper-ink:#111511;
  /* no web fonts are fetched at runtime: brand fonts are used if self-hosted (build.sh, docs/fonts) or installed, else the system's */
  --font-display:"Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,"Roboto Mono","Droid Sans Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F120F; --surface:#171B16; --surface-2:#1E231D; --ink:#E5E9E0; --muted:#97A190; --line:#2C3229;
    --accent:#A8D0C2; --on-accent:#0D1915;
    --hazard:#EC5B45; --on-hazard:#1B0805; --haz-soft:#3A1C17;
    --cleared:#5CBF85; --clr-soft:#1B3223;
    --work:#E7B142; --work-soft:#3A2E12;
    --ok-ink:#5CBF85; --work-ink:#E7B142; --haz-ink:#F07A66;
    --paper:#F4F3EE; --paper-ink:#111511;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F120F; --surface:#171B16; --surface-2:#1E231D; --ink:#E5E9E0; --muted:#97A190; --line:#2C3229;
  --accent:#A8D0C2; --on-accent:#0D1915;
  --hazard:#EC5B45; --on-hazard:#1B0805; --haz-soft:#3A1C17;
  --cleared:#5CBF85; --clr-soft:#1B3223;
  --work:#E7B142; --work-soft:#3A2E12;
  --ok-ink:#5CBF85; --work-ink:#E7B142; --haz-ink:#F07A66;
  --paper:#F4F3EE; --paper-ink:#111511;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}

.app{position:relative;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.site-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;padding:4px 6px;margin:-4px -6px;border-radius:8px;text-align:left;min-width:0}
.site-btn:hover{background:var(--bg)}
.site-code{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:6px;white-space:nowrap}
.site-code svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2.2}
.site-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pack{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);font-weight:500;letter-spacing:0}
.sync{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;min-height:44px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.sync #syncLabel{line-height:1.2;text-align:left;font-size:11.5px}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--work);flex:none}
.sync.ok .dot{background:var(--cleared)}
.sync.busy .dot{animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.25}}

main{flex:1;overflow-y:auto;padding:14px 14px 22px;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.01em}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}

.big{font-family:var(--font-display);font-weight:700;font-size:50px;line-height:.95;font-variant-numeric:tabular-nums}
.big .unit{font-size:21px;margin-left:4px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--haz-soft);overflow:hidden;margin:12px 0 4px}
.bar span{display:block;height:100%;background:var(--cleared);border-radius:5px;transition:width .4s}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 0}
.kv3 dt{font-size:11.5px;color:var(--muted)}
.kv3 dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{background:var(--hazard);color:var(--on-hazard);border-color:var(--hazard)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;padding:6px 12px;font-size:13.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 130px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:6px 8px;min-height:44px;display:inline-flex;align-items:center}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.chip.work{background:var(--work-soft);color:var(--ink)}
.chip.ok{background:var(--clr-soft);color:var(--ink)}
.chip.haz{background:var(--haz-soft);color:var(--ink)}
.tri{width:16px;height:14px;flex:none}
.tri path{fill:var(--hazard)}

/* pairs */
.pair{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pair:first-of-type{border-top:0}
.pair .tag{font-family:var(--font-display);font-weight:700;font-size:22px;width:34px;height:34px;border-radius:8px;background:var(--bg);display:grid;place-items:center}
.pair .t{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.pair.over .t{color:var(--hazard)}
.pair.over .tag{background:var(--haz-soft)}

/* compliance */
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.chk .ok .ic,.chk li.ok .ic{background:var(--clr-soft);color:var(--ok-ink)}
.chk li.warn .ic{background:var(--work-soft);color:var(--work-ink)}
.chk li.info .ic{background:var(--bg);color:var(--muted)}
.chk li.bad .ic{background:var(--haz-soft);color:var(--haz-ink)}
.chk .v{font-family:var(--font-mono);font-size:12.5px;text-align:right;white-space:nowrap}

/* log */
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .tm{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);padding-top:1px}
.log li.find .ev{color:var(--hazard);font-weight:500}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.quick .btn{min-height:44px;padding:6px 8px;font-size:13px;font-weight:500}

.checks{list-style:none;margin:0;padding:0}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;font-size:14px}
.checks input{width:22px;height:22px;margin:0;accent-color:var(--cleared);flex:none}
.notice{font-size:13px;padding:9px 11px;border-radius:8px;background:var(--work-soft);margin:6px 0 10px}
.notice.haz{background:var(--haz-soft)}

/* map */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mapwrap{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap.zoom{overflow:auto;max-height:62vh;overscroll-behavior:contain}.mapwrap.zoom svg{width:auto;max-width:none}
.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}.maptools .field{flex:1 1 140px}
.m-hit:focus-visible,.bxp:focus-visible{outline:none;stroke:var(--accent);stroke-width:3}
.m-poly{fill:var(--haz-soft);stroke:var(--hazard);stroke-width:1.4;stroke-dasharray:5 3}
.m-safe{fill:var(--clr-soft)}
.m-zero{stroke:var(--ink);stroke-width:2}
.m-lane{fill:var(--cleared)}
.m-lane-p{fill:var(--work)}
.m-hit{fill:transparent;cursor:pointer}
.m-hit:hover{fill:rgba(0,0,0,.06)}
.m-sel{fill:none;stroke:var(--ink);stroke-width:1.5}
.m-mk{fill:var(--hazard);stroke:var(--surface-2);stroke-width:.8;pointer-events:none}
.m-t{fill:var(--muted);font-family:var(--font-mono);font-size:8.5px}
.m-t.ink{fill:var(--ink)}
.m-t.big{font-family:var(--font-display);font-weight:700;font-size:12px;fill:var(--ink)}
.m-gap{stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 2}
.m-tp{fill:var(--surface-2);stroke:var(--hazard);stroke-width:1.2}
.m-n{stroke:var(--ink);stroke-width:1.2;fill:none}
.m-nf{fill:var(--ink)}
.bxp{stroke:var(--surface-2);stroke-width:1.2;cursor:pointer}
.bx-n{fill:var(--haz-soft)}.bx-p{fill:var(--work-soft)}.bx-d{fill:var(--cleared)}
.bx-a{stroke:var(--work);stroke-width:2}.bx-s{stroke:var(--ink);stroke-width:2.2}
.bxp:hover{filter:brightness(.95)}
.m-rail{fill:none;stroke:#8c9a2e;stroke-width:2.2;pointer-events:none}
.bx-x{fill:url(#bxX)}.bx-m{stroke:var(--accent);stroke-width:2.6;stroke-dasharray:4 2}
.m-bid{font-family:var(--font-mono);font-size:7px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--surface-2);stroke-width:2px}
.m-buf{fill:none;stroke:#8c9a2e;stroke-opacity:.22;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.m-bufp{fill:#8c9a2e;fill-opacity:.22;pointer-events:none}
.bxed{border:1px solid var(--line);border-radius:8px;padding:6px 10px}.bxed summary{font-weight:600;font-size:14px;cursor:pointer;min-height:44px;display:flex;align-items:center}
.bxed-in{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.nsf select,.nsf input{min-height:44px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:14px}.nsf input{width:70px}
.doc svg.sk{border:0;margin:0;background:none;width:100%;height:auto}
.sk text{font-family:var(--font-body);fill:#1d2a33}
.sk .sk-t{font-family:var(--font-display);font-weight:700;font-size:5.2px;letter-spacing:.35px}
.sk .sk-s{font-size:2.9px}.sk .sk-l{font-size:2.35px}.sk .sk-c{font-family:var(--font-mono);font-size:1.9px;fill:#4b6474}
.sk .sk-b{font-family:var(--font-mono);font-size:1.6px;fill:#5d7180}
.doc.skdoc{padding:6px}

/* persistent storage warning (never a toast only) and the recovery screen */
.savewarn{background:var(--hazard);color:var(--on-hazard);padding:8px 14px;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.savewarn .btnrow{gap:6px}.savewarn .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);flex:0 1 auto}
.updbar{background:var(--accent);color:var(--on-accent);padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.updbar .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);flex:none}
.legacy{margin-top:8px;font-size:13px}.legacy summary{cursor:pointer;color:var(--muted);min-height:44px;display:flex;align-items:center}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,14,10,.4);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--surface-2);border-top-left-radius:16px;border-top-right-radius:16px;padding:16px 16px 20px;border-top:1px solid var(--line);max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.kv dd.mono{overflow-wrap:normal}
.sitecard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.sitecard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.packs{display:grid;gap:6px}
.packrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--bg)}

/* forms */
form{display:flex;flex-direction:column;gap:14px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.flabel{font-size:13px;font-weight:600;margin-bottom:6px;padding:0;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label span{display:inline-flex;align-items:center;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13.5px;cursor:pointer}
.chips.mono label span{font-family:var(--font-mono);font-size:13px}
.chips input:checked + span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.orgf .grid2{align-items:end}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
.field input,.field select,.field textarea{min-height:46px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:400;font-size:15px;width:100%}
.field textarea{min-height:90px;resize:vertical;font-family:var(--font-mono);font-size:13px}
.field small{font-weight:400;color:var(--muted);font-size:12px}
.calc{padding:11px 12px;border-radius:8px;background:var(--clr-soft);font-size:13px;display:flex;flex-direction:column;gap:3px}
.calc .mono{font-size:13.5px;font-weight:500}
.calc.warn{background:var(--work-soft)}
.gpsrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.nw{white-space:nowrap}
.photo{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;background:var(--surface-2);font-size:14px;font-weight:500}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.photo .ph{width:56px;height:56px;border-radius:6px;background:var(--bg);display:grid;place-items:center;flex:none}
.photo .ph svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:1.8}

/* reports list */
.doclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.docitem{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px}
.docitem .pn{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.05;text-align:center;background:var(--bg);border-radius:6px;padding:7px 2px}
.docitem b{display:block;font-size:14.5px;line-height:1.3}

/* paper document */
.doc{--ink:#111511;--muted:#4c544c;--surface-2:#fff;--hazard:#BF2A1C;--haz-soft:#F1D5CE;--cleared:#2B784A;--clr-soft:#C8E2D0;--work:#A86F0B;--work-soft:#F4DFAF;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:18px 16px;font-size:12.5px;line-height:1.4;box-shadow:0 1px 0 var(--line)}
.doc h4{font-family:var(--font-body);font-size:14px;font-weight:700;text-align:center;margin:6px 0 2px;letter-spacing:.04em}
.doc .dsub{text-align:center;font-size:11.5px;margin-bottom:12px}
.doc .dorg{border-bottom:1px dotted #111511;padding-bottom:2px;text-align:center;font-weight:600}
.doc .dsmall{font-size:10.5px;text-align:center;color:#3c433c}
.doc table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
.doc th,.doc td{border:1px solid #111511;padding:4px 5px;vertical-align:top;text-align:left;color:#111511}
.doc th{font-weight:600;background:#eef0ea;font-size:11px}
.doc td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc td.k{width:42%;font-weight:500}
.doc .box{display:inline-block;width:11px;height:11px;border:1px solid #111511;vertical-align:-1px;margin:0 3px 0 8px;text-align:center;line-height:9px;font-size:10px;font-weight:700}
.doc .sec{font-weight:700;margin:12px 0 4px;font-size:12.5px}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px;font-size:11px}
.doc .sig div{border-top:1px solid #111511;padding-top:3px}
.doc .miss{background:#f6dcc8;padding:0 3px}
.doc .note{font-size:10.5px;color:#3c433c;margin-top:8px}
.doc svg{display:block;width:100%;height:auto;border:1px solid #111511;margin:6px 0;background:#fff}
.tbl{overflow-x:auto}
.doc.wide{min-width:640px}
.doc.z2,.docs.z2{min-width:720px}.doc.z3,.docs.z3{min-width:1080px}
.scrollhint{margin:0}
/* BiH forms (BHMAC prilozi): paper in both themes */
.doc .ptag{text-align:right;font-size:10px;color:#4c544c;margin:-6px 0 4px}
.doc .pre{font-size:11px;margin:0 0 6px}
.doc td.k2{width:20%;font-weight:500}
.doc .opt{display:inline-block;margin:1px 12px 1px 0;white-space:nowrap}
.doc .opt .box{margin-left:0}
.doc .l3{display:block;line-height:1.2}.doc .l3 b,.doc .l3 span,.doc .l3 i{display:block}.doc .l3 span{font-size:10px}.doc .l3 i{font-size:10px;color:#3c433c}

const LANGS=['bs','sr','en'],UI_OPTS=['auto','bs','sr','en'];
const KEY_UI='terenska-knjiga-ui'; // mirror of an explicit choice, so the recovery screen (no state loaded) speaks it too
let DOCLANG=null;
const T_MISS=new Set();
function bootLang(){try{const v=localStorage.getItem(KEY_UI);return LANGS.includes(v)?v:'bs';}catch(e){return 'bs';}}
const packLang=s=>s&&s.pack==='RS'?'sr':'bs';
function uiLang(){if(!S||!S.sites||!S.sites.length)return bootLang();return LANGS.includes(S.ui)?S.ui:packLang(site());}
const lang=()=>DOCLANG||uiLang();
const isEn=()=>lang()==='en';
function inDoc(s,fn){const o=DOCLANG;DOCLANG=packLang(s||(S&&S.sites&&S.sites.length?site():null));try{return fn();}finally{DOCLANG=o;}}
function inUi(fn){const o=DOCLANG;DOCLANG=null;try{return fn();}finally{DOCLANG=o;}}
const plIdx=(l,n)=>{n=Math.abs(Math.trunc(n));if(l==='en')return n===1?0:1;const a=n%10,b=n%100;return a===1&&b!==11?0:(a>=2&&a<=4&&(b<12||b>14)?1:2);};
function t(k,v){const l=lang();let s=I18N[l][k];if(s==null)s=I18N.bs[k];if(s==null){T_MISS.add(k);return k;}
  if(Array.isArray(s)){const n=v&&v.n!=null?+v.n:0;s=s[Math.min(s.length-1,plIdx(l,isFinite(n)?n:0))];}
  return v?s.replace(/\{(\w+)\}/g,(m,x)=>x in v?String(v[x]):m):s;}
// stored national values (pack lists, find condition, action, status...) shown on screen: an English gloss in English, as stored otherwise
const tv=x=>{if(lang()!=='en')return x;const g=I18N.en['v.'+x];return g==null?x:g;};
function setHtmlLang(){try{const d=document.documentElement;if(d&&d.lang!==uiLang())d.lang=uiLang();}catch(e){}}
// the selector in the sites sheet: saved with the state, mirrored for the recovery screen, every open screen redrawn
function onUiLang(v){if(!S)return;S.ui=UI_OPTS.includes(v)?v:'auto';
  try{if(S.ui==='auto')localStorage.removeItem(KEY_UI);else localStorage.setItem(KEY_UI,S.ui);}catch(e){}
  save();rerender();openSites();toast(t('lang.set',{l:t('lang.'+S.ui)}));}
/* ================= geodesy: GK zone 6 (MGI 1901 / Bessel) and UTM 34N (WGS84) ================= */
const D2R=Math.PI/180;
const ELL={bessel:{a:6377397.155,f:1/299.1528128},wgs84:{a:6378137,f:1/298.257223563}};
const MGI_SHIFT=[682,-203,480]; // demo 3-parameter shift; confirm with BHMAC
// Transverse Mercator by the Krüger n-series (4th order, Karney 2011): sub-millimetre well beyond the 3° of a zone,

function tmFwd(lat,lon,el,lon0,k0,FE){const c=kc(el),p=lat*D2R,dl=(lon-lon0)*D2R,t=Math.sinh(Math.atanh(Math.sin(p))-c.e*Math.atanh(c.e*Math.sin(p)));
  const xi=Math.atan(t/Math.cos(dl)),eta=Math.atanh(Math.sin(dl)/Math.sqrt(1+t*t));let x=eta,y=xi;
  for(let j=1;j<=4;j++){x+=c.al[j]*Math.cos(2*j*xi)*Math.sinh(2*j*eta);y+=c.al[j]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);}return {E:FE+k0*c.A*x,N:k0*c.A*y};}
function tmInv(E,N,el,lon0,k0,FE){const c=kc(el),xi=N/(k0*c.A),eta=(E-FE)/(k0*c.A);let x1=xi,e1=eta;
  for(let j=1;j<=4;j++){x1-=c.be[j]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);e1-=c.be[j]*Math.cos(2*j*xi)*Math.sinh(2*j*eta);}

function frame(site){const a=site.az*D2R;return {F:[Math.sin(a),Math.cos(a)],Rt:[Math.cos(a),-Math.sin(a)]};}
function toGK(site,u,v){const {F,Rt}=frame(site);return {Y:site.nt.Y+u*Rt[0]+v*F[0],X:site.nt.X+u*Rt[1]+v*F[1]};}

function polyArea(poly){let s=0;for(let i=0,j=poly.length-1;i<poly.length;j=i++)s+=(poly[j][0]+poly[i][0])*(poly[j][1]-poly[i][1]);return Math.abs(s/2);}
function bounds(poly){const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]);return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};}
// A lane i is the strip u∈[i−1,i] from the zero line. Its length is the farthest point of the boundary anywhere across the
// whole 1 m width (exact polygon/strip intersection, rounded up to the cm), so "Do kraja" never leaves a sliver untreated.
function laneLen(site,i){if(site._ll&&site._ll[i]!=null)return site._ll[i];const p=clipRect(site.poly,i-1,0,i,1e7);
  const L=p.length?Math.ceil(Math.max(...p.map(q=>q[1]))*100-1e-6)/100:0;(site._ll=site._ll||{})[i]=L;return L;}
function laneCount(site){const b=bounds(site.poly);return Math.max(0,Math.ceil(b.x1-1e-9));}
// m² of the boundary polygon inside lane l between a and b metres (a slanted boundary cuts the last metre)
function segM2(s,l,a,b){if(!(b>a))return 0;const p=clipRect(s.poly,l-1,a,l,b);return p.length?polyArea(p):0;}
// part of the boundary that no lane covers (left of the nulta tačka or behind the zero line)
function uncoveredM2(s){if(s.mode==='boxes')return 0;const b=bounds(s.poly),p=clipRect(s.poly,0,0,Math.max(1,b.x1)+1,Math.max(1,b.y1)+1);return Math.max(0,polyArea(s.poly)-(p.length?polyArea(p):0));}

const findLocal=f=>f.u!=null?[f.u,f.v]:[f.lane-0.5+(f.off||0),f.dist];

/* ================= stats ================= */
function laneDone(s,l){return s.lanes[l]||0;}
function clearedM2(s){if(s.mode==='boxes')return s.boxes.filter(boxDone).reduce((a,b)=>a+b.area,0);let t=0;for(const l in s.lanes)t+=segM2(s,+l,0,s.lanes[l]);return t;}
function todayM2(s){return s.progress.filter(p=>p.day===today()).reduce((a,p)=>a+segM2(s,p.lane,p.from,p.to),0);}
function rangeM2(s,a,b){return s.progress.filter(p=>p.day>=a&&p.day<=b).reduce((x,p)=>x+segM2(s,p.lane,p.from,p.to),0);}
function totalArea(s){return polyArea(s.poly)-(s.mode==='boxes'?exclM2(s):0);}
function qcM2(s){return s.qc.reduce((a,q)=>a+q.m2,0);}
function workdaysSince(k){let n=0,d=new Date(k+'T12:00:00');const end=new Date(today()+'T12:00:00');while(d<end){d=addDays(d,1);if(d.getDay()!==0&&d.getDay()!==6)n++;}return n;}
// Monday-to-Sunday week containing d
function weekOf(d){const x=new Date(d);x.setHours(12,0,0,0);const mon=addDays(x,-((x.getDay()+6)%7));return {mon,from:dayKey(mon),to:dayKey(addDays(mon,6))};}
// week reported in P11: the last completed week (due Monday 16:00 of this week), or the running week as a draft
function p11Range(running){const c=weekOf(new Date());if(running===undefined)running=p11Cur;
  if(running){const dl=addDays(c.mon,7);dl.setHours(16,0,0,0);return {from:c.from,to:c.to,deadline:dl,running:true};}
  const m=addDays(c.mon,-7),dl=new Date(c.mon);dl.setHours(16,0,0,0);return {from:dayKey(m),to:dayKey(addDays(m,6)),deadline:dl,running:false};}
function weeklyWindow(){const now=new Date();let d=new Date(now);const dow=d.getDay();let add=(8-dow)%7;if(dow===1&&now.getHours()<16)add=0;if(add===0&&!(dow===1&&now.getHours()<16))add=7;
  const dl=addDays(now,add);dl.setHours(16,0,0,0);const wEnd=addDays(dl,-1),wStart=addDays(dl,-7);return {deadline:dl,from:dayKey(wStart),to:dayKey(wEnd)};}

function pairState(p){const rem=R.shiftMax*60e3-(Date.now()-p.shift);return {rem,over:rem<0,inLane:p.inA?p.a:p.b,support:p.inA?p.b:p.a};}
function fmtRem(ms){const neg=ms<0;ms=Math.abs(ms);const s=Math.floor(ms/1000);return (neg?'+':'')+pad(Math.floor(s/60))+':'+pad(s%60);}
function compliance(s){
  const out=[];
  const det=dayLog(s,today()).some(l=>l.k==='det');
  out.push({k:'det',st:det?'ok':'bad',t:t('danas.cDet'),v:det?t('danas.cDone'):t('danas.cNotDone')});
  const lanes=s.pairs.filter(p=>s.lanes[p.lane]!==undefined||true).map(p=>p.lane).sort((a,b)=>a-b);
  let minGap=Infinity;for(let i=1;i<lanes.length;i++)minGap=Math.min(minGap,(lanes[i]-lanes[i-1])*R.lane);
  if(lanes.length>1)out.push({k:'gap',st:minGap>=R.pairGap?'ok':'bad',t:t('danas.cGap',{m:R.pairGap}),v:num(minGap)+' m'});
  const over=s.pairs.filter(p=>pairState(p).over);
  if(s.pairs.length)out.push({k:'shift',st:over.length?'bad':'ok',t:t('danas.cShift',{m:R.shiftMax}),v:over.length?t('danas.cOver',{ids:over.map(p=>p.id).join(', ')}):t('danas.cOk')});
  const cl=clearedM2(s),q=qcM2(s),pct=cl?q/cl*100:0;
  out.push({k:'qc',st:pct>=R.qcMin?'ok':'warn',t:t('danas.cQc',{p:R.qcMin}),v:num(pct,1)+'% ('+num(q,1)+' m²)'});
  const lastMon=s.monitors.length?s.monitors[s.monitors.length-1].day:s.start;const wd=lastMon?workdaysSince(lastMon):0;
  out.push({k:'mon',st:wd<R.monitorDays?(wd>=R.monitorDays-1?'warn':'ok'):'bad',t:t('danas.cMon',{d:R.monitorDays}),v:t(s.monitors.length?'danas.cAgo':'danas.cMonNone',{n:wd})});
  const w=weeklyWindow();const ms=w.deadline-Date.now();const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);
  out.push({k:'week',st:ms<864e5?'warn':'ok',t:t('danas.cWeekly'),v:t('danas.cDue',{d:d?d+' d ':'',h})});
  return out;
}

let mapZoom=false;const LANE_PX=48;
function mapSVG(s,opts={}){
  const b=bounds(s.poly),zoom=!opts.paper&&opts.zoom, padL=26, padR=14, padT=22, padB=opts.paper?44:56;
  const W=zoom?Math.round(padL+padR+(b.x1-b.x0+2)*LANE_PX):(opts.w||330);
  const sc=(W-padL-padR)/(b.x1-b.x0+2);
  const H=Math.round((b.y1+2.5)*sc+padT+padB);
  const X=u=>padL+(u-b.x0+1)*sc, Y=v=>padT+(b.y1+0.5-v)*sc;
  const lc=laneCount(s);
  let g=`<svg viewBox="0 0 ${W} ${H}" ${zoom?`width="${W}" height="${H}"`:''} role="group" aria-label="${t('map.svgAria',{ci:esc(s.ci.oznaka)})}">`;
  g+=`<rect class="m-safe" x="${X(b.x0-0.5)}" y="${Y(0)}" width="${(b.x1-b.x0+1)*sc}" height="${2*sc}"/>`;
  g+=`<path class="m-poly" d="M${s.poly.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('L')}Z"/>`;
  const active={};s.pairs.forEach(p=>active[p.lane]=p.id);
  for(let i=1;i<=lc;i++){const L=laneLen(s,i);if(L<=0)continue;const d=Math.min(laneDone(s,i),L);
    if(d>0)g+=`<rect class="${active[i]?'m-lane-p':'m-lane'}" x="${X(i-1)+.3}" y="${Y(d)}" width="${Math.max(.6,sc-.6)}" height="${d*sc}"/>`;
    if(!opts.paper)g+=`<rect class="m-hit" x="${X(i-1)}" y="${Y(L)}" width="${sc}" height="${L*sc}" data-act="lane" data-l="${i}" role="button" tabindex="0" aria-label="${t('map.lane',{i})}"><title>${t('map.lane',{i})}</title></rect>`;
    if(selLane===i&&!opts.paper)g+=`<rect class="m-sel" x="${X(i-1)}" y="${Y(L)}" width="${sc}" height="${L*sc}"/>`;}
  g+=`<line class="m-zero" x1="${X(b.x0-0.5)}" x2="${X(b.x1+0.5)}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s.finds.forEach(f=>{const cx=X(f.lane-0.5+(f.off||0)),cy=Y(f.dist),r=opts.paper?3.2:4;g+=`<path class="m-mk" d="M${cx} ${cy-r}L${cx+r} ${cy+r*.8}H${cx-r}Z"/>`;});
  if(opts.paper){s.poly.forEach((p,i)=>{g+=`<circle class="m-tp" cx="${X(p[0])}" cy="${Y(p[1])}" r="2.4"/><text class="m-t ink" x="${X(p[0])+4}" y="${Y(p[1])-3}">T${i+1}</text>`;});}
  else{const ps=s.pairs.slice().sort((a,b)=>a.lane-b.lane);ps.forEach(p=>{g+=`<text class="m-t big" x="${X(p.lane-0.5)}" y="${Y(laneLen(s,p.lane))-4}" text-anchor="middle">${esc(p.id)}</text>`;});
    for(let i=1;i<ps.length;i++){const y=Y(0)+12+((i%2)*9);g+=`<line class="m-gap" x1="${X(ps[i-1].lane-0.5)}" x2="${X(ps[i].lane-0.5)}" y1="${y}" y2="${y}"/><text class="m-t" x="${(X(ps[i-1].lane-0.5)+X(ps[i].lane-0.5))/2}" y="${y-2}" text-anchor="middle">${(ps[i].lane-ps[i-1].lane)*R.lane} m</text>`;}}
  g+=`<circle cx="${X(0)}" cy="${Y(0)}" r="4.5" fill="var(--ink)"/><text class="m-t ink" x="${X(0)+2}" y="${Y(0)+(opts.paper?24:36)}">${t('map.nt')}</text>`;
  g+=`<text class="m-t" x="${X(b.x1+0.5)}" y="${Y(0)+(opts.paper?24:36)}" text-anchor="end">${t('map.safeZero')}</text>`;
  Array.from({length:Math.floor(b.y1/10)+1},(_,i)=>i*10).forEach(m=>{g+=`<text class="m-t" x="${padL-4}" y="${Y(m)+3}" text-anchor="end">${m}</text>`;});
  const a=-s.az*D2R, nx=W-22, ny=24, L2=11, vx=Math.sin(-a)*-1, vy=Math.cos(a);
  const ex=nx+(-Math.sin(s.az*D2R))*L2, ey=ny-Math.cos(s.az*D2R)*L2;
  g+=`<circle class="m-n" cx="${nx}" cy="${ny}" r="13"/><line class="m-n" x1="${nx}" y1="${ny}" x2="${ex}" y2="${ey}" stroke-width="2"/><text class="m-t ink" x="${nx+(-Math.sin(s.az*D2R))*20}" y="${ny-Math.cos(s.az*D2R)*20+3}" text-anchor="middle">${t('map.north')}</text>`;

  g+='</svg>';return g;
}

function p11Opis(x,w,wf,cum){const b=bh(x);
  if(!x.start)return 'Rad na '+esc(x.ci.oznaka)+' još nije počeo'+(b.planOd?'; planirani početak '+fmtD(b.planOd):'')+'.';
  const out=[],pd=b.planDana||wdBetween(b.planOd,b.planDo),el=wdBetween(x.start,w.to);
  if(pd&&el!=null){const exp=Math.min(1,el/pd)*totalArea(x);out.push(cum>=exp*0.9?'Operacije se odvijaju po izvedbenom planu':'Operacije kasne u odnosu na izvedbeni plan (planirano oko '+num(exp)+' m², realizirano '+num(cum)+' m²)');}
  else out.push('Da li se operacije odvijaju po planu: '+DOP);
  const nd=deminers().length;out.push('rad '+(nd?nd+' deminera u dvojcima':'deminera')+' u radnim stazama širine '+BA_R.lane+' m'+(x.pairs.length?' (staze '+x.pairs.map(p=>p.lane).join(', ')+')':''));
  const types=[...new Set(wf.map(f=>f.type))];
  if(!types.length)out.push('u sedmici nisu pronađena ES');
  else if(x.ci.ocekivano){const ex=x.ci.ocekivano.toLowerCase(),un=types.filter(t=>!ex.includes(t.toLowerCase()));out.push(un.length?'pronađena su i neočekivana ES: '+esc(un.join(', ')):'pronađena ES su očekivana prema dosijeu');}
  else out.push('pronađena ES očekivana ili ne: '+DOP);
  out.push('tehnička metoda: '+metodaTxt(b));const t=out.join('; ')+'.';return t.charAt(0).toUpperCase()+t.slice(1);}

function csvText_(sep){const s=site();sep=sep||S.csvSep||';';const dc=sep===';',need=new RegExp('["\\n\\r'+(sep===';'?';':',')+']');
  const q=v=>{v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v)&&!/^-?\d+([.,]\d+)?$/.test(v))v="'"+v;return need.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};

function geoText_(){const s=site();const w=(u,v)=>{const p=planeToWgs(s,toGK(s,u,v));return [+p.lon.toFixed(7),+p.lat.toFixed(7)];};

function blobToData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
function dataToBlob(u){const i=u.indexOf(','),bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);return new Blob([a],{type:(u.slice(0,i).match(/:(.*?);/)||[])[1]||'image/jpeg'});}

// one IndexedDB transaction: photos cleared and rewritten and the state written, all or nothing
function idbSwap(state,blobs){return new Promise((res,rej)=>{let tx;try{tx=ST.db.transaction(['kv','photos'],'readwrite');}catch(e){rej(e);return;}
  const ph=tx.objectStore('photos');ph.clear();blobs.forEach(([k,b])=>ph.put(b,k));tx.objectStore('kv').put(state,KEY);
  tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error||new Error('transakcija prekinuta'));});}
async function restoreBackup(){const d=pendingRestore;pendingRestore=null;if(!d)return;const old=S;
  const fail=m=>{if(old){S=old;syncPack();rerender();}toast(t('dev.restoreFail',{m}),7000);};
  try{dryRun(d.st);}catch(e){fail(t('dev.failRender',{e:(e&&e.message||e)}));return;}
  const st=d.st;st.rev=Math.max(+st.rev||0,old?(+old.rev||0):0)+1;st.savedAt=new Date().toISOString();
  if(!ST.db&&window.indexedDB&&ST.mode!=='ls'&&ST.mode!=='mem'){try{ST.db=await idbOpenRetry();ST.mode='idb';ST.fallback=false;}catch(e){}}
  if(!ST.db)st.sites.forEach(x=>{x.finds.forEach(f=>{if(f.ph)f.ph=0;});if(x.qa)x.qa.visits.forEach(v=>Object.values(v.checks).forEach(c=>{if(c.ph)c.ph=0;}));});
  const c=JSON.parse(JSON.stringify(st,(k,v)=>k==='_ll'?undefined:v));
  try{if(ST.db){await idbSwap(c,d.photos.map(([k,u])=>[k,dataToBlob(u)]));markIdb();writeCopy(c);}
    else if(ST.mode==='ls')localStorage.setItem(KEY,JSON.stringify(c));

  catch(e){fail(t('dev.failWrite'));return;}
  S=st;ST.failed=false;leaveRecovery();closeSheet();go('danas');curDay=today();toast(t('dev.restored',{from:d.exp?t('dev.restoredFrom',{d:fmtTs(d.exp)}):''}),4000);}

  for(let e=Math.ceil(E0/step)*step;e<=s.nt.Y+b.x1;e+=step){const x=X(e-s.nt.Y);g+=`<line x1="${f2(x)}" y1="${f2(top+mapH+0.5)}" x2="${f2(x)}" y2="${f2(top+mapH+2.2)}" stroke="${ink}" stroke-width="0.2"/><text class="sk-c" x="${f2(x)}" y="${f2(top+mapH+5)}" text-anchor="middle">${gkn(e).split(',')[0]}</text>`;}
  for(let n=Math.ceil(N0/step)*step;n<=s.nt.X+b.y1;n+=step){const y=Y(n-s.nt.X);g+=`<line x1="${L-2.2}" y1="${f2(y)}" x2="${L-0.5}" y2="${f2(y)}" stroke="${ink}" stroke-width="0.2"/><text class="sk-c" x="${L-2.8}" y="${f2(y+0.7)}" text-anchor="end">${gkn(n).split(',')[0]}</text>`;}
  s.boxes.forEach(bx=>{const d=boxRings(bx).map(pth).join('');if(bx.excl)g+=`<path d="${d}" fill="url(#skX)" fill-rule="evenodd"/>`;else if(bx.ret)g+=`<path d="${d}" fill="url(#skR)" fill-rule="evenodd"/>`;else{if(bx.done.SCH)g+=`<path d="${d}" fill="url(#skS)" fill-rule="evenodd"/>`;if(bx.done.CEIA)g+=`<path d="${d}" fill="url(#skC)" fill-rule="evenodd"/>`;}
    g+=`<path d="${d}" fill="none" stroke="#4a5b66" stroke-width="${bx.excl?0.2:0.1}"/>`;});
  s.boxes.forEach(bx=>{if(bx.w*k<6||bx.h*k<4.5)return;const c=P([bx.cx,bx.cy]);g+=`<text class="sk-b" x="${f2(c[0])}" y="${f2(c[1]+(bx.excl?-0.2:0.55))}" text-anchor="middle">${esc(bx.id)}</text>`;
    if(bx.excl)g+=`<text class="sk-b" x="${f2(c[0])}" y="${f2(c[1]+1.8)}" text-anchor="middle" style="font-weight:700">${esc((EXCL[bx.excl.why]||bx.excl.why).split(' ')[0])}</text>`;
    else if(bx.ret)g+=`<text class="sk-b" x="${f2(c[0])}" y="${f2(c[1]+1.8)}" text-anchor="middle" style="font-weight:700">vraćeno</text>`;});
  g+=`<path d="${pth(s.poly)}" fill="none" stroke="${ink}" stroke-width="0.4"/>`;
  const cx=s.poly.reduce((a,p)=>a+p[0],0)/s.poly.length,cy=s.poly.reduce((a,p)=>a+p[1],0)/s.poly.length,C=P([cx,cy]);
  g+=`<g clip-path="url(#skClip)">${feats(s).filter(f=>f.pts.length).map(f=>featSVG(f,P,true,ink,C)).join('')}</g>`;
  s.poly.forEach((p,i)=>{const q=P(p),dx=q[0]-C[0],dy=q[1]-C[1],dl=Math.hypot(dx,dy)||1,tx=q[0]+dx/dl*3.2,ty=q[1]+dy/dl*3.2+0.8;g+=`<circle cx="${f2(q[0])}" cy="${f2(q[1])}" r="0.55" fill="${ink}"/><text class="sk-l" x="${f2(tx)}" y="${f2(ty)}" text-anchor="middle" style="font-weight:700">T${i+1}</text>`;});
  const fs=s.finds.map(f=>{const q=P([f.u,f.v]);return {f,x:q[0],y:q[1]};}).sort((a,b)=>a.y-b.y);let last=top-4;
  fs.forEach(o=>{o.ly=Math.max(o.y,last+3.4);last=o.ly;});const over=last-(top+mapH+6);if(over>0)fs.forEach(o=>o.ly-=over);
  fs.forEach(o=>{g+=`<circle cx="${f2(o.x)}" cy="${f2(o.y)}" r="0.75" fill="none" stroke="${ink}" stroke-width="0.22"/><circle cx="${f2(o.x)}" cy="${f2(o.y)}" r="0.25" fill="${ink}"/>
    <path d="M${f2(o.x+0.8)} ${f2(o.y)}L${f2(lx-1.5)} ${f2(o.ly-0.7)}" fill="none" stroke="${ink}" stroke-width="0.12"/><text class="sk-l" x="${f2(lx)}" y="${f2(o.ly)}">${esc(o.f.type)}${o.f.depth?' · '+o.f.depth+' cm':''}</text>`;});
  const gx=PW-66;
  g+=`<text class="sk-s" x="${gx}" y="${legendTop+2}" style="font-weight:700">LEGENDA:</text>`+rows.map((r,i)=>`<g transform="translate(${gx} ${f2(legendTop+7+i*5.2)})">${r[0]}<text class="sk-l" x="7" y="2.4">${r[1]}</text></g>`).join('');
  const ceM=methodM2(s,'CEIA'),scM=methodM2(s,'SCH'),why=[...new Set(ex.map(x=>EXCL[x.excl.why]||x.excl.why))].join(', ');

    <text class="sk-l" x="${L}" y="${legendTop+13}">Završeno: ${num(clearedM2(s))} od ${num(totalArea(s))} m² · nalaza: ${s.finds.length}${rt.length?' · vraćeno na ponovni tretman: '+qaPl(rt.length,'boks','boksa','boksova')+' ('+num(rt.reduce((a,b)=>a+b.area,0))+' m²)':''}</text>

  return g+'</svg>';
}

/* ================= CZRS inspector (kontrolor CZRS): kontrolne posete, uzorkovanje, nedostaci, završna kontrola =================
   Same app, other screens: per box-mode site the user picks the role "Izvođač" (contractor) or "Kontrolor CZRS". The inspector never
   changes the contractor's boxes, finds or log; the inspector's records live in s.qa. Where the inspector finds an item in a sampled
   box, the box is "vraćeno na ponovni tretman" (b.ret): it does not count as done until the contractor re-treats it AND a later
   inspection of that box finds nothing. Sampling follows the IMAS 09.20 idea (a random sample of the cleared area, re-searched);
   CZRS has not published a sampling rate, so the % is set per site and QA_PCT is only a labelled example default. */
const QA_PCT=10;
const QA_CHK=[['dok','Dokumentacija na radilištu'],['obel','Obeležavanje'],['test','Test-poligon i provera detektora'],['udalj','Bezbedne udaljenosti'],
  ['lzo','Lična zaštitna oprema'],['med','Medicinska podrška'],['evid','Dnevna evidencija učinka ažurna']];
const QA_M={CEIA:'CEIA detektor',SCH:'Schonstedt',KOP:'Iskopavanje / sondiranje'};
const QA_PICK={r:'nasumično',m:'ručno',p:'ponovna kontrola'};
const QA_STAT={n:'nije pregledano',p:'delimično (čeka Schonstedt)',d:'završeno',x:'isključeno',r:'vraćeno na ponovni tretman',k:'ponovni tretman urađen, čeka ponovnu kontrolu'};
const QA_LOCK='Boks je vraćen na ponovni tretman (kontrola CZRS). Ne deli se, ne spaja i ne isključuje dok kontrolor ne zatvori nedostatak.';
const QA_RO=['markM','unmarkM','boxDone','findBox','adv','moveA','findHere','shift','ev','evSave','brief','start','openSite'];
const QA_RO_RS=['split','mergeStart','mergeOk','rename','excl','unexcl','featNew','featEdit','featSave','featDel'];
const QA_RO_MSG='Uloga je „Kontrolor CZRS”: podaci izvođača su samo za pregled.';
// the constants above stay national (validator keys, stored texts, documents); screens and messages use these:
const qaLockMsg=()=>t('qa.lock');
const qaRoMsg=()=>t('qa.ro');
const qaChkTxt=k=>t(`qa.chk.${k}`);
const qaMTxt=m=>t(`qa.m.${m}`);
const qaPickTxt=p=>t(`qa.pick.${p}`);
const qaStatTxt=x=>t(`qa.stat.${x}`);
// national plural (documents and stored texts); screens use t() with plural arrays
const qaPl=(n,one,few,many)=>n+' '+(n%10===1&&n%100!==11?one:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?few:many);
function qa(s){if(!isObj(s.qa))s.qa={role:'izv',pct:QA_PCT,insp:'',visits:[],ncs:[]};return s.qa;}
const isK=s=>!!s&&s.mode==='boxes'&&qa(s).role==='czrs';
// validator: state from storage, a backup file or an older version gets every inspector field with a safe value
function fillQa(s){const q=isObj(s.qa)?s.qa:{},rd=x=>isObj(x)?{day:D_(x.day),by:S_(x.by)}:null;
  const chk=x=>{const o={};if(isObj(x))QA_CHK.forEach(([k])=>{const c=x[k];if(!isObj(c))return;const r={st:c.st==='ok'||c.st==='ned'?c.st:'',note:S_(c.note)},t=safeImg(c.thumb);if(t)r.thumb=t;if(c.ph)r.ph=1;o[k]=r;});return o;};
  const ids=new Set(),uniq=x=>{if(!x.id||ids.has(x.id))return false;ids.add(x.id);return true;};
  s.qa={role:q.role==='czrs'?'czrs':'izv',pct:Math.min(100,Math.max(0.1,N_(q.pct,QA_PCT))),insp:S_(q.insp),
    visits:A_(q.visits).filter(isObj).map(v=>({id:S_(v.id),d:D_(v.d),t:T_(v.t),who:S_(v.who),ann:v.ann?1:0,tim:S_(v.tim),rep:S_(v.rep),checks:chk(v.checks),
      pct:N_(v.pct,null),seed:fin(v.seed)?Math.abs(Math.round(+v.seed))%1e9:null,base:N_(v.base,null),
      samples:A_(v.samples).filter(isObj).map(x=>({box:S_(x.box),pick:QA_PICK[x.pick]?x.pick:'m',area:N_(x.area,0),m:QA_M[x.m]?x.m:'CEIA',m2:Math.max(0,N_(x.m2,0)),

/* ---------- import: CSV/TXT, GeoJSON, KML → turning points (E N, UTM 34N) and features ---------- */
function looksUtm(e,n){return e>=1e5&&e<=1e6&&n>=4e6&&n<=6e6;}
// x,y as GeoJSON/KML write them: lon,lat (WGS84) or E,N (already projected)
function impXY(x,y){if(!isFinite(x)||!isFinite(y))return null;if(Math.abs(x)<=180&&Math.abs(y)<=90){const u=wgsToUtm34(y,x);return [u.E,u.N];}if(looksUtm(x,y))return [x,y];if(looksUtm(y,x))return [y,x];return null;}
function impKind(t){t=String(t||'').toLowerCase();if(!t)return '';
  return /prug|rail|želez|zelez/.test(t)?'pruga':/dalekov|power ?line|\bkv\b/.test(t)?'dalekovod':/kanal|canal|ditch/.test(t)?'kanal':/potok|stream|creek|reka|river/.test(t)?'potok':
    /reper|benchmark|poligonsk/.test(t)?'reper':/\bstub|\bpole\b|bandera/.test(t)?'stub':/\bput\b|\bputa\b|road|cesta|ulica/.test(t)?'put':'';}
const numTok=t=>/^[-+]?\d+(?:[.,]\d+)?$/.test(t);
function splitCoordLine(l){let t;
  if(/[;\t]/.test(l))t=l.split(/[;\t]/);
  else if(l.includes(',')){const ws=l.split(/\s+/);t=ws.length>=2&&ws.filter(x=>/^[-+]?\d+(,\d+)?$/.test(x)).length>=2&&!/,\s/.test(l)?ws:l.split(',');}
  else t=l.split(/\s+/);
  return t.map(x=>{x=x.trim().replace(/^["']|["']$/g,'').trim();return /^[-+]?\d{1,3}(\s\d{3})+([.,]\d+)?$/.test(x)?x.replace(/\s/g,''):x;});}
function pairOf(nums){
  for(let i=0;i+1<nums.length;i++){const a=nums[i],b=nums[i+1];if(looksUtm(a,b))return [a,b];if(looksUtm(b,a))return [b,a];}
  for(let i=0;i+1<nums.length;i++){const a=nums[i],b=nums[i+1];
    if(a>=35&&a<=60&&b>=10&&b<35){const u=wgsToUtm34(a,b);return [u.E,u.N];}
    if(b>=35&&b<=60&&a>=10&&a<35){const u=wgsToUtm34(b,a);return [u.E,u.N];}}
  return null;}
function parseCSV(txt){const out={tp:[],feats:[],warn:[],fmt:'CSV/TXT'};
  const lines=txt.replace(/^﻿/,'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^(#|\/\/)/.test(l));
  if(!lines.length)throw new Error(t('imp.empty'));
  let cols=null;const h0=splitCoordLine(lines[0]);
  if(h0.filter(numTok).length<2){const lc=h0.map(x=>x.toLowerCase()),f=re=>lc.findIndex(x=>re.test(x));
    cols={lat:f(/^(lat|latitude|širina|sirina)/),lon:f(/^(lon|lng|long|longitude|dužina|duzina)/),e:f(/^(e|east|easting|istok|y|utm_?e|utm34_?e|e_?utm)$/),n:f(/^(n|north|northing|sever|x|utm_?n|utm34_?n|n_?utm)$/),
      name:f(/^(name|naziv|id|tačka|tacka|oznaka|br|broj|pt|point|ime)$/),kind:f(/^(vrsta|tip|type|kind|objekat)$/)};lines.shift();}
  let bad=0;
  lines.forEach(l=>{const t=splitCoordLine(l);let pt=null,name='',kind='';
    if(cols){const g=j=>j>=0&&t[j]!=null?parseNum(t[j]):NaN;
      if(cols.lat>=0&&cols.lon>=0){const la=g(cols.lat),lo=g(cols.lon);if(isFinite(la)&&isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180){const u=wgsToUtm34(la,lo);pt=[u.E,u.N];}}
      else if(cols.e>=0&&cols.n>=0){const a=g(cols.e),b=g(cols.n);pt=looksUtm(a,b)?[a,b]:looksUtm(b,a)?[b,a]:null;}
      if(cols.name>=0)name=t[cols.name]||'';if(cols.kind>=0)kind=t[cols.kind]||'';}
    if(!pt){pt=pairOf(t.filter(numTok).map(parseNum));
      if(!pt&&!/[;\t,]/.test(l))pt=pairOf(l.replace(/(\d)\s+(?=\d{3}(\D|$))/g,'$1').split(/\s+/).filter(numTok).map(parseNum));
      if(!name)name=t.find(x=>x&&!numTok(x))||'';}
    if(!pt){bad++;return;}
    const k=impKind(kind)||impKind(name);
    if(k&&!FK[k].lin)out.feats.push({kind:k,name,pts:[pt]});else out.tp.push(pt);});
  if(bad)out.warn.push(t('imp.badRows',{n:bad}));
  return out;}
function parseGeoJSON(txt){let o;try{o=JSON.parse(txt);}catch(e){throw new Error(t('imp.gjJson'));}
  if(!o||typeof o!=='object'||!o.type)throw new Error(t('imp.gjType',{f:'"type"'}));
  const prims=[],walk=(g,pr)=>{if(!g||typeof g!=='object')return;const t=g.type,c=g.coordinates;
    if(t==='FeatureCollection')(g.features||[]).forEach(f=>walk(f));else if(t==='Feature')walk(g.geometry,g.properties||{});
    else if(t==='GeometryCollection')(g.geometries||[]).forEach(x=>walk(x,pr));
    else if(t==='Polygon')prims.push({t:'poly',c:(c||[])[0],pr});else if(t==='MultiPolygon')(c||[]).forEach(p=>prims.push({t:'poly',c:(p||[])[0],pr}));
    else if(t==='LineString')prims.push({t:'line',c,pr});else if(t==='MultiLineString')(c||[]).forEach(x=>prims.push({t:'line',c:x,pr}));
    else if(t==='Point')prims.push({t:'pt',c:[c],pr});else if(t==='MultiPoint')(c||[]).forEach(x=>prims.push({t:'pt',c:[x],pr}));};
  walk(o);if(!prims.length)throw new Error(t('imp.gjEmpty'));
  return classifyGeo(prims,'GeoJSON');}
function parseKML(txt){const d=new DOMParser().parseFromString(txt,'application/xml');

function classifyGeo(prims,fmt){const out={tp:[],feats:[],warn:[],fmt};let bad=0;
  const conv=c=>(Array.isArray(c)?c:[]).map(q=>Array.isArray(q)?impXY(+q[0],+q[1]):null);
  const pv=pr=>String((pr||{}).vrsta||(pr||{}).kind||(pr||{}).type||(pr||{}).tip||'').toLowerCase(),pn=pr=>String((pr||{}).name||(pr||{}).naziv||(pr||{}).Name||(pr||{}).id||'').trim();
  const skip=pr=>/^(boks|nalaz|radna_staza)$/.test(pv(pr));
  const polys=prims.filter(p=>p.t==='poly'&&!skip(p.pr)),main=polys.find(p=>/granica/.test(pv(p.pr)))||polys[0];
  if(main){const r=conv(main.c);if(r.length<3||r.some(x=>!x))bad++;else{out.tp=r;if(polys.length>1)out.warn.push(pn(main.pr)?t('imp.polysNamed',{n:polys.length,name:pn(main.pr)}):t('imp.polysFirst',{n:polys.length}));}}
  const tpPts=[];

    if(p.t==='line'){if(c.length<2){bad++;return;}const ok=k&&FK[k].lin;out.feats.push({kind:ok?k:'put',name,pts:c,guess:!ok});return;}
    const m=name.match(/^T\s*(\d+)$/i),ok=k&&!FK[k].lin;
    if((m||/lomn/.test(pv(p.pr)))&&!ok)tpPts.push({n:m?+m[1]:tpPts.length+1,pt:c[0]});else out.feats.push({kind:ok?k:'reper',name,pts:[c[0]],guess:!ok});});
  if(!out.tp.length&&tpPts.length>=3)out.tp=tpPts.sort((a,b)=>a.n-b.n).map(x=>x.pt);

function tpCheck(tp){const warn=[],n=tp.length;
  if(tp.some(p=>!isFinite(p[0])||!isFinite(p[1])))return {err:t('imp.tpNaN'),warn};
  const i=tp.findIndex(p=>!looksUtm(p[0],p[1]));if(i>=0)return {err:t('imp.tpNotUtm',{i:i+1}),warn};
  if(n>400)return {err:t('imp.tpMany',{n}),warn};
  for(let a=0;a<n;a++)for(let b=a+2;b<n;b++){if(a===0&&b===n-1)continue;if(segsCross(tp[a],tp[(a+1)%n],tp[b],tp[(b+1)%n]))return {err:t('imp.tpCross',{a:a+1,a2:(a+1)%n+1,b:b+1,b2:(b+1)%n+1}),warn};}
  const A=polyArea(tp);if(A<1)return {err:t('imp.tpZero'),warn};
  if(A>2e6)warn.push(t('imp.tpBig',{ha:num(A/1e4,1)}));

function parseImport(name,txt){const n=String(name||'').toLowerCase(),tx=String(txt||'').replace(/^﻿/,'').trim();

  if(!tx)throw new Error(t('imp.empty'));

  if(r.tp.length>1&&Math.hypot(r.tp[0][0]-r.tp[r.tp.length-1][0],r.tp[0][1]-r.tp[r.tp.length-1][1])<0.005)r.tp.pop();

async function saveFile(name,text,mime){const blob=new Blob([text],{type:mime});

    if(navigator.canShare({files:[file]}))try{await navigator.share({files:[file],title:name});return true;}catch(e){if(e.name==='AbortError')return false;}}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true;}

document.addEventListener('change',e=>{const x=e.target;if(!S||!x||!x.dataset)return;const s=site();
  if(x.dataset.brf!=null){const b=brOf(s,today());if(!b||b.st==='z'||isK(s))return;const f=x.dataset.brf;let v=String(x.value);
    if(f==='byR'){b.byR=DR_ROLES.includes(v)?v:'vt';}else if(f==='t0'||f==='t1'){b[f]=T_(v);}else if(AMF.includes(f)){brSet(b,f,v.slice(0,['plan','haz','spec'].includes(f)?2000:300));}save();return;}
  if(x.dataset.drph){drPhoto(x);return;}
  if(x.id==='amF'){const b=brOf(s,today()),ta=$('#amTo');if(b&&ta&&AMF.includes(x.value))ta.value=String(brGet(b,x.value)||'');}});

/* ================= timers ================= */
// the app stays open across midnight: when the date changes, the new day starts (briefing, today's log and totals); data is kept
let curDay=null;
function checkDay(){if(!S)return false;const d=today();if(curDay===null||curDay===d){curDay=d;return false;}curDay=d;docDay=null;
  S.sites.forEach(dayInfo);save();if(tab==='nalaz')renderHeader();else rerender();
  toast(t('tick.newDay',{d:longDate(new Date())}),7000);return true;}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay();});
function tick(){
  if(!S)return;checkDay();const s=site();
  document.querySelectorAll('[data-timer]').forEach(el=>{const p=s.pairs.find(x=>x.id===el.dataset.timer);if(!p)return;const st=pairState(p);el.textContent=fmtRem(st.rem);const row=el.closest('.pair');if(row)row.classList.toggle('over',st.over);});
  const i=S.incident;if(i){const e=$('#incEl'),d=$('#incDl');const el=Date.now()-i.t0;if(e){const sec=Math.floor(el/1000);e.textContent=pad(Math.floor(sec/60))+':'+pad(sec%60);}
    if(d&&R.accidentH){const rem=Math.max(0,R.accidentH*36e5-el),sec=Math.floor(rem/1000);d.textContent=Math.floor(sec/3600)+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60);}}
}
setInterval(tick,1000);

/* ================= nav ================= */
const RENDER={danas:renderDanas,mapa:renderMapa,nalaz:renderNalaz,izvjestaji:renderIzvjestaji,hitno:renderHitno};
function go(t){if(!S)return;syncPack();if(tab==='nalaz'&&t!=='nalaz'){photoData=null;photoTok++;}tab=t;if(t!=='izvjestaji')docView=null;
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+t);
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  RENDER[t]();renderHeader();setHtmlLang();$('#main').scrollTop=0;try{localStorage.setItem(KEY+'-tab',t);}catch(e){}}
function rerender(){if(!S)return;syncPack();if(tab!=='nalaz')RENDER[tab]();renderHeader();setHtmlLang();}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='scrim')closeSheet();return;}
  const a=el.dataset.act;if(!S&&!['recRetry','recRaw','restoreOk','close','swUpdate'].includes(a))return;const s=S?site():null;
  if(s&&isK(s)&&QA_RO.includes(a)){toast(roMsg(),4000);return;}
  switch(a){
    case 'tab':closeSheet();go(el.dataset.tab);break;
    case 'close':closeSheet();break;
    case 'sites':openSites();break;
    case 'pickSite':if(!S.sites.some(x=>x.id===el.dataset.id))break;S.active=el.dataset.id;docView=null;docDay=null;mergeSel=null;selBox=null;selLane=null;save();closeSheet();go(tab==='nalaz'?'danas':tab);break;
    case 'newSite':openNewSite();break;
    case 'openSite':openSiteWork();break;
    case 'lane':openLane(+el.dataset.l);break;
    case 'mapZoom':mapZoom=!mapZoom;renderMapa();{const w=$('#mapWrap'),sel=s.mode==='boxes'?null:(selLane||(s.pairs[0]||{}).lane);if(mapZoom&&w&&sel&&w.scrollTo)try{const r=w.querySelector(`[data-l="${sel}"]`);if(r&&r.getBBox){const bb=r.getBBox();w.scrollLeft=Math.max(0,bb.x-w.clientWidth/2);w.scrollTop=Math.max(0,bb.y+bb.height-w.clientHeight+60);}}catch(err){}}break;
    case 'box':openBoxB(el.dataset.id);break;
    case 'markM':{const who=$('#mWho').value;markBox(s,el.dataset.id,el.dataset.m,who);openBoxB(el.dataset.id);renderHeader();toast(t('act.markM',{id:el.dataset.id,m:tv(P.methods[el.dataset.m]),who}));break;}
    case 'unmarkM':{const bx=boxById(s,el.dataset.id);delete bx.done[el.dataset.m];logAdd(s,inDoc(s,()=>({t:hm(Date.now()),e:'Boks '+bx.id+': poništen pregled '+P.methods[el.dataset.m]})));save();openBoxB(bx.id);break;}
    case 'boxDone':{const a=s.assign.find(x=>x.who===el.dataset.w);if(a){const id=a.box;markBox(s,id,a.m,a.who);renderDanasB();renderHeader();const n=s.assign.find(x=>x.who===el.dataset.w);toast(t('act.boxDone',{id})+(n?' '+t('act.boxNext',{who:a.who,box:n.box}):''));}break;}
    case 'findBox':{prefill={box:el.dataset.id};closeSheet();go('nalaz');break;}
    case 'adv':{const l=+el.dataset.l,m=parseFloat(el.dataset.m),L=laneLen(s,l),from=laneDone(s,l),to=Math.min(L,+(from+m).toFixed(2));if(to>from){s.progress.push({day:today(),lane:l,from,to});s.lanes[l]=to;addQ('Napredovanje staza '+l);save();}openLane(l);renderHeader();toast(t('act.adv',{l,m:num(to,1)}));break;}
    case 'moveA':{const l=+el.dataset.l;let p=el.dataset.p!=null?s.pairs.find(x=>x.id===el.dataset.p):null;
      // no pair named: the pair whose lane is finished, else the nearest one that may legally move
      if(!p){const ok=s.pairs.filter(x=>pairCanMove(s,x,l)&&x.lane!==l);p=ok.find(x=>laneDone(s,x.lane)>=laneLen(s,x.lane)-0.01)||ok.sort((a,b)=>Math.abs(a.lane-l)-Math.abs(b.lane-l))[0];}
      if(!p){toast(t('act.noPair',{l,gap:R.pairGap}),4500);break;}
      if(!pairCanMove(s,p,l)){toast(t('act.pairTooClose',{p:p.id,l,gap:R.pairGap}),4500);break;}
      const from=p.lane;p.lane=l;logAdd(s,{e:'Dvojac '+p.id+' premješten iz staze '+from+' u stazu '+l});save();openLane(l);toast(t('act.pairMoved',{p:p.id,l}));break;}
    case 'findHere':{prefill={lane:+el.dataset.l,dist:laneDone(s,+el.dataset.l)};closeSheet();go('nalaz');break;}
    case 'shift':{const p=s.pairs.find(x=>x.id===el.dataset.p);const st=pairState(p);p.inA=!p.inA;p.shift=Date.now();logAdd(s,inDoc(s,()=>({t:hm(Date.now()),e:'Smjena u stazi '+p.lane+': '+st.support+' ulazi, '+st.inLane+' podrška na '+R.pairGap+' m'})));save();renderDanas();break;}
    case 'ev':if(el.dataset.k==='det')openDet();else openEvent(el.dataset.k);break;
    case 'evSave':saveEvent(el.dataset.k);break;
    case 'start':{const di=dayInfo(s),b=brOf(s,today());if(!b||b.st!=='z'){toast(t('dr.b.needClosed'),4500);break;}di.started=true;di.at=b.zAt;logAdd(s,{e:'Početak rada (brifing zaključen u '+b.zAt+')'});save();renderDanas();break;}
    case 'crs':S.crs=el.value;save();break;
    case 'p11w':p11Cur=el.value==='1';renderDoc(docView);break;
    case 'doc':if(docView!==el.dataset.k){docDay=null;docZ=1;}if(el.dataset.day&&DAYRE.test(el.dataset.day))docDay=el.dataset.day===today()?null:el.dataset.day;closeSheet();if(el.dataset.visit)docVisit=el.dataset.visit;docView=el.dataset.k;if(tab!=='izvjestaji'){tab='izvjestaji';document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-izvjestaji');document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab==='izvjestaji')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}renderDoc(docView);$('#main').scrollTop=0;break;
    case 'docBack':docView=null;docZ=1;renderIzvjestaji();break;
    case 'docZoom':docZ=docZ%3+1;renderDoc(docView);break;
    case 'print':try{window.print();}catch(err){}break;
    case 'copyDoc':copy($('#docEl').innerText,t('act.lblReport'));break;
    case 'copyCsv':copy(inDoc(s,csvText),'CSV');break;
    case 'csvSep':S.csvSep=el.value===','?',':';';save();break;
    case 'copyGeo':copy(inDoc(s,geoText),'GeoJSON');break;
    case 'copyNum':copy(el.dataset.v,t('act.lblNumber'));break;
    case 'gpsCmp':gpsCompare();break;
    case 'incStart':{if(S.incident)break;const t0=Date.now();S.incident={site:s.id,t0,day:today(),start:hm(t0),where:'',lane:null,dist:null,box:null,pu:null,pv:null,steps:P.steps.map(()=>null),v:{ad:0,ch:0,lt:0,hv:0,k:0},cat:'',desc:''};
      logAdd(s,{t:S.incident.start,e:'NESREĆA prijavljena; rad zaustavljen',k:'inc'});addQ('NESREĆA prijavljena');save();renderHitno();renderHeader();break;}
    case 'incWhere':openIncidentPlace();break;
    case 'incPlace':saveIncidentPlace();break;
    case 'step':S.incident.steps[+el.dataset.i]=el.checked?hm(Date.now()):null;save();renderHitno();{const f=$('#step'+el.dataset.i);if(f)f.focus();}break;
    case 'incEnd':{const i=S.incident;if(!i)break;const is=S.sites.find(x=>x.id===i.site)||s;(is.incidents=is.incidents||[]).push(Object.assign({},i,{end:hm(Date.now()),endDay:today()}));S.incident=null;logAdd(is,{e:'Incident zatvoren',k:'inc'});save();renderHitno();toast(t('act.incClosed',{msp:is.msp.id}));break;}
    case 'sync':openSync();break;
    case 'reset':openReset(1);break;
    case 'reset2':openReset(2);break;
    case 'resetGo':resetDemo();break;
    case 'recRetry':closeSheet();boot();break;
    case 'recRaw':if(recRaw)saveFile('terenska-knjiga-neispravni-podaci-'+today()+'.json',JSON.stringify(recRaw),'application/json').then(ok=>{if(ok)toast(t('rec.rawReady'),5000);});break;
    case 'backup':if(el.disabled)break;el.disabled=true;exportBackup().catch(()=>toast(t('act.backupFail'))).finally(()=>{el.disabled=false;});break;
    case 'restoreOk':restoreBackup();break;
    case 'swUpdate':if(updReg&&updReg.waiting){swAsked=true;updReg.waiting.postMessage({type:'skip'});$('#updBar').hidden=true;}break;
  }
});
document.addEventListener('input',e=>{const t=e.target;if(!S||!S.incident)return;if(t.dataset.v){S.incident.v[t.dataset.v]=Math.max(0,+t.value||0);save();}if(t.dataset.ic){S.incident[t.dataset.ic]=t.value;save();}});
document.addEventListener('change',e=>{const t=e.target;if(S&&t.id==='lanePick'&&t.value){openLane(+t.value);return;}if(S&&t.id==='boxPick'&&t.value){openBoxB(t.value);return;}if(t.id==='rsFile'&&t.files&&t.files[0]){onRestoreFile(t.files[0]);t.value='';return;}if(!S)return;if(t.id==='uiLang'){onUiLang(t.value);return;}if(t.id==='docDay'){docDay=t.value===today()?null:t.value;if(docView)renderDoc(docView);return;}if(t.id==='docVisit'){docVisit=t.value;if(docView)renderDoc(docView);return;}if(S.incident&&t.dataset.ic==='cat'){S.incident.cat=t.value;save();}});
document.addEventListener('keydown',e=>{const open=!$('#scrim').hidden;if(e.key==='Escape'&&open){closeSheet();return;}
  // Tab stays inside an open sheet
  if(e.key==='Tab'&&open){const f=[...$('#sheet').querySelectorAll('button,input,select,textarea,summary,[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(f.length){const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}return;}
  // lanes and boxes on the maps are buttons for the keyboard too
  const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset&&t.dataset.act){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});

let start='danas';try{const t=localStorage.getItem(KEY+'-tab');if(t&&RENDER[t])start=t;}catch(e){}
const hash=(location.hash||'').slice(1);if(RENDER[hash])start=hash;
// start-up never shows demo data in place of field data and never leaves a blank page: any failure goes to the recovery screen
let recRaw=null;
function showRecovery(err){recRaw=err&&err.raw||null;S=null;closeSheet();
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-rec');const tb=document.querySelector('.tabs');if(tb)tb.hidden=true;$('#syncBtn').hidden=true;$('#saveWarn').hidden=true;
  $('#hdrSite').textContent='Terenska knjiga';$('#hdrMeta').textContent=t('rec.meta');setHtmlLang();
  $('#v-rec').innerHTML=`<div class="card" role="alert"><div class="label">${t('rec.label')}</div><h2>${t('rec.title')}</h2><p>${esc(err&&err.message||String(err))}</p>
    <p class="sub">${t('rec.text')}</p>
    <div class="btnrow"><button class="btn primary" type="button" data-act="recRetry">${t('rec.retry')}</button><label class="btn" for="rsFile">${t('rec.restore')}<input id="rsFile" type="file" accept="application/json,.json" style="position:absolute;opacity:0;width:1px;height:1px"></label>${recRaw?'<button class="btn" type="button" data-act="recRaw">'+t('rec.saveRaw')+'</button>':''}</div></div>`;}
function leaveRecovery(){const t=document.querySelector('.tabs');if(t)t.hidden=false;$('#syncBtn').hidden=false;$('#v-rec').hidden=true;$('#v-rec').innerHTML='';recRaw=null;}
async function boot(){Object.assign(ST,{db:null,mode:'mem',failed:false,fallback:false,why:''});let st;
  try{st=await loadState();}catch(e){showRecovery(e);return;}
  S=st;try{leaveRecovery();go(start);}catch(e){const raw=snapshot();showRecovery(new LoadError(t('rec.render',{e:e&&e.message||e}),raw));return;}
  curDay=today();renderSaveWarn();requestPersist();}
boot();
/* ---------- installed app: service worker, and "new version" instead of silently running old code ---------- */
let updReg=null,swAsked=false;
function swInit(){try{if(inFrame||!('serviceWorker' in navigator)||!document.querySelector('link[rel="manifest"]'))return;
  navigator.serviceWorker.register('sw.js').then(reg=>{const show=()=>{if(reg.waiting&&navigator.serviceWorker.controller){updReg=reg;const el=$('#updBar');el.hidden=false;
      el.innerHTML='<span>'+t('upd.ready')+'</span><button class="btn sm" type="button" data-act="swUpdate">'+t('upd.reload')+'</button>';}};
    show();reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')show();});});
    setInterval(()=>{reg.update().catch(()=>{});},36e5);}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swAsked)location.reload();});}catch(e){}}
addEventListener('load',swInit);
['online','offline'].forEach(ev=>addEventListener(ev,()=>{if(S)renderHeader();}));
})();
</script>
