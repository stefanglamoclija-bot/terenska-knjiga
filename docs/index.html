<!doctype html>
<html lang="bs" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-OWVWvfHOHjFNVCeNOkVrVOe6fxTQBtWnMnK+GGhL+vs='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3D35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terenska knjiga">
<title>Terenska knjiga</title>
<style>
/* Layout: phone-first field app. Status header with site switcher, one scrolling view, tab bar at the bottom.
   High contrast for sunlight, large targets for gloved hands. Red is reserved for hazard. Documents render as paper forms. */
:root{
  --bg:#E8EBE3; --surface:#F7F8F4; --surface-2:#FFFFFF; --ink:#1A1F19; --muted:#59625A; --line:#CBD1C4;
  --accent:#1F3D35; --on-accent:#F3F7F2;
  --hazard:#BF2A1C; --on-hazard:#FFFFFF; --haz-soft:#F1D5CE;
  --cleared:#2B784A; --clr-soft:#C8E2D0;
  --work:#A86F0B; --work-soft:#F4DFAF;
  --paper:#FFFFFF; --paper-ink:#111511;
  /* no web fonts are fetched at runtime: brand fonts are used if self-hosted (build.sh, docs/fonts) or installed, else the system's */
  --font-display:"Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,"Roboto Mono","Droid Sans Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F120F; --surface:#171B16; --surface-2:#1E231D; --ink:#E5E9E0; --muted:#97A190; --line:#2C3229;
    --accent:#A8D0C2; --on-accent:#0D1915;
    --hazard:#EC5B45; --on-hazard:#1B0805; --haz-soft:#3A1C17;
    --cleared:#5CBF85; --clr-soft:#1B3223;
    --work:#E7B142; --work-soft:#3A2E12;
    --paper:#F4F3EE; --paper-ink:#111511;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F120F; --surface:#171B16; --surface-2:#1E231D; --ink:#E5E9E0; --muted:#97A190; --line:#2C3229;
  --accent:#A8D0C2; --on-accent:#0D1915;
  --hazard:#EC5B45; --on-hazard:#1B0805; --haz-soft:#3A1C17;
  --cleared:#5CBF85; --clr-soft:#1B3223;
  --work:#E7B142; --work-soft:#3A2E12;
  --paper:#F4F3EE; --paper-ink:#111511;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}

.app{position:relative;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.site-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;padding:4px 6px;margin:-4px -6px;border-radius:8px;text-align:left;min-width:0}
.site-btn:hover{background:var(--bg)}
.site-code{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1;display:flex;align-items:center;gap:6px;white-space:nowrap}
.site-code svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2.2}
.site-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pack{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);font-weight:500;letter-spacing:0}
.sync{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:500;white-space:nowrap;flex:none}
.sync #syncLabel{line-height:1.2;text-align:left;font-size:11.5px}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--work);flex:none}
.sync.ok .dot{background:var(--cleared)}
.sync.busy .dot{animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.25}}

main{flex:1;overflow-y:auto;padding:14px 14px 22px;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.01em}
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}

.big{font-family:var(--font-display);font-weight:700;font-size:50px;line-height:.95;font-variant-numeric:tabular-nums}
.big .unit{font-size:21px;margin-left:4px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--haz-soft);overflow:hidden;margin:12px 0 4px}
.bar span{display:block;height:100%;background:var(--cleared);border-radius:5px;transition:width .4s}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 0}
.kv3 dt{font-size:11.5px;color:var(--muted)}
.kv3 dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{background:var(--hazard);color:var(--on-hazard);border-color:var(--hazard)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13.5px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 130px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:6px}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.chip.work{background:var(--work-soft);color:var(--ink)}
.chip.ok{background:var(--clr-soft);color:var(--ink)}
.chip.haz{background:var(--haz-soft);color:var(--ink)}
.tri{width:16px;height:14px;flex:none}
.tri path{fill:var(--hazard)}

/* pairs */
.pair{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pair:first-of-type{border-top:0}
.pair .tag{font-family:var(--font-display);font-weight:700;font-size:22px;width:34px;height:34px;border-radius:8px;background:var(--bg);display:grid;place-items:center}
.pair .t{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.pair.over .t{color:var(--hazard)}
.pair.over .tag{background:var(--haz-soft)}

/* compliance */
.chk{list-style:none;margin:0;padding:0}
.chk li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.chk li:first-child{border-top:0}
.chk .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.chk .ok .ic,.chk li.ok .ic{background:var(--clr-soft);color:var(--cleared)}
.chk li.warn .ic{background:var(--work-soft);color:var(--work)}
.chk li.info .ic{background:var(--bg);color:var(--muted)}
.chk li.bad .ic{background:var(--haz-soft);color:var(--hazard)}
.chk .v{font-family:var(--font-mono);font-size:12.5px;text-align:right;white-space:nowrap}

/* log */
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .tm{font-family:var(--font-mono);font-size:12.5px;color:var(--muted);padding-top:1px}
.log li.find .ev{color:var(--hazard);font-weight:500}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.quick .btn{min-height:42px;padding:6px 8px;font-size:13px;font-weight:500}

.checks{list-style:none;margin:0;padding:0}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;font-size:14px}
.checks input{width:22px;height:22px;margin:0;accent-color:var(--cleared);flex:none}
.notice{font-size:13px;padding:9px 11px;border-radius:8px;background:var(--work-soft);margin:6px 0 10px}
.notice.haz{background:var(--haz-soft)}

/* map */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mapwrap{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.m-poly{fill:var(--haz-soft);stroke:var(--hazard);stroke-width:1.4;stroke-dasharray:5 3}
.m-safe{fill:var(--clr-soft)}
.m-zero{stroke:var(--ink);stroke-width:2}
.m-lane{fill:var(--cleared)}
.m-lane-p{fill:var(--work)}
.m-hit{fill:transparent;cursor:pointer}
.m-hit:hover{fill:rgba(0,0,0,.06)}
.m-sel{fill:none;stroke:var(--ink);stroke-width:1.5}
.m-mk{fill:var(--hazard);stroke:var(--surface-2);stroke-width:.8;pointer-events:none}
.m-t{fill:var(--muted);font-family:var(--font-mono);font-size:8.5px}
.m-t.ink{fill:var(--ink)}
.m-t.big{font-family:var(--font-display);font-weight:700;font-size:12px;fill:var(--ink)}
.m-gap{stroke:var(--muted);stroke-width:.8;stroke-dasharray:2 2}
.m-tp{fill:var(--surface-2);stroke:var(--hazard);stroke-width:1.2}
.m-n{stroke:var(--ink);stroke-width:1.2;fill:none}
.m-nf{fill:var(--ink)}
.bxp{stroke:var(--surface-2);stroke-width:1.2;cursor:pointer}
.bx-n{fill:var(--haz-soft)}.bx-p{fill:var(--work-soft)}.bx-d{fill:var(--cleared)}
.bx-a{stroke:var(--work);stroke-width:2}.bx-s{stroke:var(--ink);stroke-width:2.2}
.bxp:hover{filter:brightness(.95)}
.m-rail{fill:none;stroke:#8c9a2e;stroke-width:2.2;pointer-events:none}
.bx-x{fill:url(#bxX)}.bx-m{stroke:var(--accent);stroke-width:2.6;stroke-dasharray:4 2}
.m-bid{font-family:var(--font-mono);font-size:7px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--surface-2);stroke-width:2px}
.m-buf{fill:none;stroke:#8c9a2e;stroke-opacity:.22;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.m-bufp{fill:#8c9a2e;fill-opacity:.22;pointer-events:none}
.bxed{border:1px solid var(--line);border-radius:8px;padding:6px 10px}.bxed summary{font-weight:600;font-size:14px;cursor:pointer;min-height:36px;display:flex;align-items:center}
.bxed-in{display:flex;flex-direction:column;gap:8px;margin:6px 0 4px}
.nsf select,.nsf input{min-height:36px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:14px}.nsf input{width:70px}
.doc svg.sk{border:0;margin:0;background:none;width:100%;height:auto}
.sk text{font-family:var(--font-body);fill:#1d2a33}
.sk .sk-t{font-family:var(--font-display);font-weight:700;font-size:5.2px;letter-spacing:.35px}
.sk .sk-s{font-size:2.9px}.sk .sk-l{font-size:2.35px}.sk .sk-c{font-family:var(--font-mono);font-size:1.9px;fill:#4b6474}
.sk .sk-b{font-family:var(--font-mono);font-size:1.6px;fill:#5d7180}
.doc.skdoc{padding:6px}

/* persistent storage warning (never a toast only) and the recovery screen */
.savewarn{background:var(--hazard);color:var(--on-hazard);padding:8px 14px;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.savewarn .btnrow{gap:6px}.savewarn .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);flex:0 1 auto}
.updbar{background:var(--accent);color:var(--on-accent);padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px}
.updbar .btn{background:var(--surface);color:var(--ink);border-color:var(--surface);flex:none}
.legacy{margin-top:8px;font-size:13px}.legacy summary{cursor:pointer;color:var(--muted);min-height:44px;display:flex;align-items:center}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,14,10,.4);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--surface-2);border-top-left-radius:16px;border-top-right-radius:16px;padding:16px 16px 20px;border-top:1px solid var(--line);max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.sitecard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.sitecard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.packs{display:grid;gap:6px}
.packrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--bg)}

/* forms */
form{display:flex;flex-direction:column;gap:14px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.flabel{font-size:13px;font-weight:600;margin-bottom:6px;padding:0;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label span{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13.5px;cursor:pointer}
.chips.mono label span{font-family:var(--font-mono);font-size:13px}
.chips input:checked + span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
.field input,.field select,.field textarea{min-height:46px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:400;font-size:15px;width:100%}
.field textarea{min-height:90px;resize:vertical;font-family:var(--font-mono);font-size:13px}
.field small{font-weight:400;color:var(--muted);font-size:12px}
.calc{padding:11px 12px;border-radius:8px;background:var(--clr-soft);font-size:13px;display:flex;flex-direction:column;gap:3px}
.calc .mono{font-size:13.5px;font-weight:500}
.calc.warn{background:var(--work-soft)}
.gpsrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.nw{white-space:nowrap}
.photo{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;background:var(--surface-2);font-size:14px;font-weight:500}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.photo .ph{width:56px;height:56px;border-radius:6px;background:var(--bg);display:grid;place-items:center;flex:none}
.photo .ph svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:1.8}

/* reports list */
.doclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.docitem{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px}
.docitem .pn{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.05;text-align:center;background:var(--bg);border-radius:6px;padding:7px 2px}
.docitem b{display:block;font-size:14.5px;line-height:1.3}

/* paper document */
.doc{--ink:#111511;--muted:#4c544c;--surface-2:#fff;--hazard:#BF2A1C;--haz-soft:#F1D5CE;--cleared:#2B784A;--clr-soft:#C8E2D0;--work:#A86F0B;--work-soft:#F4DFAF;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:18px 16px;font-size:12.5px;line-height:1.4;box-shadow:0 1px 0 var(--line)}
.doc h4{font-family:var(--font-body);font-size:14px;font-weight:700;text-align:center;margin:6px 0 2px;letter-spacing:.04em}
.doc .dsub{text-align:center;font-size:11.5px;margin-bottom:12px}
.doc .dorg{border-bottom:1px dotted #111511;padding-bottom:2px;text-align:center;font-weight:600}
.doc .dsmall{font-size:10.5px;text-align:center;color:#3c433c}
.doc table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
.doc th,.doc td{border:1px solid #111511;padding:4px 5px;vertical-align:top;text-align:left;color:#111511}
.doc th{font-weight:600;background:#eef0ea;font-size:11px}
.doc td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc td.k{width:42%;font-weight:500}
.doc .box{display:inline-block;width:11px;height:11px;border:1px solid #111511;vertical-align:-1px;margin:0 3px 0 8px;text-align:center;line-height:9px;font-size:10px;font-weight:700}
.doc .sec{font-weight:700;margin:12px 0 4px;font-size:12.5px}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px;font-size:11px}
.doc .sig div{border-top:1px solid #111511;padding-top:3px}
.doc .miss{background:#f6dcc8;padding:0 3px}
.doc .note{font-size:10.5px;color:#3c433c;margin-top:8px}
.doc svg{display:block;width:100%;height:auto;border:1px solid #111511;margin:6px 0;background:#fff}
.tbl{overflow-x:auto}
.doc.wide{min-width:640px}
/* BiH forms (BHMAC prilozi): paper in both themes */
.doc .ptag{text-align:right;font-size:10px;color:#4c544c;margin:-6px 0 4px}
.doc .pre{font-size:11px;margin:0 0 6px}
.doc td.k2{width:20%;font-weight:500}
.doc .opt{display:inline-block;margin:1px 12px 1px 0;white-space:nowrap}
.doc .opt .box{margin-left:0}
.doc .l3{display:block;line-height:1.2}.doc .l3 b,.doc .l3 span,.doc .l3 i{display:block}.doc .l3 span{font-size:10px}.doc .l3 i{font-size:10px;color:#3c433c}

.sos{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:22px 16px;border-radius:12px;border:0;background:var(--hazard);color:var(--on-hazard)}

.sos span{font-size:13.5px;opacity:.92}
.inc{background:var(--hazard);color:var(--on-hazard);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inc .label{color:inherit;opacity:.85}
.inc .tv{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0}
.steps li{border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.steps input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--hazard);flex:none}
.steps .t{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.contact{display:flex;align-items:center;gap:10px}

.dtab{width:100%;border-collapse:collapse;font-size:13.5px}

.dtab td.n{text-align:right;font-family:var(--font-display);font-weight:700;font-size:20px;white-space:nowrap}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0}

.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 2px;font-size:11.5px;font-weight:500;color:var(--muted);border-radius:8px;min-height:54px;justify-content:center}

/* ================= geodesy: GK zone 6 (MGI 1901 / Bessel) and UTM 34N (WGS84) ================= */
const D2R=Math.PI/180;
const ELL={bessel:{a:6377397.155,f:1/299.1528128},wgs84:{a:6378137,f:1/298.257223563}};
const MGI_SHIFT=[682,-203,480]; // demo 3-parameter shift; confirm with BHMAC
// Transverse Mercator by the Krüger n-series (4th order, Karney 2011): sub-millimetre well beyond the 3° of a zone,
// so BiH west of 18°E stays exact even when printed in zone 34.
const KC=new Map();
function kc(el){if(KC.has(el))return KC.get(el);const n=el.f/(2-el.f),n2=n*n,n3=n2*n,n4=n3*n;const c={A:el.a/(1+n)*(1+n2/4+n4/64),e:2*Math.sqrt(n)/(1+n),
  al:[0,n/2-2*n2/3+5*n3/16+41*n4/180,13*n2/48-3*n3/5+557*n4/1440,61*n3/240-103*n4/140,49561*n4/161280],
  be:[0,n/2-2*n2/3+37*n3/96-n4/360,n2/48+n3/15-437*n4/1440,17*n3/480-37*n4/840,4397*n4/161280],
  de:[0,2*n-2*n2/3-2*n3+116*n4/45,7*n2/3-8*n3/5-227*n4/45,56*n3/15-136*n4/35,4279*n4/630]};KC.set(el,c);return c;}
function tmFwd(lat,lon,el,lon0,k0,FE){const c=kc(el),p=lat*D2R,dl=(lon-lon0)*D2R,t=Math.sinh(Math.atanh(Math.sin(p))-c.e*Math.atanh(c.e*Math.sin(p)));
  const xi=Math.atan(t/Math.cos(dl)),eta=Math.atanh(Math.sin(dl)/Math.sqrt(1+t*t));let x=eta,y=xi;
  for(let j=1;j<=4;j++){x+=c.al[j]*Math.cos(2*j*xi)*Math.sinh(2*j*eta);y+=c.al[j]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);}return {E:FE+k0*c.A*x,N:k0*c.A*y};}
function tmInv(E,N,el,lon0,k0,FE){const c=kc(el),xi=N/(k0*c.A),eta=(E-FE)/(k0*c.A);let x1=xi,e1=eta;
  for(let j=1;j<=4;j++){x1-=c.be[j]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);e1-=c.be[j]*Math.cos(2*j*xi)*Math.sinh(2*j*eta);}
  const chi=Math.asin(Math.sin(x1)/Math.cosh(e1));let p=chi;for(let j=1;j<=4;j++)p+=c.de[j]*Math.sin(2*j*chi);return {lat:p/D2R,lon:lon0+Math.atan2(Math.sinh(e1),Math.cos(x1))/D2R};}
function toEcef(lat,lon,el){const f=el.f,e2=2*f-f*f,p=lat*D2R,l=lon*D2R,s=Math.sin(p),N=el.a/Math.sqrt(1-e2*s*s);return [N*Math.cos(p)*Math.cos(l),N*Math.cos(p)*Math.sin(l),N*(1-e2)*s];}

function wgsToGk6(lat,lon){const e=toEcef(lat,lon,ELL.wgs84);const g=fromEcef(e[0]-MGI_SHIFT[0],e[1]-MGI_SHIFT[1],e[2]-MGI_SHIFT[2],ELL.bessel);const r=tmFwd(g.lat,g.lon,ELL.bessel,18,0.9999,6500000);return {Y:r.E,X:r.N};}
const wgsToUtm=(lat,lon,z)=>tmFwd(lat,lon,ELL.wgs84,z*6-183,0.9996,500000);

function utm34ToWgs(E,N){return utmToWgs(E,N,34);}

/* ================= site geometry ================= */
function frame(site){const a=site.az*D2R;return {F:[Math.sin(a),Math.cos(a)],Rt:[Math.cos(a),-Math.sin(a)]};}
function toGK(site,u,v){const {F,Rt}=frame(site);return {Y:site.nt.Y+u*Rt[0]+v*F[0],X:site.nt.X+u*Rt[1]+v*F[1]};}
function toLocal(site,Y,X){const {F,Rt}=frame(site);const dy=Y-site.nt.Y,dx=X-site.nt.X;return [dy*Rt[0]+dx*Rt[1],dy*F[0]+dx*F[1]];}
function inPoly(pt,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))c=!c;}return c;}
function polyArea(poly){let s=0;for(let i=0,j=poly.length-1;i<poly.length;j=i++)s+=(poly[j][0]+poly[i][0])*(poly[j][1]-poly[i][1]);return Math.abs(s/2);}
function bounds(poly){const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]);return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};}
// A lane i is the strip u∈[i−1,i] from the zero line. Its length is the farthest point of the boundary anywhere across the
// whole 1 m width (exact polygon/strip intersection, rounded up to the cm), so "Do kraja" never leaves a sliver untreated.
function laneLen(site,i){if(site._ll&&site._ll[i]!=null)return site._ll[i];const p=clipRect(site.poly,i-1,0,i,1e7);
  const L=p.length?Math.ceil(Math.max(...p.map(q=>q[1]))*100-1e-6)/100:0;(site._ll=site._ll||{})[i]=L;return L;}
function laneCount(site){const b=bounds(site.poly);return Math.max(0,Math.ceil(b.x1-1e-9));}
// m² of the boundary polygon inside lane l between a and b metres (a slanted boundary cuts the last metre)
function segM2(s,l,a,b){if(!(b>a))return 0;const p=clipRect(s.poly,l-1,a,l,b);return p.length?polyArea(p):0;}
// part of the boundary that no lane covers (left of the nulta tačka or behind the zero line)
function uncoveredM2(s){if(s.mode==='boxes')return 0;const b=bounds(s.poly),p=clipRect(s.poly,0,0,Math.max(1,b.x1)+1,Math.max(1,b.y1)+1);return Math.max(0,polyArea(s.poly)-(p.length?polyArea(p):0));}
function findPos(s,f){return f.u!=null?toGK(s,f.u,f.v):toGK(s,f.lane-0.5+(f.off||0),f.dist);}
const findLocal=f=>f.u!=null?[f.u,f.v]:[f.lane-0.5+(f.off||0),f.dist];
const outCrs=s=>s.pack==='RS'?'UTM34':S.crs;
// coordinates in the system chosen for output (S.crs 'UTM34' means UTM in the site's zone)
function outXY(s,p){const o=outCrs(s);if(o===s.crs)return [p.Y,p.X];const w=planeToWgs(s,p);if(o==='UTM34'){const u=wgsToUtm(w.lat,w.lon,utmZone(s));return [u.E,u.N];}const g=wgsToGk6(w.lat,w.lon);return [g.Y,g.X];}
function crsFmt(s,p){const q=outXY(s,p),a=outCrs(s)==='UTM34'?['E','N']:['Y','X'];return a[0]+' '+gkn(q[0])+'  '+a[1]+' '+gkn(q[1]);}
// same, for the screen: Y and X never break inside a number
const crsHtml=(s,p)=>crsFmt(s,p).split('  ').map(x=>`<span class="nw">${x}</span>`).join(' ');
const crsName=(s=site())=>s.pack==='RS'?'SRB_ETRS89 / UTM 34N':(outCrs(s)==='UTM34'?'UTM '+utmZone(s)+'N':'Gaus-Kriger zona 6');

  r.onupgradeneeded=()=>{const d=r.result;['kv','photos'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n);});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}
function idb(store,mode,fn){return new Promise((res,rej)=>{const tx=ST.db.transaction(store,mode);const q=fn(tx.objectStore(store));let out;
  if(q)q.onsuccess=()=>{out=q.result;};tx.oncomplete=()=>res(out);tx.onerror=tx.onabort=()=>rej(tx.error);});}

  c.onsuccess=()=>{const k=c.result;if(k){out.push([k.key,k.value]);k.continue();}};tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);});}

/* ---------- state check: storage, backup files and old versions all pass through checkState() ----------
   Hard problems (no sites, a site without id, boundary or origin, a find without a place) reject the whole state with a
   message, so nothing is replaced. Everything else gets a value of the right type (strings stay strings, numbers numbers,
   images only as data:image base64), so no render can throw or inject markup. Fields that are absent stay absent. */
class StateError extends Error{}
const fin=x=>x!==null&&x!==undefined&&x!==''&&typeof x!=='boolean'&&!Array.isArray(x)&&isFinite(+x);
const S_=(x,d)=>x==null?(d===undefined?'':d):String(x);
const N_=(x,d)=>fin(x)?+x:d;
const A_=x=>Array.isArray(x)?x:[];
const D_=x=>typeof x==='string'&&DAYRE.test(x)?x:'';
const T_=x=>typeof x==='string'&&/^\d\d?:\d\d$/.test(x)?x:'';
const IMG=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
const safeImg=u=>typeof u==='string'&&IMG.test(u)?u:'';
const isObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
function checkState(raw){
  if(!isObj(raw)||!Array.isArray(raw.sites))throw new StateError('nema liste radilišta');
  let st;try{st=JSON.parse(JSON.stringify(raw));}catch(e){throw new StateError('podaci se ne mogu pročitati');}
  const errs=[],ids=new Set();if(!st.sites.length)errs.push('nema nijednog radilišta');
  st.sites.forEach((s,i)=>{const L='radilište '+(i+1);
    if(!isObj(s)){errs.push(L+': neispravan zapis');return;}
    if(typeof s.id!=='string'||!s.id.trim())errs.push(L+': nema oznaku');else if(ids.has(s.id))errs.push(L+': oznaka '+s.id.slice(0,20)+' se ponavlja');else ids.add(s.id);
    if(!isObj(s.msp)||!fin(s.msp.id)&&(typeof s.msp.id!=='string'||!s.msp.id.trim()))errs.push(L+': nema MSP / broj projekta');
    if(!isObj(s.nt)||!fin(s.nt.Y)||!fin(s.nt.X))errs.push(L+': nema nultu tačku (ishodište)');
    if(!Array.isArray(s.poly)||s.poly.length<3||s.poly.some(p=>!Array.isArray(p)||!fin(p[0])||!fin(p[1])))errs.push(L+': granica nema najmanje 3 ispravne lomne tačke');
    if(s.mode==='boxes'&&(!Array.isArray(s.boxes)||s.boxes.some(b=>!isObj(b)||!(Array.isArray(b.poly)||Array.isArray(b.parts)))))errs.push(L+': boksovi nisu ispravni');
    A_(s.finds).forEach(f=>{if(!isObj(f))return;const ok=s.mode==='boxes'?(f.box!=null&&fin(f.u)&&fin(f.v)):(fin(f.lane)&&fin(f.dist));if(!ok)errs.push(L+': nalaz '+S_(f.id).slice(0,20)+' nema mjesto (staza i metar ili boks)');});});
  if(errs.length)throw new StateError(errs.slice(0,4).join('; ')+(errs.length>4?' …':''));
  st.sites.forEach(fillSite);normalize(st);fillTop(st);return st;}
function fillSite(s){
  s.id=S_(s.id);s.pack=s.pack==='RS'?'RS':'BA';s.mode=s.mode==='boxes'?'boxes':'lanes';s.crs=s.pack==='RS'?'UTM34':(s.crs==='UTM34'?'UTM34':'GK6');
  const m=s.msp;['id','naziv','opcina','ru','karta','entitet','kanton','grad','infoPrije','zajednica','kartaNaziv','kartaList','kartaRazmjer','kartaGod'].forEach(k=>{if(m[k]!=null)m[k]=String(m[k]);});['naziv','opcina','ru','karta'].forEach(k=>{if(m[k]==null)m[k]='';});
  if(m.km2!=null)m.km2=N_(m.km2,null);
  const c=s.ci=isObj(s.ci)?s.ci:{};c.tip=['CI','SI','BAC'].includes(c.tip)?c.tip:(s.pack==='RS'?'BAC':'CI');c.oznaka=S_(c.oznaka,s.pack==='RS'?'Sektor':'CI');
  ['naziv','ocekivano'].forEach(k=>{if(c[k]!=null)c[k]=String(c[k]);});c.pmin=N_(c.pmin,null);c.pmax=N_(c.pmax,null);
  s.nt={Y:+s.nt.Y,X:+s.nt.X};s.az=N_(s.az,0);s.poly=s.poly.map(p=>[+p[0],+p[1]]);
  ['finds','log','qc','monitors','info','progress','pairs','incidents'].forEach(k=>{s[k]=A_(s[k]).filter(isObj);});
  s.lanes=isObj(s.lanes)?s.lanes:{};for(const k of Object.keys(s.lanes)){const v=N_(s.lanes[k],null);if(v==null||!/^-?\d+$/.test(k))delete s.lanes[k];else s.lanes[k]=v;}
  s.status=S_(s.status,'planirano');s.start=D_(s.start)||null;s.estEnd=D_(s.estEnd)||null;if(s.casevac!=null)s.casevac=D_(s.casevac)||null;
  s.finds.forEach((f,i)=>{if(typeof f.photo==='string'&&!f.thumb)f.thumb=f.photo;delete f.photo;f.id=S_(f.id)||('N-x'+(i+1));
    ['cat','type','cond','act','note'].forEach(k=>{f[k]=S_(f[k]);});['method','box'].forEach(k=>{if(f[k]!=null)f[k]=String(f[k]);});
    f.day=D_(f.day);f.time=T_(f.time);['lane','dist','off','u','v'].forEach(k=>{if(f[k]!=null)f[k]=N_(f[k],null);});f.depth=N_(f.depth,0);f.qty=Math.max(1,Math.round(N_(f.qty,1)));
    if('synced' in f)f.synced=!!f.synced;if('ph' in f)f.ph=f.ph?1:0;if('thumb' in f){const t=safeImg(f.thumb);if(t)f.thumb=t;else delete f.thumb;}
    if(f.actDay!=null){const d=D_(f.actDay);if(d)f.actDay=d;else delete f.actDay;}});
  s.log.forEach(l=>{l.t=S_(l.t);l.e=S_(l.e);if(l.k!=null)l.k=String(l.k);if(l.kg!=null)l.kg=N_(l.kg,0);if(l.d!=null&&l.d!=='')l.d=D_(l.d);});
  s.qc.forEach(q=>{q.day=D_(q.day);q.m2=N_(q.m2,0);if(q.met!=null)q.met=String(q.met);});
  s.monitors.forEach(x=>{x.day=D_(x.day);x.by=S_(x.by);});
  s.info.forEach(x=>{x.day=D_(x.day);x.t=S_(x.t);});
  s.progress=s.progress.filter(p=>fin(p.lane)&&fin(p.from)&&fin(p.to)).map(p=>({day:D_(p.day),lane:+p.lane,from:+p.from,to:+p.to}));
  s.pairs=s.pairs.filter(p=>fin(p.lane)).map(p=>Object.assign(p,{id:S_(p.id),a:S_(p.a),b:S_(p.b),lane:+p.lane,inA:!!p.inA,shift:N_(p.shift,Date.now())}));
  s.incidents.forEach(fillIncident);
  if(isObj(s.today))s.today={d:D_(s.today.d),brief:A_(s.today.brief).map(Boolean),at:T_(s.today.at)||null,started:!!s.today.started};else delete s.today;
  if(s.bh!=null&&!isObj(s.bh))delete s.bh;

      <div><dt>Početak rada</dt><dd>${fmtD(s.start).slice(0,6)}</dd></div>
    </dl></div>`;

  h+=`<div class="card"><div class="card-h"><h3>Dvojci</h3><span class="sub">smjena najviše ${R.shiftMax} min</span></div>`;
  s.pairs.forEach(p=>{const st=pairState(p),q=esc(p.id);
    h+=`<div class="pair${st.over?' over':''}" data-pair="${q}"><span class="tag">${q}</span>
      <span class="grow"><b>Staza ${esc(p.lane)}</b> · ${num(laneDone(s,p.lane),1)} m<br><span class="sub">${esc(st.inLane)} u stazi · ${esc(st.support)} podrška na ${R.pairGap} m</span></span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="t" data-timer="${q}">--:--</span><button class="btn sm" type="button" data-act="shift" data-p="${q}">Smjena</button></span></div>`;});
  h+=`</div>`;

  h+=`<div class="card"><div class="card-h"><h3>Usklađenost sa standardom</h3><span class="sub">${esc(P.kratko)}</span></div><ul class="chk">${compliance(s).map(c=>`<li class="${c.st}"><span class="ic" aria-hidden="true">${c.st==='ok'?'✓':c.st==='info'?'i':'!'}</span><span>${esc(c.t)}</span><span class="v">${esc(c.v)}</span></li>`).join('')}</ul></div>`;

  h+=logCard(s)+briefCard();

  h+=backupNag()+`<div class="btnrow noprint" style="justify-content:center"><button class="linkbtn" type="button" data-act="reset">Vrati početne podatke demoa</button></div>`;
  v.innerHTML=h; tick();
}

/* ================= MAPA (staze) ================= */
function mapSVG(s,opts={}){
  const b=bounds(s.poly), W=opts.w||330, padL=26, padR=14, padT=22, padB=opts.paper?44:56;
  const sc=(W-padL-padR)/(b.x1-b.x0+2);
  const H=Math.round((b.y1+2.5)*sc+padT+padB);
  const X=u=>padL+(u-b.x0+1)*sc, Y=v=>padT+(b.y1+0.5-v)*sc;
  const lc=laneCount(s);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Skica ${esc(s.ci.oznaka)}: radne staze od nulte linije">`;
  g+=`<rect class="m-safe" x="${X(b.x0-0.5)}" y="${Y(0)}" width="${(b.x1-b.x0+1)*sc}" height="${2*sc}"/>`;
  g+=`<path class="m-poly" d="M${s.poly.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('L')}Z"/>`;
  const active={};s.pairs.forEach(p=>active[p.lane]=p.id);
  for(let i=1;i<=lc;i++){const L=laneLen(s,i);if(L<=0)continue;const d=Math.min(laneDone(s,i),L);
    if(d>0)g+=`<rect class="${active[i]?'m-lane-p':'m-lane'}" x="${X(i-1)+.3}" y="${Y(d)}" width="${Math.max(.6,sc-.6)}" height="${d*sc}"/>`;
    if(!opts.paper)g+=`<rect class="m-hit" x="${X(i-1)}" y="${Y(L)}" width="${sc}" height="${L*sc}" data-act="lane" data-l="${i}"><title>Staza ${i}</title></rect>`;
    if(selLane===i&&!opts.paper)g+=`<rect class="m-sel" x="${X(i-1)}" y="${Y(L)}" width="${sc}" height="${L*sc}"/>`;}
  g+=`<line class="m-zero" x1="${X(b.x0-0.5)}" x2="${X(b.x1+0.5)}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s.finds.forEach(f=>{const cx=X(f.lane-0.5+(f.off||0)),cy=Y(f.dist),r=opts.paper?3.2:4;g+=`<path class="m-mk" d="M${cx} ${cy-r}L${cx+r} ${cy+r*.8}H${cx-r}Z"/>`;});
  if(opts.paper){s.poly.forEach((p,i)=>{g+=`<circle class="m-tp" cx="${X(p[0])}" cy="${Y(p[1])}" r="2.4"/><text class="m-t ink" x="${X(p[0])+4}" y="${Y(p[1])-3}">T${i+1}</text>`;});}
  else{const ps=s.pairs.slice().sort((a,b)=>a.lane-b.lane);ps.forEach(p=>{g+=`<text class="m-t big" x="${X(p.lane-0.5)}" y="${Y(laneLen(s,p.lane))-4}" text-anchor="middle">${esc(p.id)}</text>`;});
    for(let i=1;i<ps.length;i++){const y=Y(0)+12+((i%2)*9);g+=`<line class="m-gap" x1="${X(ps[i-1].lane-0.5)}" x2="${X(ps[i].lane-0.5)}" y1="${y}" y2="${y}"/><text class="m-t" x="${(X(ps[i-1].lane-0.5)+X(ps[i].lane-0.5))/2}" y="${y-2}" text-anchor="middle">${(ps[i].lane-ps[i-1].lane)*R.lane} m</text>`;}}
  g+=`<circle cx="${X(0)}" cy="${Y(0)}" r="4.5" fill="var(--ink)"/><text class="m-t ink" x="${X(0)+2}" y="${Y(0)+(opts.paper?24:36)}">NT · nulta tačka</text>`;
  g+=`<text class="m-t" x="${X(b.x1+0.5)}" y="${Y(0)+(opts.paper?24:36)}" text-anchor="end">sigurna staza · nulta linija</text>`;
  Array.from({length:Math.floor(b.y1/10)+1},(_,i)=>i*10).forEach(m=>{g+=`<text class="m-t" x="${padL-4}" y="${Y(m)+3}" text-anchor="end">${m}</text>`;});
  const a=-s.az*D2R, nx=W-22, ny=24, L2=11, vx=Math.sin(-a)*-1, vy=Math.cos(a);
  const ex=nx+(-Math.sin(s.az*D2R))*L2, ey=ny-Math.cos(s.az*D2R)*L2;
  g+=`<circle class="m-n" cx="${nx}" cy="${ny}" r="13"/><line class="m-n" x1="${nx}" y1="${ny}" x2="${ex}" y2="${ey}" stroke-width="2"/><text class="m-t ink" x="${nx+(-Math.sin(s.az*D2R))*20}" y="${ny-Math.cos(s.az*D2R)*20+3}" text-anchor="middle">S</text>`;
  g+=`<text class="m-t" x="${padL}" y="12">m od nulte linije · azimut napredovanja ${s.az}°</text>`;
  g+='</svg>';return g;
}
function renderMapa(){
  const s=site();if(s.mode==='boxes')return renderMapaB();const lc=laneCount(s);
  let done=0,full=0;for(let i=1;i<=lc;i++){const L=laneLen(s,i);if(L<=0)continue;if(laneDone(s,i)>=L-0.01)full++;else if(laneDone(s,i)>0)done++;}
  $('#v-mapa').innerHTML=`
    <div><div class="label">${esc(s.msp.id)} ${esc(s.msp.naziv)} · ${esc(s.ci.tip==='CI'?'ciljana istraga':'sistematska istraga')} ${esc(s.ci.oznaka)}</div><h2>Radne staze</h2></div>
    <div class="legend"><span><i style="background:var(--haz-soft);outline:1.5px dashed var(--hazard);outline-offset:-1.5px"></i>POPO</span><span><i style="background:var(--cleared)"></i>Očišćeno</span><span><i style="background:var(--work)"></i>Staza u radu</span><span><i style="background:var(--clr-soft)"></i>Sigurna staza</span><span>${TRI.replace('class="tri"','class="tri" style="width:12px;height:11px;vertical-align:-1px;margin-right:5px"')}Nalaz</span></div>
    <div class="mapwrap">${mapSVG(s)}</div>
    <div class="sub">Dodirni stazu. Staza je široka ${R.lane} m; dužina se mjeri od nulte linije u smjeru azimuta ${s.az}°.</div>
    <div class="card"><dl class="kv">
      <dt>Nulta tačka</dt><dd class="mono">${crsFmt(s,s.nt)}</dd>
      <dt>Koord. sistem</dt><dd>${crsName()}</dd>
      <dt>Površina</dt><dd>${num(totalArea(s))} m²${s.ci.pmin&&s.ci.pmax?' (plan '+num(s.ci.pmin)+'–'+num(s.ci.pmax)+' m²)':''}</dd>
      <dt>Staze</dt><dd>${full} završeno · ${done} u radu · ${lc} ukupno</dd>
      <dt>Lomne tačke</dt><dd>${s.poly.length} (T1–T${s.poly.length})</dd>
    </dl>${uncoveredM2(s)>0.5?`<div class="notice haz" style="margin:10px 0 0">${num(uncoveredM2(s),1)} m² granice je lijevo od nulte tačke ili iza nulte linije i nije ni u jednoj radnoj stazi. Provjeri dosije.</div>`:''}</div>`;
}
const pairCanMove=(s,p,l)=>!s.pairs.some(o=>o!==p&&Math.abs(o.lane-l)*R.lane<R.pairGap);
function openLane(i){
  const s=site(); selLane=i; renderMapa();
  const L=laneLen(s,i), d=laneDone(s,i), p=s.pairs.find(x=>x.lane===i), fs=s.finds.filter(f=>f.lane===i);

  openSheet(`<div class="sheet-h"><div><div class="label">${esc(s.ci.oznaka)} · širina ${R.lane} m</div><h2>Radna staza ${i}</h2></div><button class="x" type="button" data-act="close" aria-label="Zatvori">×</button></div>
    <dl class="kv"><dt>Očišćeno</dt><dd>${num(d,2)} m od ${num(L,2)} m · ${num(segM2(s,i,0,d),1)} m²</dd>
      <dt>Čelo staze</dt><dd class="mono">${crsFmt(s,head)}</dd>
      ${p?`<dt>Dvojac</dt><dd>${esc(p.id)}: ${esc(pairState(p).inLane)} u stazi, ${esc(pairState(p).support)} podrška</dd>`:''}
      <dt>Nalazi</dt><dd>${fs.length?fs.map(f=>esc(f.type)+' na '+num(f.dist,1)+' m').join(', '):'nema'}</dd></dl>
    ${d<L?`<div class="grid3">
      <button class="btn" type="button" data-act="adv" data-l="${i}" data-m="0.5">+0,5 m</button>
      <button class="btn" type="button" data-act="adv" data-l="${i}" data-m="1">+1 m</button>
      <button class="btn" type="button" data-act="adv" data-l="${i}" data-m="${(L-d).toFixed(2)}">Do kraja</button></div>`:'<div class="notice" style="background:var(--clr-soft)">Staza je očišćena cijelom dužinom.</div>'}
    ${p||!s.pairs.length?'':`<div class="label">Premjesti dvojac u stazu ${i}</div><div class="btnrow">${s.pairs.map(x=>{const ok=pairCanMove(s,x,i);return `<button class="btn sm" type="button" data-act="moveA" data-l="${i}" data-p="${esc(x.id)}" ${ok?'':'disabled'} title="${ok?'':'bliže od '+R.pairGap+' m drugom dvojcu'}">Dvojac ${esc(x.id)} (staza ${esc(x.lane)}${laneDone(s,x.lane)>=laneLen(s,x.lane)-0.01?', završena':''})</button>`;}).join('')}</div><p class="fine" style="margin:0">Dvojac može u stazu koja je najmanje ${R.pairGap} m od svih drugih dvojaca.</p>`}
    <div class="btnrow"><button class="btn primary" type="button" data-act="findHere" data-l="${i}">Dodaj nalaz u stazi ${i}</button></div>`);
}

function fillTypes(){const c=(document.querySelector('input[name="fcat"]:checked')||{}).value||'PP';
  $('#typeChips').innerHTML=P.items[c].map((t,i)=>`<label><input type="radio" name="ftype" value="${esc(t)}" id="ft${c}${i}" ${c==='MI'?'checked':''}><span>${esc(t)}</span></label>`).join('');}
function calcPos(){
  const s=site(), l=+$('#fLane').value, d=parseFloat($('#fDist').value)||0, o=Math.max(-0.5,Math.min(0.5,parseFloat($('#fOff').value)||0));
  const gk=toGK(s,l-0.5+o,d), w=planeToWgs(s,gk), done=laneDone(s,l), ahead=d>done+1.0;

// "Uporedi sa GPS-om": the phone's real position against the computed one, with the accuracy the phone reports
let gpsPos=null;
const gpsBtn=()=>('geolocation' in navigator)?'<span class="gpsrow"><button class="btn sm" type="button" data-act="gpsCmp">Uporedi sa GPS-om</button><span id="gpsOut" class="sub" role="status"></span></span>':'';
function gpsCompare(){const out=$('#gpsOut'),w=gpsPos;if(!out||!w||!navigator.geolocation)return;out.textContent='Čekam GPS…';
  try{navigator.geolocation.getCurrentPosition(p=>{const c=p.coords,d=6371000*Math.hypot((c.latitude-w.lat)*D2R,(c.longitude-w.lon)*D2R*Math.cos(w.lat*D2R)),o=$('#gpsOut');
      if(o)o.textContent='GPS telefona: '+num(d,1)+' m od izračunatog položaja (tačnost GPS-a ±'+num(c.accuracy,0)+' m, '+hm(p.timestamp||Date.now())+')'+(demoShift(site())?'; za BiH uključuje i demo transformaciju':'')+'.';},
    err=>{const o=$('#gpsOut');if(o)o.textContent='GPS nije dostupan: '+(err&&err.code===1?'pristup lokaciji nije dozvoljen':'nema signala ili isteklo vrijeme')+'.';},{enableHighAccuracy:true,timeout:20000,maximumAge:0});}catch(e){out.textContent='GPS nije dostupan.';}}
// full photo (long side 1600 px) goes to IndexedDB as evidence; the 220 px thumbnail stays in the find record
function scaled(img,m){const c=document.createElement('canvas'),sc=Math.min(1,m/Math.max(img.width,img.height));c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;}

function onPhoto(e){const file=e.target.files&&e.target.files[0];if(!file)return;const img=new Image(),url=URL.createObjectURL(file),tok=photoTok;

// find ids are numbered per site (photo keys are site/id), above every id the site has ever had, and checked for uniqueness
function newFindId(s){let n=+s.lastFind||0;s.finds.forEach(f=>{const m=String(f.id).match(/^N-(\d+)$/);if(m)n=Math.max(n,+m[1]);});let id;do{n++;id='N-'+String(n).padStart(3,'0');}while(s.finds.some(f=>f.id===id));s.lastFind=n;return id;}
function onSubmit(e){e.preventDefault();const s=site();
  const t=document.querySelector('input[name="ftype"]:checked');if(!t){toast('Izaberi vrstu sredstva.');return;}

  g+=`</g><g transform="translate(${L+mw-7} ${T+3})"><path d="M0 0L-1.8 5H1.8Z" fill="${ink}"/><line x1="0" y1="4" x2="0" y2="9" stroke="${ink}" stroke-width="0.35"/><text x="2.2" y="3" font-size="2.2" font-weight="700">S</text></g>`;
  for(let e=Math.ceil(e0/step)*step;e<=e1;e+=step)g+=`<text x="${X(e)}" y="${T+mh+2.6}" font-size="1.7" text-anchor="middle" ${mono}>${gkn(e).split(',')[0]}</text>`;
  for(let n=Math.ceil(n0/step)*step;n<=n1;n+=step)g+=`<text x="${L-0.8}" y="${Y(n)+0.6}" font-size="1.7" text-anchor="end" ${mono}>${gkn(n).split(',')[0]}</text>`;
  const bar=[5,10,20,25,50,100,200,500,1000].find(m=>m*k>=18)||1000,by=T+mh+7,bw=bar*k;
  g+=`<rect x="${L}" y="${by}" width="${bw/2}" height="1.2" fill="${ink}"/><rect x="${L+bw/2}" y="${by}" width="${bw/2}" height="1.2" fill="#fff" stroke="${ink}" stroke-width="0.2"/>
    <text x="${L}" y="${by+3.6}" font-size="1.9">0</text><text x="${L+bw}" y="${by+3.6}" font-size="1.9" text-anchor="middle">${bar} m</text>

function p11Opis(x,w,wf,cum){const b=bh(x);
  if(!x.start)return 'Rad na '+esc(x.ci.oznaka)+' još nije počeo'+(b.planOd?'; planirani početak '+fmtD(b.planOd):'')+'.';
  const out=[],pd=b.planDana||wdBetween(b.planOd,b.planDo),el=wdBetween(x.start,w.to);
  if(pd&&el!=null){const exp=Math.min(1,el/pd)*totalArea(x);out.push(cum>=exp*0.9?'Operacije se odvijaju po izvedbenom planu':'Operacije kasne u odnosu na izvedbeni plan (planirano oko '+num(exp)+' m², realizirano '+num(cum)+' m²)');}
  else out.push('Da li se operacije odvijaju po planu: '+DOP);
  const nd=deminers().length;out.push('rad '+(nd?nd+' deminera u dvojcima':'deminera')+' u radnim stazama širine '+BA_R.lane+' m'+(x.pairs.length?' (staze '+x.pairs.map(p=>p.lane).join(', ')+')':''));
  const types=[...new Set(wf.map(f=>f.type))];
  if(!types.length)out.push('u sedmici nisu pronađena ES');
  else if(x.ci.ocekivano){const ex=x.ci.ocekivano.toLowerCase(),un=types.filter(t=>!ex.includes(t.toLowerCase()));out.push(un.length?'pronađena su i neočekivana ES: '+esc(un.join(', ')):'pronađena ES su očekivana prema dosijeu');}
  else out.push('pronađena ES očekivana ili ne: '+DOP);
  out.push('tehnička metoda: '+metodaTxt(b));const t=out.join('; ')+'.';return t.charAt(0).toUpperCase()+t.slice(1);}

      <td>Ja ${BL}, inspektor za KK BHMAC-a na osnovu vlastitih saznanja i kroz eksterni monitoring zadatka od strane referenta za KK ${BL}, RU ${BL}, PREUZIMAM navedenu očišćenu površinu (u ime BHMAC-a), jer su monitoring i uzorkovanje pokazali da je čišćenje površine izvršeno u skladu sa zahtjevima Standarda za protivminske akcije u BiH.${sgn('(potpis inspektora)','')}</td></tr>
    <tr><td>21. Ime i položaj odgovorne osobe deminerske organizacije:<br><b>${o.odgovorna.ime?esc(o.odgovorna.ime+(o.odgovorna.poz?', '+o.odgovorna.poz:'')):DOP}</b></td><td>22. Ime šefa ureda/kancelarije BHMAC-a:<br>${BL}</td></tr>

    ${hOk?'':'<p class="note">* Zbir sati ne uključuje dane bez upisanog početka i kraja rada u dnevniku.</p>'}${mach}`+dfoot('Prilog 6 b) Pregled rada po danima',s);}

function p6g(s){const ms=s.monitors,L=s.log,Q=['Sigurnosne udaljenosti na radilištu (Prilog 2)','Obilježavanje radilišta, sigurne staze i radnih staza','Test detektora na UPMAH-3 i evidencija detektora','Rad u radnoj stazi, smjene i odmori deminera','Interna kontrola kvaliteta uzorkovanjem','Medicinska podrška i plan CASEVAC','Dokumentacija na radilištu (dnevni izvještaj, evidencije)'];

// Numbers on one line of a coordinate list. Spaces may group thousands ("6 571 898,00"): a group starts with 1–3 digits and takes
// following 3-digit groups up to 7 digits; a decimal part ends the number. "6571898 4922400 512" -> [6571898, 4922400, 512].
function lineNums(l){const out=[];let cur=null,dig=0,grp=false;const flush=()=>{if(cur!=null)out.push(parseNum(cur));cur=null;dig=0;grp=false;};
  for(const t of String(l).trim().split(/[\s;\t]+/).filter(Boolean)){if(!/^[-+]?\d+([.,]\d+)?$/.test(t)){flush();continue;}
    const g3=/^\d{3}([.,]\d+)?$/.test(t);
    if(cur!=null&&grp&&g3&&dig<7){cur+=t;dig+=3;}else{flush();cur=t;const n=t.replace(/^[-+]/,'').replace(/[.,].*$/,'');dig=n.length;grp=n.length<=3&&!/[.,]/.test(t);}
    if(/[.,]/.test(t))flush();}
  flush();return out;}

function tpParse(txt){const pts=[],errs=[];let h=0;String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const n=lineNums(l);
    if(n.length===2||n.length===3){pts.push([n[0],n[1]]);if(n.length===3)h++;}else{pts.push([NaN,NaN]);errs.push('red '+(i+1)+' ('+l.slice(0,30)+'): očekuju se 2 broja'+(n.length>3?', a ima ih '+n.length:''));}});
  return {pts,errs,h};}

function checkNewSiteBA(){

  if(ntIn.length!==2||!inR(ntIn))return {err:'Nulta tačka nije u BiH za izabrani sistem ('+R0.t+'). Provjeri redoslijed i koordinatni sistem.'};
  if(!isFinite(azv)||azv<0||azv>=360)return {err:'Azimut mora biti broj od 0 do 359,9°.'};
  if(tp.errs.length)return {err:'Lomne tačke: '+tp.errs.slice(0,2).join('; ')+'.'};
  if(tp.pts.length<3)return {err:'Treba najmanje 3 lomne tačke.'};
  if(tp.pts.length>200)return {err:'Granica ima '+tp.pts.length+' tačaka; najviše 200.'};
  const bad=tp.pts.findIndex(p=>!inR(p));if(bad>=0)return {err:'Tačka T'+(bad+1)+' nije u BiH za izabrani sistem ('+R0.t+'). Provjeri cifre i redoslijed.'};

  const far=gk.map(p=>Math.hypot(p.Y-nt.Y,p.X-nt.X)),fi=far.indexOf(Math.max(...far));
  if(far[fi]>2000)return {err:'Tačka T'+(fi+1)+' je '+num(far[fi]/1000,1)+' km od nulte tačke. Provjeri cifre (CI/SI je najviše 2 km od NT).'};
  const n=gk.length;for(let a=0;a<n;a++)for(let b=a+2;b<n;b++){if(a===0&&b===n-1)continue;const P=q=>[q.Y,q.X];if(segsCross(P(gk[a]),P(gk[(a+1)%n]),P(gk[b]),P(gk[(b+1)%n])))return {err:'Granica se siječe sama sa sobom (stranice T'+(a+1)+'–T'+((a+1)%n+1)+' i T'+(b+1)+'–T'+((b+1)%n+1)+'). Provjeri redoslijed tačaka.'};}
  const s={id:'s'+Date.now(),pack:'BA',crs:'GK6',mode:'lanes',msp:{id:$('#nsMsp').value.trim()||'MSP',naziv:$('#nsName').value.trim(),opcina:$('#nsOpc').value.trim(),ru:$('#nsRu').value,karta:''},
    ci:{tip:$('#nsTip').value==='SI'?'SI':'CI',oznaka:$('#nsCi').value.trim()||'CI-1',pmin:null,pmax:null},nt,az:+azv.toFixed(2),poly:[],lanes:{},pairs:[],progress:[],finds:[],log:[],qc:[],monitors:[],info:[],incidents:[],start:null,estEnd:null,status:'planirano'};

  if(b.x0<-0.05)return {err:'Dio granice je '+num(-b.x0,2)+' m lijevo od nulte tačke. Radne staze idu udesno od NT, pa taj dio ne bi bio ni u jednoj stazi. Nulta tačka treba biti na lijevom kraju nulte linije; provjeri i azimut.'};
  if(b.y0<-0.05)return {err:'Dio granice je '+num(-b.y0,2)+' m iza nulte linije (suprotno od azimuta '+num(s.az,1)+'°). Provjeri azimut napredovanja.'};

/* ================= Serbia pack: box grid mode ================= */
const L10=(ba,rs)=>site().pack==='RS'?rs:ba;
function clipHalf(pts,inside,inter){const out=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],ai=inside(a),bi=inside(b);if(ai&&bi)out.push(b);else if(ai&&!bi)out.push(inter(a,b));else if(!ai&&bi){out.push(inter(a,b));out.push(b);}}return out;}
function lerpX(a,b,x){return [x,a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])];}
function lerpY(a,b,y){return [a[0]+(b[0]-a[0])*(y-a[1])/(b[1]-a[1]),y];}
function clipRect(poly,x0,y0,x1,y1){let p=poly;p=clipHalf(p,q=>q[0]>=x0,(a,b)=>lerpX(a,b,x0));if(p.length<3)return [];p=clipHalf(p,q=>q[0]<=x1,(a,b)=>lerpX(a,b,x1));if(p.length<3)return [];p=clipHalf(p,q=>q[1]>=y0,(a,b)=>lerpY(a,b,y0));if(p.length<3)return [];p=clipHalf(p,q=>q[1]<=y1,(a,b)=>lerpY(a,b,y1));return p.length<3?[]:p;}
function rowName(r){const ROWL='ABCDEFGHIJKLMNOPRSTUVZ';return r<ROWL.length?ROWL[r]:ROWL[Math.floor(r/ROWL.length)-1]+ROWL[r%ROWL.length];}

/* ---------- local grid frame ----------
   Boxes live in the site's local frame (u,v): v runs along the grid's main axis (azimuth site.az), u along the cross axis (az+90°).
   Everything drawn is north-up, so drawings go local → E/N offsets from the origin site.nt (toGK minus nt). */
function enOf(s,q){const a=(s.az||0)*D2R,c=Math.cos(a),k=Math.sin(a);return [q[0]*c+q[1]*k,q[1]*c-q[0]*k];}
// geographic north on the plane grid (radians, clockwise from grid north): UTM grid north differs by the meridian convergence
function trueNorth(s){try{const n=s.poly.length,c=s.poly.reduce((a,p)=>[a[0]+p[0]/n,a[1]+p[1]/n],[0,0]),p=toGK(s,c[0],c[1]),w=planeToWgs(s,p);
  let q;if(s.crs==='UTM34'){const u=wgsToUtm34(w.lat+0.001,w.lon);q={Y:u.E,X:u.N};}else q=wgsToGk6(w.lat+0.001,w.lon);return Math.atan2(q.Y-p.Y,q.X-p.X);}catch(e){return 0;}}
const normAz=a=>{a=((+a||0)%360+360)%360;if(a>180)a-=360;return +a.toFixed(2);};
const azTxt=a=>{a=((a%360)+360)%360;return num(a,Math.abs(a-Math.round(a))<0.05?0:1)+'°';};
function axisTxt(s){const a=s.az||0;return a?{corner:'početnog ugla',Corner:'Početni ugao',u:'duž ose '+azTxt(a+90),v:'duž ose '+azTxt(a),U:'osa '+azTxt(a+90),V:'osa '+azTxt(a)}
  :{corner:'JZ ugla',Corner:'JZ ugao',u:'istočno',v:'severno',U:'istok',V:'sever'};}

/* ---------- box geometry ----------
   A box is a union of grid rectangles (rects, local frame) clipped to the site boundary (parts).
   One rect normally; a split gives smaller rects, a merge gives several. poly = outline ring of the union. */
function sArea(p){let a=0;for(let i=0,j=p.length-1;i<p.length;j=i++)a+=(p[j][0]+p[i][0])*(p[j][1]-p[i][1]);return -a/2;}
const r2=q=>[+q[0].toFixed(2),+q[1].toFixed(2)];
function partsOf(s,rects){return rects.map(r=>clipRect(s.poly,r[0],r[1],r[2],r[3])).filter(p=>p.length&&polyArea(p)>0.01).map(p=>p.map(r2));}
function bxParts(b){return b.parts&&b.parts.length?b.parts:[b.poly];}
function inBox(b,pt){return bxParts(b).some(p=>inPoly(pt,p));}
// outline segments of the union of the parts: seams between merged cells are left out (T-junctions are split first)
function boxEdges(b){const ps=bxParts(b);if(ps.length===1)return ps[0].map((q,i)=>[q,ps[0][(i+1)%ps[0].length]]);const out=[];
  ps.forEach((p,i)=>{const ccw=sArea(p)>0;p.forEach((a,k)=>{const c=p[(k+1)%p.length],dx=c[0]-a[0],dy=c[1]-a[1],L=Math.hypot(dx,dy);if(L<1e-6)return;const ts=[0,1];
    ps.forEach((o,j)=>{if(j!==i)o.forEach(v=>{const t=((v[0]-a[0])*dx+(v[1]-a[1])*dy)/(L*L);if(t>1e-4&&t<1-1e-4&&Math.abs((v[0]-a[0])*dy-(v[1]-a[1])*dx)/L<0.02)ts.push(t);});});
    ts.sort((x,y)=>x-y);const nx=(ccw?dy:-dy)/L,ny=(ccw?-dx:dx)/L;
    for(let m=1;m<ts.length;m++){if(ts[m]-ts[m-1]<1e-6)continue;const tm=(ts[m]+ts[m-1])/2,pt=[a[0]+dx*tm+nx*0.05,a[1]+dy*tm+ny*0.05];
      if(!ps.some((o,j)=>j!==i&&inPoly(pt,o)))out.push([[a[0]+dx*ts[m-1],a[1]+dy*ts[m-1]],[a[0]+dx*ts[m],a[1]+dy*ts[m]]]);}});});
  return out;}
function edgeRings(segs){const left=segs.slice(),rings=[],near=(p,q)=>Math.abs(p[0]-q[0])<0.03&&Math.abs(p[1]-q[1])<0.03;
  while(left.length){const r=[left[0][0],left[0][1]];left.shift();let g=0;
    while(!near(r[r.length-1],r[0])&&g++<5000){const e=r[r.length-1],k=left.findIndex(x=>near(x[0],e)||near(x[1],e));if(k<0)break;const x=left.splice(k,1)[0];r.push(near(x[0],e)?x[1]:x[0]);}
    if(near(r[r.length-1],r[0]))r.pop();
    const c=r.filter((p,i)=>{const a=r[(i-1+r.length)%r.length],b=r[(i+1)%r.length];return Math.abs((p[0]-a[0])*(b[1]-a[1])-(p[1]-a[1])*(b[0]-a[0]))>1e-3;});
    if(c.length>=3)rings.push(c.map(r2));}
  return rings.sort((a,b)=>polyArea(b)-polyArea(a));}
function boxRings(b){const ps=bxParts(b);if(ps.length===1)return [ps[0]];const r=edgeRings(boxEdges(b));return r.length?r:ps;}
function buildBox(s,o){const parts=partsOf(s,o.rects);if(!parts.length)return null;
  const area=parts.reduce((a,p)=>a+polyArea(p),0),R4=o.rects,x0=Math.min(...R4.map(r=>r[0])),y0=Math.min(...R4.map(r=>r[1])),x1=Math.max(...R4.map(r=>r[2])),y1=Math.max(...R4.map(r=>r[3]));
  const b={id:o.id,x0,y0,w:+(x1-x0).toFixed(2),h:+(y1-y0).toFixed(2),rects:R4,parts,poly:parts[0],area:+area.toFixed(1),cx:0,cy:0,need:o.need||['CEIA'],done:o.done||{}};
  if(o.excl)b.excl=o.excl;if(parts.length>1)b.poly=boxRings(b)[0];
  const ctr=p=>[p.reduce((a,q)=>a+q[0],0)/p.length,p.reduce((a,q)=>a+q[1],0)/p.length];let c=ctr(parts[0]);
  if(parts.length>1){c=[0,0];parts.forEach(p=>{const m=ctr(p),w=polyArea(p)/area;c[0]+=m[0]*w;c[1]+=m[1]*w;});if(!inBox(b,c))c=ctr(parts.slice().sort((p,q)=>polyArea(q)-polyArea(p))[0]);}
  b.cx=+c[0].toFixed(2);b.cy=+c[1].toFixed(2);return b;}
function makeBoxes(s,size){
  const b=bounds(s.poly),gx=Math.floor(b.x0/size)*size,gy=Math.floor(b.y0/size)*size;s.boxes=[];s.grid=size;
  for(let r=0;gy+r*size<b.y1;r++)for(let c=0;gx+c*size<b.x1;c++){const x0=gx+c*size,y0=gy+r*size,bx=buildBox(s,{id:rowName(r)+'-'+pad(c+1),rects:[[x0,y0,x0+size,y0+size]]});if(bx&&bx.area>=4)s.boxes.push(bx);}
}
// saved data from before box editing / features: fill the new fields so old sites keep working
function normRS(s){if(!s||s.mode!=='boxes')return s;const g=s.grid||10;if(s.az==null)s.az=0;
  (s.boxes||[]).forEach(b=>{if(!b.rects){b.rects=[[b.x0,b.y0,b.x0+g,b.y0+g]];b.w=g;b.h=g;b.parts=[b.poly];}if(!b.need)b.need=['CEIA'];if(!b.done)b.done={};});
  if(!Array.isArray(s.feats))s.feats=s.rail&&s.rail.length?[{id:'F1',kind:'pruga',name:'Pruga',pts:s.rail,buf:11}]:[];
  if(!s.rail)s.rail=[];return s;}

/* ---------- landmarks and obstacles ---------- */
const FK={pruga:{n:'Pruga',acc:'prugu',lin:1,buf:11},put:{n:'Put',acc:'put',lin:1,buf:0},dalekovod:{n:'Dalekovod',acc:'dalekovod',lin:1,buf:0},kanal:{n:'Kanal',acc:'kanal',lin:1,buf:0},
  potok:{n:'Potok',acc:'potok',lin:1,buf:0},reper:{n:'Reper',acc:'reper',lin:0,buf:0},stub:{n:'Stub',acc:'stub',lin:0,buf:0}};
const feats=s=>(s&&s.feats)||[];
const fkOf=f=>FK[f.kind]||FK.put;
function syncRail(s){const r=feats(s).find(f=>f.kind==='pruga');s.rail=r?r.pts:[];}
function segPt(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy,t=L2?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
function distToLine(p,pts){if(pts.length===1)return Math.hypot(p[0]-pts[0][0],p[1]-pts[0][1]);let m=Infinity;for(let i=1;i<pts.length;i++)m=Math.min(m,segPt(p,pts[i-1],pts[i]));return m;}
function segsCross(a,b,c,d){const o=(p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]));const A=o(a,b,c),B=o(a,b,d),C=o(c,d,a),D=o(c,d,b);return A*B<0&&C*D<0;}
// shortest distance between a polygon (area) and a polyline or point; 0 if they touch or overlap
function polyLineDist(poly,pts){if(pts.some(p=>inPoly(p,poly)))return 0;let m=Infinity;
  for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];pts.forEach(p=>{m=Math.min(m,segPt(p,a,b));});
    for(let j=1;j<pts.length;j++){if(segsCross(a,b,pts[j-1],pts[j]))return 0;m=Math.min(m,segPt(a,pts[j-1],pts[j]));}}return m;}
// rule from the project: a box that comes within buf metres of a feature is also searched with the Schonstedt
function schFeats(s,b){return feats(s).filter(f=>f.buf>0&&f.pts.length&&bxParts(b).some(p=>polyLineDist(p,f.pts)<f.buf));}
function recalcNeed(s){let ch=0;(s.boxes||[]).forEach(b=>{const sch=schFeats(s,b).length>0;if(sch!==b.need.includes('SCH')){b.need=sch?['CEIA','SCH']:['CEIA'];ch++;}});return ch;}
function bufTxt(s){const f=feats(s).filter(x=>x.buf>0);return f.length?f.map(x=>fkOf(x).acc+' ('+num(x.buf,x.buf%1?1:0)+' m)').filter((t,i,a)=>a.indexOf(t)===i).join(', '):'';}

/* ---------- box editing: split, merge, rename, exclude ---------- */
const EXCL={zgrada:'zgrada / objekat',put:'put',voda:'voda',ostalo:'ostalo'};
const exclTxt=e=>e?(EXCL[e.why]||e.why)+(e.note?' ('+e.note+')':''):'';
function boxStat(b){return b.excl?'x':boxDone(b)?'d':(Object.keys(b.done).some(m=>b.need.includes(m))?'p':'n');}
function rehomeFinds(s,fromIds,boxes){fromIds=new Set(fromIds);s.finds.forEach(f=>{if(!fromIds.has(f.box))return;const pt=[f.u,f.v];
  const hit=boxes.find(b=>inBox(b,pt))||boxes.slice().sort((a,b)=>Math.hypot(a.cx-pt[0],a.cy-pt[1])-Math.hypot(b.cx-pt[0],b.cy-pt[1]))[0];f.box=hit.id;});}
function freeId(s,base,suf,skip){let id=base+suf,n=2;while(s.boxes.some(b=>b.id===id&&b.id!==skip))id=base+suf+'.'+(n++);return id;}
// split in 2 along the cross axis (mode 'u'), along the main axis ('v') or into 4; cuts are metres from the box's start corner
function splitBox(s,id,mode,cu,cv){const b=boxById(s,id);if(!b)return 'Boks ne postoji.';
  if(b.rects.length>1)return 'Spojeni boks se ne deli. Podeli boksove pre spajanja.';
  const [x0,y0,x1,y1]=b.rects[0],w=x1-x0,h=y1-y0;cu=isFinite(cu)?cu:w/2;cv=isFinite(cv)?cv:h/2;
  if((mode!=='v')&&(cu<0.5||cu>w-0.5))return 'Rez mora biti između 0,5 i '+num(w-0.5,1)+' m od početnog ugla.';
  if((mode!=='u')&&(cv<0.5||cv>h-0.5))return 'Rez mora biti između 0,5 i '+num(h-0.5,1)+' m od početnog ugla.';
  const c=+(x0+cu).toFixed(2),d=+(y0+cv).toFixed(2);
  const rs=mode==='u'?[[x0,y0,c,y1],[c,y0,x1,y1]]:mode==='v'?[[x0,y0,x1,d],[x0,d,x1,y1]]:[[x0,y0,c,d],[c,y0,x1,d],[x0,d,c,y1],[c,d,x1,y1]];
  const sfx=/\d[a-z]$/.test(id)?['1','2','3','4']:['a','b','c','d'];
  const kids=rs.map((r,i)=>buildBox(s,{id:freeId(s,id,sfx[i],id),rects:[r],need:b.need.slice(),done:JSON.parse(JSON.stringify(b.done)),excl:b.excl?Object.assign({},b.excl):null})).filter(k=>k&&k.area>=0.5);
  if(kids.length<2)return 'Ovaj rez ne deli boks: drugi deo je van granice radilišta.';
  s.boxes.splice(s.boxes.indexOf(b),1,...kids);rehomeFinds(s,[id],kids);
  s.assign.forEach(a=>{if(a.box!==id)return;const k=kids.find(x=>!x.done[a.m])||kids[0];a.box=k.id;});
  logAdd(s,{t:hm(Date.now()),e:'Boks '+id+' podeljen na '+kids.map(k=>k.id).join(', ')});addQ('Podela boksa '+id);return kids;}
function rectsTouch(a,b){const e=0.01,ov=(p0,p1,q0,q1)=>Math.min(p1,q1)-Math.max(p0,q0)>e;
  return ((Math.abs(a[2]-b[0])<e||Math.abs(b[2]-a[0])<e)&&ov(a[1],a[3],b[1],b[3]))||((Math.abs(a[3]-b[1])<e||Math.abs(b[3]-a[1])<e)&&ov(a[0],a[2],b[0],b[2]));}
// merge adjacent boxes into one (union of their grid cells); the first id is kept
function mergeBoxes(s,ids){const bs=ids.map(id=>boxById(s,id)).filter(Boolean);if(bs.length<2)return 'Izaberi najmanje dva boksa.';
  const rects=[].concat(...bs.map(b=>b.rects)),seen=new Set([0]),q=[0];while(q.length){const i=q.shift();rects.forEach((r,j)=>{if(!seen.has(j)&&rectsTouch(rects[i],r)){seen.add(j);q.push(j);}});}
  if(seen.size<rects.length)return 'Boksovi nisu susedni. Spajaju se samo boksovi koji dele stranu.';
  if(new Set(bs.map(b=>!!b.excl)).size>1)return 'Isključen boks i boks za pretragu ne mogu se spojiti.';
  const need=['CEIA','SCH'].filter(m=>bs.some(b=>b.need.includes(m))),key=b=>need.map(m=>b.done[m]?P.methods[m]+' ✓':'').filter(Boolean).join(', ')||'nije pregledan';
  if(new Set(bs.map(key)).size>1)return 'Boksovi nisu u istom stanju ('+bs.map(b=>b.id+': '+key(b)).join('; ')+'). Spoji ih pre pregleda ili kad budu pregledani istim metodama.';
  const done={};Object.keys(bs[0].done).forEach(m=>{if(!bs.every(b=>b.done[m]))return;const d=bs.map(b=>b.done[m]);
    done[m]={day:d.map(x=>x.day).sort().pop(),by:[...new Set(d.map(x=>x.by))].join(', ')};});
  const nb=buildBox(s,{id:bs[0].id,rects:rects.map(r=>r.slice()),need,done,excl:bs[0].excl||null});if(!nb)return 'Spajanje nije uspelo.';
  const gone=new Set(bs.map(b=>b.id));s.boxes.splice(s.boxes.indexOf(bs[0]),1,nb);s.boxes=s.boxes.filter(b=>b===nb||!gone.has(b.id));
  s.finds.forEach(f=>{if(gone.has(f.box))f.box=nb.id;});
  s.assign.forEach(a=>{if(gone.has(a.box))a.box=nb.id;});s.assign=s.assign.filter((a,i,arr)=>arr.findIndex(x=>x.who===a.who)===i);
  logAdd(s,{t:hm(Date.now()),e:'Boksovi '+bs.map(b=>b.id).join(', ')+' spojeni u boks '+nb.id+' ('+num(nb.area)+' m²)'});addQ('Spajanje boksova '+nb.id);return nb;}
function renameBox(s,id,nid){nid=String(nid||'').trim().replace(/\s+/g,' ');const b=boxById(s,id);if(!b)return 'Boks ne postoji.';
  if(!nid||nid.length>16)return 'Naziv boksa: 1 do 16 znakova.';if(/[<>"&]/.test(nid))return 'Naziv ne sme imati znakove < > " &.';
  if(nid===id)return 'Naziv je isti.';if(boxById(s,nid))return 'Boks '+nid+' već postoji.';

/* ---------- skica napredovanja (paper, true scale, north-up) ---------- */
function skBounds(s){return bounds(s.poly.map(q=>enOf(s,q)));}
function skScale(s){const b=skBounds(s),Wm=b.x1-b.x0,Hm=b.y1-b.y0;return [500,1000,2000,2500,5000,10000].find(k=>Wm*1000/k<=100&&Hm*1000/k<=200)||10000;}
function skicaSVG(s){
  const b=skBounds(s),sc=skScale(s),k=1000/sc,PW=190,L=21,top=32,mapW=(b.x1-b.x0)*k,mapH=(b.y1-b.y0)*k,f2=n=>n.toFixed(2);

  const ink='#1d2a33',ex=s.boxes.filter(x=>x.excl),kinds=[...new Set(feats(s).map(f=>f.kind))].filter(x=>FK[x]);
  const rows=[[`<rect width="5" height="3.2" fill="url(#skC)" stroke="${ink}" stroke-width="0.15"/>`,'očišćeno CEIA detektorom'],[`<rect width="5" height="3.2" fill="url(#skS)" stroke="${ink}" stroke-width="0.15"/>`,'očišćeno Schonstedtom']];

  kinds.forEach(kd=>rows.push([featSVG({kind:kd,pts:FK[kd].lin?[[0,1.6],[5,1.6]]:[[2.5,1.9]]},q=>q,true,ink),FK[kd].n.toLowerCase()]));

  const lx=L+mapW+7,legendTop=top+mapH+13,PH=legendTop+Math.max(46,11+rows.length*5.2),tn=trueNorth(s)/D2R;
  let g=`<svg class="sk" xmlns="http://www.w3.org/2000/svg" width="${PW}mm" height="${PH.toFixed(1)}mm" viewBox="0 0 ${PW} ${PH.toFixed(2)}" role="img" aria-label="Skica napredovanja ${esc(s.msp.id)}, razmera 1:${sc}">
  <defs><pattern id="skMm" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0V1H0" fill="none" stroke="#d3e3ec" stroke-width="0.06"/></pattern>
  <pattern id="skCm" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0V10H0" fill="none" stroke="#a9c6d8" stroke-width="0.16"/></pattern>
  <pattern id="skS" width="1.4" height="1.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.4" stroke="${ink}" stroke-width="0.16"/></pattern>
  <pattern id="skC" width="1.8" height="1.8" patternUnits="userSpaceOnUse"><path d="M1.8 0V1.8H0" fill="none" stroke="${ink}" stroke-width="0.12"/></pattern>
  <pattern id="skX" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="2.2" height="2.2" fill="#eef1f3"/><line x1="0" y1="0" x2="0" y2="2.2" stroke="#7d8a93" stroke-width="0.55"/></pattern>
  <clipPath id="skClip"><rect x="${f2(L-1.5)}" y="${f2(top-1.5)}" width="${f2(mapW+3)}" height="${f2(mapH+3)}"/></clipPath></defs>
  <rect width="${PW}" height="${PH}" fill="#fbfdfe"/><rect width="${PW}" height="${PH}" fill="url(#skMm)"/><rect width="${PW}" height="${PH}" fill="url(#skCm)"/>
  <text class="sk-t" x="${PW/2}" y="10" text-anchor="middle">SKICA NAPREDOVANJA</text>
  <text class="sk-s" x="${PW/2}" y="15.5" text-anchor="middle">${esc(s.msp.naziv)}, ${esc(s.msp.opcina)} · ${esc(s.ci.oznaka)}</text>
  <text class="sk-s" x="${PW/2}" y="20.5" text-anchor="middle">R 1:${sc} · ${esc(s.msp.id)} · stanje na dan ${fmtD(today())}</text>
  <g transform="translate(12 13) rotate(${f2(tn)})"><path d="M0 -7L-1.7 -2H1.7Z" fill="${ink}"/><line x1="0" y1="-3" x2="0" y2="7" stroke="${ink}" stroke-width="0.35"/></g><text class="sk-s" x="14.5" y="8" style="font-weight:700">N</text>`;
  const step=k>=1?20:(k>=0.5?50:100),E0=s.nt.Y+b.x0,N0=s.nt.X+b.y0;
  for(let e=Math.ceil(E0/step)*step;e<=s.nt.Y+b.x1;e+=step){const x=X(e-s.nt.Y);g+=`<line x1="${f2(x)}" y1="${f2(top+mapH+0.5)}" x2="${f2(x)}" y2="${f2(top+mapH+2.2)}" stroke="${ink}" stroke-width="0.2"/><text class="sk-c" x="${f2(x)}" y="${f2(top+mapH+5)}" text-anchor="middle">${gkn(e).split(',')[0]}</text>`;}
  for(let n=Math.ceil(N0/step)*step;n<=s.nt.X+b.y1;n+=step){const y=Y(n-s.nt.X);g+=`<line x1="${L-2.2}" y1="${f2(y)}" x2="${L-0.5}" y2="${f2(y)}" stroke="${ink}" stroke-width="0.2"/><text class="sk-c" x="${L-2.8}" y="${f2(y+0.7)}" text-anchor="end">${gkn(n).split(',')[0]}</text>`;}
  s.boxes.forEach(bx=>{const d=boxRings(bx).map(pth).join('');if(bx.excl)g+=`<path d="${d}" fill="url(#skX)" fill-rule="evenodd"/>`;else{if(bx.done.SCH)g+=`<path d="${d}" fill="url(#skS)" fill-rule="evenodd"/>`;if(bx.done.CEIA)g+=`<path d="${d}" fill="url(#skC)" fill-rule="evenodd"/>`;}
    g+=`<path d="${d}" fill="none" stroke="#4a5b66" stroke-width="${bx.excl?0.2:0.1}"/>`;});
  s.boxes.forEach(bx=>{if(bx.w*k<6||bx.h*k<4.5)return;const c=P([bx.cx,bx.cy]);g+=`<text class="sk-b" x="${f2(c[0])}" y="${f2(c[1]+(bx.excl?-0.2:0.55))}" text-anchor="middle">${esc(bx.id)}</text>`;

/* ---------- import: CSV/TXT, GeoJSON, KML → turning points (E N, UTM 34N) and features ---------- */
function looksUtm(e,n){return e>=1e5&&e<=1e6&&n>=4e6&&n<=6e6;}
// x,y as GeoJSON/KML write them: lon,lat (WGS84) or E,N (already projected)
function impXY(x,y){if(!isFinite(x)||!isFinite(y))return null;if(Math.abs(x)<=180&&Math.abs(y)<=90){const u=wgsToUtm34(y,x);return [u.E,u.N];}if(looksUtm(x,y))return [x,y];if(looksUtm(y,x))return [y,x];return null;}
function impKind(t){t=String(t||'').toLowerCase();if(!t)return '';
  return /prug|rail|želez|zelez/.test(t)?'pruga':/dalekov|power ?line|\bkv\b/.test(t)?'dalekovod':/kanal|canal|ditch/.test(t)?'kanal':/potok|stream|creek|reka|river/.test(t)?'potok':
    /reper|benchmark|poligonsk/.test(t)?'reper':/\bstub|\bpole\b|bandera/.test(t)?'stub':/\bput\b|\bputa\b|road|cesta|ulica/.test(t)?'put':'';}
const numTok=t=>/^[-+]?\d+(?:[.,]\d+)?$/.test(t);
function splitCoordLine(l){let t;
  if(/[;\t]/.test(l))t=l.split(/[;\t]/);
  else if(l.includes(',')){const ws=l.split(/\s+/);t=ws.length>=2&&ws.filter(x=>/^[-+]?\d+(,\d+)?$/.test(x)).length>=2&&!/,\s/.test(l)?ws:l.split(',');}
  else t=l.split(/\s+/);
  return t.map(x=>{x=x.trim().replace(/^["']|["']$/g,'').trim();return /^[-+]?\d{1,3}(\s\d{3})+([.,]\d+)?$/.test(x)?x.replace(/\s/g,''):x;});}
function pairOf(nums){
  for(let i=0;i+1<nums.length;i++){const a=nums[i],b=nums[i+1];if(looksUtm(a,b))return [a,b];if(looksUtm(b,a))return [b,a];}
  for(let i=0;i+1<nums.length;i++){const a=nums[i],b=nums[i+1];
    if(a>=35&&a<=60&&b>=10&&b<35){const u=wgsToUtm34(a,b);return [u.E,u.N];}
    if(b>=35&&b<=60&&a>=10&&a<35){const u=wgsToUtm34(b,a);return [u.E,u.N];}}
  return null;}
function parseCSV(txt){const out={tp:[],feats:[],warn:[],fmt:'CSV/TXT'};
  const lines=txt.replace(/^﻿/,'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^(#|\/\/)/.test(l));
  if(!lines.length)throw new Error('Fajl je prazan.');
  let cols=null;const h0=splitCoordLine(lines[0]);
  if(h0.filter(numTok).length<2){const lc=h0.map(x=>x.toLowerCase()),f=re=>lc.findIndex(x=>re.test(x));
    cols={lat:f(/^(lat|latitude|širina|sirina)/),lon:f(/^(lon|lng|long|longitude|dužina|duzina)/),e:f(/^(e|east|easting|istok|y|utm_?e|utm34_?e|e_?utm)$/),n:f(/^(n|north|northing|sever|x|utm_?n|utm34_?n|n_?utm)$/),
      name:f(/^(name|naziv|id|tačka|tacka|oznaka|br|broj|pt|point|ime)$/),kind:f(/^(vrsta|tip|type|kind|objekat)$/)};lines.shift();}
  let bad=0;
  lines.forEach(l=>{const t=splitCoordLine(l);let pt=null,name='',kind='';
    if(cols){const g=j=>j>=0&&t[j]!=null?parseNum(t[j]):NaN;
      if(cols.lat>=0&&cols.lon>=0){const la=g(cols.lat),lo=g(cols.lon);if(isFinite(la)&&isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180){const u=wgsToUtm34(la,lo);pt=[u.E,u.N];}}
      else if(cols.e>=0&&cols.n>=0){const a=g(cols.e),b=g(cols.n);pt=looksUtm(a,b)?[a,b]:looksUtm(b,a)?[b,a]:null;}
      if(cols.name>=0)name=t[cols.name]||'';if(cols.kind>=0)kind=t[cols.kind]||'';}
    if(!pt){pt=pairOf(t.filter(numTok).map(parseNum));
      if(!pt&&!/[;\t,]/.test(l))pt=pairOf(l.replace(/(\d)\s+(?=\d{3}(\D|$))/g,'$1').split(/\s+/).filter(numTok).map(parseNum));
      if(!name)name=t.find(x=>x&&!numTok(x))||'';}
    if(!pt){bad++;return;}
    const k=impKind(kind)||impKind(name);
    if(k&&!FK[k].lin)out.feats.push({kind:k,name,pts:[pt]});else out.tp.push(pt);});
  if(bad)out.warn.push(bad+' red(ova) bez ispravnih koordinata je preskočeno.');
  return out;}
function parseGeoJSON(txt){let o;try{o=JSON.parse(txt);}catch(e){throw new Error('GeoJSON nije ispravan JSON.');}
  if(!o||typeof o!=='object'||!o.type)throw new Error('Ovo nije GeoJSON (nema polja "type").');
  const prims=[],walk=(g,pr)=>{if(!g||typeof g!=='object')return;const t=g.type,c=g.coordinates;

// same approach as the backup file: share sheet on phones, otherwise a normal download; inside an embedded viewer neither works
async function saveFile(name,text,mime){const blob=new Blob([text],{type:mime});

    if(navigator.canShare({files:[file]}))try{await navigator.share({files:[file],title:name});return true;}catch(e){if(e.name==='AbortError')return false;}}
  if(inFrame){toast('Preuzimanje fajla nije dozvoljeno u ovom prikazu. Koristi „Kopiraj” ili otvori aplikaciju preko linka.',5000);return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true;}
