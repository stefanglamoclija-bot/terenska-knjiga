setInterval(tick,1000);

/* ================= nav ================= */
const RENDER={danas:renderDanas,mapa:renderMapa,nalaz:renderNalaz,izvjestaji:renderIzvjestaji,hitno:renderHitno};
function go(t){if(!S)return;syncPack();if(tab==='nalaz'&&t!=='nalaz'){photoData=null;photoTok++;}tab=t;if(t!=='izvjestaji')docView=null;
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-'+t);
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  RENDER[t]();renderHeader();$('#main').scrollTop=0;try{localStorage.setItem(KEY+'-tab',t);}catch(e){}}
function rerender(){if(!S)return;syncPack();if(tab!=='nalaz')RENDER[tab]();renderHeader();}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(e.target.id==='scrim')closeSheet();return;}
  const a=el.dataset.act;if(!S&&!['recRetry','recRaw','restoreOk','close','swUpdate'].includes(a))return;const s=S?site():null;
  switch(a){
    case 'tab':closeSheet();go(el.dataset.tab);break;
    case 'close':closeSheet();break;
    case 'sites':openSites();break;
    case 'pickSite':if(!S.sites.some(x=>x.id===el.dataset.id))break;S.active=el.dataset.id;docView=null;docDay=null;mergeSel=null;selBox=null;selLane=null;save();closeSheet();go(tab==='nalaz'?'danas':tab);break;
    case 'newSite':openNewSite();break;
    case 'openSite':openSiteWork();break;
    case 'lane':openLane(+el.dataset.l);break;
    case 'box':openBoxB(el.dataset.id);break;
    case 'markM':{const who=$('#mWho').value;markBox(s,el.dataset.id,el.dataset.m,who);openBoxB(el.dataset.id);renderHeader();toast('Boks '+el.dataset.id+': '+P.methods[el.dataset.m]+' završen ('+who+').');break;}
    case 'unmarkM':{const bx=boxById(s,el.dataset.id);delete bx.done[el.dataset.m];logAdd(s,{t:hm(Date.now()),e:'Boks '+bx.id+': poništen pregled '+P.methods[el.dataset.m]});save();openBoxB(bx.id);break;}
    case 'boxDone':{const a=s.assign.find(x=>x.who===el.dataset.w);if(a){const id=a.box;markBox(s,id,a.m,a.who);renderDanasB();renderHeader();const n=s.assign.find(x=>x.who===el.dataset.w);toast('Boks '+id+' gotov.'+(n?' Sledeći za '+a.who+': '+n.box+'.':''));}break;}
    case 'findBox':{prefill={box:el.dataset.id};closeSheet();go('nalaz');break;}
    case 'adv':{const l=+el.dataset.l,m=parseFloat(el.dataset.m),L=laneLen(s,l),from=laneDone(s,l),to=Math.min(L,+(from+m).toFixed(2));if(to>from){s.progress.push({day:today(),lane:l,from,to});s.lanes[l]=to;addQ('Napredovanje staza '+l);save();}openLane(l);renderHeader();toast('Staza '+l+': očišćeno do '+num(to,1)+' m.');break;}
    case 'moveA':{const l=+el.dataset.l;let p=el.dataset.p!=null?s.pairs.find(x=>x.id===el.dataset.p):null;
      // no pair named: the pair whose lane is finished, else the nearest one that may legally move
      if(!p){const ok=s.pairs.filter(x=>pairCanMove(s,x,l)&&x.lane!==l);p=ok.find(x=>laneDone(s,x.lane)>=laneLen(s,x.lane)-0.01)||ok.sort((a,b)=>Math.abs(a.lane-l)-Math.abs(b.lane-l))[0];}
      if(!p){toast('Nijedan dvojac ne može u stazu '+l+': bila bi bliže od '+R.pairGap+' m drugom dvojcu.',4500);break;}
      if(!pairCanMove(s,p,l)){toast('Dvojac '+p.id+' u stazi '+l+' bio bi bliže od '+R.pairGap+' m drugom dvojcu. Izaberi drugu stazu.',4500);break;}
      const from=p.lane;p.lane=l;logAdd(s,{e:'Dvojac '+p.id+' premješten iz staze '+from+' u stazu '+l});save();openLane(l);toast('Dvojac '+p.id+' je sada u stazi '+l+'.');break;}
    case 'findHere':{prefill={lane:+el.dataset.l,dist:laneDone(s,+el.dataset.l)};closeSheet();go('nalaz');break;}
    case 'shift':{const p=s.pairs.find(x=>x.id===el.dataset.p);const st=pairState(p);p.inA=!p.inA;p.shift=Date.now();logAdd(s,{t:hm(Date.now()),e:'Smjena u stazi '+p.lane+': '+st.support+' ulazi, '+st.inLane+' podrška na '+R.pairGap+' m'});save();renderDanas();break;}
    case 'ev':openEvent(el.dataset.k);break;
    case 'evSave':saveEvent(el.dataset.k);break;
    case 'brief':{const di=dayInfo(s);di.brief[+el.dataset.i]=el.checked;if(briefItems(s).every((x,i)=>di.brief[i]))di.at=hm(Date.now());save();renderDanas();break;}
    case 'start':{const di=dayInfo(s);if(!briefItems(s).every((x,i)=>di.brief[i]))break;di.started=true;logAdd(s,{e:'Brifing završen; početak rada'});save();renderDanas();break;}
    case 'crs':S.crs=el.value;save();break;
    case 'p11w':p11Cur=el.value==='1';renderDoc(docView);break;
    case 'doc':if(docView!==el.dataset.k)docDay=null;docView=el.dataset.k;if(tab!=='izvjestaji'){tab='izvjestaji';document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-izvjestaji');document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab==='izvjestaji')b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}renderDoc(docView);$('#main').scrollTop=0;break;
    case 'docBack':docView=null;renderIzvjestaji();break;
    case 'print':try{window.print();}catch(err){}break;
    case 'copyDoc':copy($('#docEl').innerText,'Izvještaj');break;
    case 'copyCsv':copy(csvText(),'CSV');break;
    case 'copyGeo':copy(geoText(),'GeoJSON');break;
    case 'copyNum':copy(el.dataset.v,'Broj');break;
    case 'gpsCmp':gpsCompare();break;
    case 'incStart':{if(S.incident)break;const t0=Date.now();S.incident={site:s.id,t0,day:today(),start:hm(t0),where:'',lane:null,dist:null,box:null,pu:null,pv:null,steps:P.steps.map(()=>null),v:{ad:0,ch:0,lt:0,hv:0,k:0},cat:'',desc:''};
      logAdd(s,{t:S.incident.start,e:'NESREĆA prijavljena; rad zaustavljen',k:'inc'});addQ('NESREĆA prijavljena');save();renderHitno();renderHeader();break;}
    case 'incWhere':openIncidentPlace();break;
    case 'incPlace':saveIncidentPlace();break;
    case 'step':S.incident.steps[+el.dataset.i]=el.checked?hm(Date.now()):null;save();renderHitno();{const f=$('#step'+el.dataset.i);if(f)f.focus();}break;
    case 'incEnd':{const i=S.incident;if(!i)break;const is=S.sites.find(x=>x.id===i.site)||s;(is.incidents=is.incidents||[]).push(Object.assign({},i,{end:hm(Date.now()),endDay:today()}));S.incident=null;logAdd(is,{e:'Incident zatvoren',k:'inc'});save();renderHitno();toast('Incident zatvoren i sačuvan uz radilište '+is.msp.id+'.');break;}
    case 'sync':openSync();break;
    case 'reset':openReset(1);break;
    case 'reset2':openReset(2);break;
    case 'resetGo':resetDemo();break;
    case 'recRetry':closeSheet();boot();break;
    case 'recRaw':if(recRaw)saveFile('terenska-knjiga-neispravni-podaci-'+today()+'.json',JSON.stringify(recRaw),'application/json').then(ok=>{if(ok)toast('Fajl sa podacima je spreman. Sačuvaj ga i pošalji podršci.',5000);});break;
    case 'backup':if(el.disabled)break;el.disabled=true;exportBackup().catch(()=>toast('Kopija nije napravljena. Pokušaj ponovo.')).finally(()=>{el.disabled=false;});break;
    case 'restoreOk':restoreBackup();break;
    case 'swUpdate':if(updReg&&updReg.waiting){swAsked=true;updReg.waiting.postMessage({type:'skip'});$('#updBar').hidden=true;}break;
  }
});
document.addEventListener('input',e=>{const t=e.target;if(!S||!S.incident)return;if(t.dataset.v){S.incident.v[t.dataset.v]=Math.max(0,+t.value||0);save();}if(t.dataset.ic){S.incident[t.dataset.ic]=t.value;save();}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='rsFile'&&t.files&&t.files[0]){onRestoreFile(t.files[0]);t.value='';return;}if(!S)return;if(t.id==='docDay'){docDay=t.value===today()?null:t.value;if(docView)renderDoc(docView);return;}if(S.incident&&t.dataset.ic==='cat'){S.incident.cat=t.value;save();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)closeSheet();});

let start='danas';try{const t=localStorage.getItem(KEY+'-tab');if(t&&RENDER[t])start=t;}catch(e){}
const hash=(location.hash||'').slice(1);if(RENDER[hash])start=hash;
// start-up never shows demo data in place of field data and never leaves a blank page: any failure goes to the recovery screen
let recRaw=null;
function showRecovery(err){recRaw=err&&err.raw||null;S=null;closeSheet();
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='v-rec');const t=document.querySelector('.tabs');if(t)t.hidden=true;$('#syncBtn').hidden=true;$('#saveWarn').hidden=true;
  $('#hdrSite').textContent='Terenska knjiga';$('#hdrMeta').textContent='Oporavak podataka';
  $('#v-rec').innerHTML=`<div class="card" role="alert"><div class="label">Podaci</div><h2>Podaci se trenutno ne mogu otvoriti</h2><p>${esc(err&&err.message||String(err))}</p>
    <p class="sub">Ništa nije obrisano i demo podaci se ne učitavaju preko tvojih. Pokušaj ponovo; ako ne uspije, zatvori i ponovo otvori preglednik ili telefon, ili vrati podatke iz rezervne kopije.</p>
    <div class="btnrow"><button class="btn primary" type="button" data-act="recRetry">Pokušaj ponovo</button><label class="btn" for="rsFile">Vrati iz rezervne kopije<input id="rsFile" type="file" accept="application/json,.json" style="position:absolute;opacity:0;width:1px;height:1px"></label>${recRaw?'<button class="btn" type="button" data-act="recRaw">Sačuvaj neispravne podatke kao fajl</button>':''}</div></div>`;}
function leaveRecovery(){const t=document.querySelector('.tabs');if(t)t.hidden=false;$('#syncBtn').hidden=false;$('#v-rec').hidden=true;$('#v-rec').innerHTML='';recRaw=null;}
async function boot(){Object.assign(ST,{db:null,mode:'mem',failed:false,fallback:false,why:''});let st;
  try{st=await loadState();}catch(e){showRecovery(e);return;}
  S=st;try{leaveRecovery();go(start);}catch(e){const raw=snapshot();showRecovery(new LoadError('Podaci su učitani, ali se ne mogu prikazati ('+(e&&e.message||e)+').',raw));return;}
  curDay=today();renderSaveWarn();requestPersist();}
boot();
/* ---------- installed app: service worker, and "new version" instead of silently running old code ---------- */
let updReg=null,swAsked=false;
function swInit(){try{if(inFrame||!('serviceWorker' in navigator)||!document.querySelector('link[rel="manifest"]'))return;
  navigator.serviceWorker.register('sw.js').then(reg=>{const show=()=>{if(reg.waiting&&navigator.serviceWorker.controller){updReg=reg;const el=$('#updBar');el.hidden=false;
      el.innerHTML='<span>Nova verzija aplikacije je spremna. Podaci ostaju.</span><button class="btn sm" type="button" data-act="swUpdate">Osvježi</button>';}};
    show();reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')show();});});
    setInterval(()=>{reg.update().catch(()=>{});},36e5);}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(swAsked)location.reload();});}catch(e){}}
addEventListener('load',swInit);
['online','offline'].forEach(ev=>addEventListener(ev,()=>{if(S)renderHeader();}));
})();
</script>
