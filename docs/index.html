<!doctype html>
<html lang="sr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Terenska knjiga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first field app. Sticky status header, one scrolling view, tab bar at the bottom.
   High contrast for sunlight, large targets for gloved hands. Red is reserved for hazard. */
:root{
  --bg:#E8EBE3; --surface:#F7F8F4; --surface-2:#FFFFFF; --ink:#1A1F19; --muted:#59625A; --line:#CBD1C4;
  --accent:#1F3D35; --on-accent:#F3F7F2;
  --hazard:#BF2A1C; --on-hazard:#FFFFFF; --haz-soft:#F1D5CE;
  --cleared:#2B784A; --clr-soft:#C8E2D0;
  --work:#A86F0B; --work-soft:#F4DFAF;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F120F; --surface:#171B16; --surface-2:#1E231D; --ink:#E5E9E0; --muted:#97A190; --line:#2C3229;
    --accent:#A8D0C2; --on-accent:#0D1915;
    --hazard:#EC5B45; --on-hazard:#1B0805; --haz-soft:#3A1C17;
    --cleared:#5CBF85; --clr-soft:#1B3223;
    --work:#E7B142; --work-soft:#3A2E12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F120F; --surface:#171B16; --surface-2:#1E231D; --ink:#E5E9E0; --muted:#97A190; --line:#2C3229;
  --accent:#A8D0C2; --on-accent:#0D1915;
  --hazard:#EC5B45; --on-hazard:#1B0805; --haz-soft:#3A1C17;
  --cleared:#5CBF85; --clr-soft:#1B3223;
  --work:#E7B142; --work-soft:#3A2E12;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{font-size:13px;color:var(--muted)}

.app{position:relative;max-width:460px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;overflow:hidden}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.site-code{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.02em;line-height:1}
.site-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.sync{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:500;white-space:nowrap}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--work);flex:none}
.sync.ok .dot{background:var(--cleared)}
.sync.busy .dot{animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.25}}
.demo-flag{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}

main{flex:1;overflow-y:auto;padding:14px 14px 22px;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;letter-spacing:.01em}

.card{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}

/* today */
.big{font-family:var(--font-display);font-weight:700;font-size:54px;line-height:.95;font-variant-numeric:tabular-nums}
.big .unit{font-size:22px;margin-left:4px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--haz-soft);overflow:hidden;margin:12px 0 4px;position:relative}
.bar span{display:block;height:100%;background:var(--cleared);border-radius:5px;transition:width .4s}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 0}
.kv3 dt{font-size:11.5px;color:var(--muted)}
.kv3 dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}

.cycle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{background:var(--hazard);color:var(--on-hazard);border-color:var(--hazard)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13.5px}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.checks input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--cleared);flex:none}
.notice{font-size:13px;padding:9px 11px;border-radius:8px;background:var(--work-soft);margin:6px 0 10px}

.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--bg);color:var(--muted)}
.chip.work{background:var(--work-soft);color:var(--ink)}
.chip.ok{background:var(--clr-soft);color:var(--ink)}
.chip.haz{background:var(--haz-soft);color:var(--ink)}
.tri{width:18px;height:16px;flex:none}
.tri path{fill:var(--hazard)}

.demo-ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-top:4px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:6px}

/* map */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mapwrap{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px}
.mapwrap svg{display:block;width:100%;height:auto}
.bx{stroke:var(--surface-2);stroke-width:2;cursor:pointer}
.b-u{fill:var(--haz-soft)}
.b-c{fill:var(--clr-soft)}
.b-t{fill:var(--clr-soft);stroke:var(--cleared);stroke-width:2}
.b-p{fill:var(--work-soft);stroke:var(--work);stroke-width:2}
.bx.sel{stroke:var(--ink);stroke-width:2.5}
.bx:hover{filter:brightness(.96)}
.svgt{fill:var(--muted);font-family:var(--font-mono);font-size:9px}
.svgt.ink{fill:var(--ink)}
.svgt.lane{font-family:var(--font-display);font-weight:600;font-size:12px;fill:var(--ink)}
.svgt.who{font-size:8.5px;fill:var(--ink);pointer-events:none}
.bound{fill:none;stroke:var(--hazard);stroke-width:1.5;stroke-dasharray:6 4}
.base{fill:var(--clr-soft)}
.mk{fill:var(--hazard);pointer-events:none}
.poi{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.2}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lane-c{font-size:12px}
.lane-c b{font-family:var(--font-display);font-size:15px}
.mini{height:5px;border-radius:3px;background:var(--haz-soft);overflow:hidden;margin-top:3px}
.mini span{display:block;height:100%;background:var(--cleared)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,14,10,.38);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;background:var(--surface-2);border-top-left-radius:16px;border-top-right-radius:16px;padding:16px 16px 20px;border-top:1px solid var(--line);max-height:85%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

/* form */
form{display:flex;flex-direction:column;gap:14px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.flabel{font-size:13px;font-weight:600;margin-bottom:6px;padding:0;display:block}
.cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label span{display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--font-mono);font-size:13px;cursor:pointer}
.chips input:checked + span{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chips input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;min-width:0}
.field input,.field select,.field textarea{min-height:46px;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:400;font-size:15px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.gps{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--clr-soft);font-size:13px}
.gps .grow{flex:1;min-width:0}
.photo{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;cursor:pointer;background:var(--surface-2);font-size:14px;font-weight:500}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.photo img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.photo .ph{width:56px;height:56px;border-radius:6px;background:var(--bg);display:grid;place-items:center;flex:none}
.photo .ph svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:1.8}

/* report */
.report{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.report-h{border-bottom:2px solid var(--ink);padding-bottom:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
tfoot td{font-weight:600;border-bottom:0}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:12px;color:var(--muted);padding-top:16px}
.sign div{border-top:1px solid var(--ink);padding-top:4px}
.out{white-space:pre-wrap;font-family:var(--font-mono);font-size:11.5px;background:var(--bg);padding:10px;border-radius:8px;max-height:220px;overflow:auto;margin:0;user-select:all}
.chart text{font-family:var(--font-mono);font-size:10px;fill:var(--muted)}
.chart .v{fill:var(--ink)}
.chart .barr{fill:var(--cleared)}
.chart .today{fill:var(--accent)}
.chart .plan{stroke:var(--hazard);stroke-dasharray:4 3;stroke-width:1}
.chart .gl{stroke:var(--line);stroke-width:1}

/* emergency */
.sos{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:22px 16px;border-radius:12px;border:0;background:var(--hazard);color:var(--on-hazard)}
.sos b{font-family:var(--font-display);font-size:30px;letter-spacing:.04em;line-height:1}
.sos span{font-size:13.5px;opacity:.92}
.inc{background:var(--hazard);color:var(--on-hazard);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.inc .timer{color:var(--on-hazard)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.steps input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--hazard);flex:none}
.steps .t{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.nine{list-style:none;margin:0;padding:0}
.nine li{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.nine li:first-child{border-top:0}
.nine .n{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1;color:var(--hazard)}
.nine .q{font-size:12px;color:var(--muted)}
.nine .a{font-weight:500;overflow-wrap:anywhere}
.nine input{width:52px;min-height:36px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:center}
.contact{display:flex;align-items:center;gap:10px}
.contact .grow{flex:1;min-width:0}
.contact .num{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1}
.dist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.dist div{background:var(--bg);border-radius:8px;padding:10px}
.dist b{display:block;font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface-2);padding:4px 4px 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:6px 2px;font-size:11.5px;font-weight:500;color:var(--muted);border-radius:8px;min-height:54px;justify-content:center}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tab[aria-current="page"]{color:var(--ink);background:var(--bg)}
.tab.add svg{stroke:var(--hazard)}
.tab.sos-t{color:var(--hazard)}

.toast{position:absolute;left:14px;right:14px;bottom:76px;z-index:9;background:var(--ink);color:var(--surface-2);padding:12px 14px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.2)}

@media (max-width:480px){
  body{padding-block:0;padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
  .app{border-radius:0;border-left:0;border-right:0;max-width:none}
  main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .top{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div>
      <div class="site-code">SHA-0147 <span class="demo-flag">DEMO</span></div>
      <div class="site-meta" id="hdrMeta">Kamenica · Tim Alfa</div>
    </div>
    <button class="sync" id="syncBtn" data-act="sync" type="button"><span class="dot"></span><span id="syncLabel">…</span></button>
  </header>

  <main id="main">
    <section class="view" id="v-danas"></section>
    <section class="view" id="v-mapa" hidden></section>
    <section class="view" id="v-nalaz" hidden>
      <div>
        <div class="label">Novi nalaz</div>
        <h2>Zapiši sredstvo</h2>
      </div>
      <form id="findForm" autocomplete="off">
        <fieldset>
          <legend>Vrsta sredstva</legend>
          <div id="typeChips"></div>
        </fieldset>
        <div class="grid2">
          <label class="field">Staza<select id="fLane"></select></label>
          <label class="field">Boks<select id="fRow"></select></label>
        </div>
        <div class="gps">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
          <div class="grow"><div class="mono" id="fGps">—</div><div class="sub">GPS ±3 m · u demu je položaj simuliran</div></div>
          <button class="btn sm" type="button" data-act="regps">Osveži</button>
        </div>
        <div class="grid2">
          <label class="field">Količina<input id="fQty" type="number" min="1" max="50" value="1" inputmode="numeric"></label>
          <label class="field">Dubina (cm)<input id="fDepth" type="number" min="0" max="200" value="8" inputmode="numeric"></label>
        </div>
        <fieldset>
          <legend>Stanje</legend>
          <div class="chips" id="condChips"></div>
        </fieldset>
        <label class="field">Postupak<select id="fAction"></select></label>
        <div>
          <span class="flabel">Fotografija</span>
          <label class="photo" for="fPhoto">
            <input id="fPhoto" type="file" accept="image/*" capture="environment">
            <span class="ph" id="fPh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
            <img id="fPrev" alt="Pregled fotografije nalaza" hidden>
            <span id="fPhotoTxt">Fotografiši sredstvo na licu mesta</span>
          </label>
        </div>
        <label class="field">Napomena<textarea id="fNote" placeholder="npr. upaljač vidljiv, korozija na telu"></textarea></label>
        <button class="btn primary block" type="submit">Sačuvaj nalaz</button>
      </form>
    </section>
    <section class="view" id="v-izvestaj" hidden></section>
    <section class="view" id="v-hitno" hidden></section>
  </main>

  <nav class="tabs" aria-label="Glavni meni">
    <button class="tab" type="button" data-act="tab" data-tab="danas"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="1.5"/><path d="M9 3h6v3H9zM8.5 11h7M8.5 15h5"/></svg>Danas</button>
    <button class="tab" type="button" data-act="tab" data-tab="mapa"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="1"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 12h17"/></svg>Radilište</button>
    <button class="tab add" type="button" data-act="tab" data-tab="nalaz"><svg viewBox="0 0 24 24"><path d="M12 3.5 21.5 20h-19z"/><path d="M12 10v5.5M9.2 12.8h5.6"/></svg>Nalaz</button>
    <button class="tab" type="button" data-act="tab" data-tab="izvestaj"><svg viewBox="0 0 24 24"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5M9 12.5h7M9 16h7"/></svg>Izveštaj</button>
    <button class="tab sos-t" type="button" data-act="tab" data-tab="hitno"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M7.5 12h9"/></svg>Hitno</button>
  </nav>

  <div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(function(){
const LANES=8, ROWS=20, BOX_M2=200, TOTAL_M2=LANES*ROWS*BOX_M2, PLAN_DAY=600, CYCLE=40*60e3;
const ORIGIN={lat:44.95120, lon:19.10430};
const DLAT=20/111320, DLON=10/(111320*Math.cos(ORIGIN.lat*Math.PI/180));
const KEY='terenska-knjiga-demo-v1';

const TYPES=[
  {id:'PMA-1',cat:'Protivpešadijske mine',k:'apb'},
  {id:'PMA-2',cat:'Protivpešadijske mine',k:'apb'},
  {id:'PMA-3',cat:'Protivpešadijske mine',k:'apb'},
  {id:'PROM-1',cat:'Protivpešadijske mine',k:'apf'},
  {id:'PMR-2A',cat:'Protivpešadijske mine',k:'apf'},
  {id:'TMA-3',cat:'Protivoklopne mine',k:'at'},
  {id:'TMA-4',cat:'Protivoklopne mine',k:'at'},
  {id:'TMM-1',cat:'Protivoklopne mine',k:'at'},
  {id:'RB M75',cat:'Neeksplodirana ubojna sredstva',k:'gr'},
  {id:'MB 60 mm',cat:'Neeksplodirana ubojna sredstva',k:'mb'},
  {id:'MB 82 mm',cat:'Neeksplodirana ubojna sredstva',k:'mb'},
  {id:'MB 120 mm',cat:'Neeksplodirana ubojna sredstva',k:'mbl'},
  {id:'Nepoznato',cat:'Neeksplodirana ubojna sredstva',k:'unk'}
];
const SAFE={
  apb:{name:'PP mina, fugasna',space:25,demo:300},
  apf:{name:'PP mina, rasprskavajuća',space:50,demo:500},
  at:{name:'PO mina',space:50,demo:600},
  gr:{name:'Ručna bomba',space:25,demo:300},
  mb:{name:'Mina za minobacač 60–82 mm',space:50,demo:600},
  mbl:{name:'Mina za minobacač 120 mm',space:50,demo:1000},
  unk:{name:'Nepoznato sredstvo',space:50,demo:1000}
};
const CONDS=['Netaknuto','Korodirano','Oštećeno'];
const ACTIONS=['Označeno, čeka uništenje','Uništeno na licu mesta','Predato EOD timu'];
const TEAM=[
  {id:'D-01',n:'M. Petrović'},{id:'D-02',n:'S. Ilić'},{id:'D-03',n:'N. Đorđević'},
  {id:'D-04',n:'J. Marković'},{id:'D-05',n:'V. Stojanović'},{id:'D-06',n:'A. Kovačević'}
];
const PAIRS=[{lane:2,a:'D-01',b:'D-04'},{lane:3,a:'D-02',b:'D-05'},{lane:5,a:'D-03',b:'D-06'}];
const BRIEF=[
  'Medicinar i sanitetsko vozilo na lokaciji, motor okrenut ka izlazu',
  'Radio veza proverena sa bazom (kanal 3)',
  'Detektori provereni na test komadu',
  'Granice radilišta i bezbedne staze obeležene',
  'Plan evakuacije i MEDEVAC ruta pročitani timu',
  'Lična zaštitna oprema (vizir, prsluk) pregledana'
];
const STEPS=[
  'Zaustavi rad na svim stazama, javi bazi preko radija',
  'Medicinar prilazi samo očišćenom stazom',
  'Prva pomoć: zaustavi krvarenje, stabilizuj povređenog',
  'Pošalji MEDEVAC 9 linija',
  'Potvrdi dolazak vozila ili helikoptera',
  'Obezbedi mesto nesreće za istragu'
];

const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['nedelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'];
const DAYS_S=['ned','pon','uto','sre','čet','pet','sub'];
const MONTHS=['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];
const TODAY=dayKey(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d;};
const boxId=(l,r)=>'L'+l+'-B'+pad(r);
const ll=(l,r,jx,jy)=>({lat:ORIGIN.lat+(r-1+(jy==null?.5:jy))*DLAT, lon:ORIGIN.lon+(l-1+(jx==null?.5:jx))*DLON});
const fmtLL=p=>p.lat.toFixed(5)+'° N, '+p.lon.toFixed(5)+'° E';
const longDate=d=>DAYS[d.getDay()]+', '+d.getDate()+'. '+MONTHS[d.getMonth()]+' '+d.getFullYear()+'.';
const typeOf=id=>TYPES.find(t=>t.id===id)||TYPES[TYPES.length-1];
const atToday=(h,m)=>{const d=new Date();d.setHours(h,m,0,0);return d.getTime();};

function seed(){
  const boxes={};
  const depth=[14,13,12,12,11,10,10,8];
  const old=dayKey(daysAgo(1));
  for(let l=1;l<=LANES;l++) for(let r=1;r<=depth[l-1];r++) boxes[l+'-'+r]=old;
  boxes['1-14']=TODAY; boxes['4-12']=TODAY;
  const mk=(n,type,l,r,day,time,depth,cond,action,synced,note)=>{
    const p=ll(l,r,.3+Math.random()*.4,.3+Math.random()*.4);
    return {id:'N-'+pad(n).padStart(3,'0'),type,l,r,day,time,depth,qty:1,cond,action,lat:p.lat,lon:p.lon,synced,note:note||'',photo:null};
  };
  const d3=dayKey(daysAgo(3)), d2=dayKey(daysAgo(2)), d1=dayKey(daysAgo(1));
  return {
    boxes,
    finds:[
      mk(24,'PMA-2',1,5,d3,'08:52',6,'Korodirano',ACTIONS[1],true),
      mk(25,'PMA-2',1,9,d3,'11:15',9,'Netaknuto',ACTIONS[1],true),
      mk(26,'PROM-1',2,7,d3,'13:02',4,'Korodirano',ACTIONS[2],true,'Zatezna žica uklonjena pre prilaza'),
      mk(27,'TMA-3',4,3,d2,'09:40',18,'Netaknuto',ACTIONS[1],true),
      mk(28,'MB 82 mm',5,10,d2,'12:21',22,'Korodirano',ACTIONS[2],true),
      mk(29,'PMA-2',3,11,d1,'10:07',7,'Netaknuto',ACTIONS[1],true),
      mk(30,'PMA-2',6,4,d1,'14:30',5,'Oštećeno',ACTIONS[1],true),
      mk(31,'PROM-1',2,13,TODAY,'09:41',3,'Korodirano',ACTIONS[0],false,'Upaljač vidljiv, bez zatezne žice'),
      mk(32,'PMA-2',4,12,TODAY,'10:58',8,'Netaknuto',ACTIONS[0],false)
    ],
    queue:[
      {t:'Nalaz N-031 · PROM-1',at:'09:41'},
      {t:'Boks L1-B14 očišćen',at:'10:20'},
      {t:'Nalaz N-032 · PMA-2',at:'10:58'},
      {t:'Boks L4-B12 očišćen',at:'11:34'}
    ],
    lastSync:'06:58',
    brief:BRIEF.map(()=>true), briefAt:'07:12',
    dayStarted:true, startAt:'07:20',
    cycleStart:Date.now()-(13*60+20)*1000, shiftBase:0,
    incident:null, incidents:[],
    nextFind:33,
    nineCounts:{a:1,b:0,c:0,litter:1,amb:0}
  };
}

let S;
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.boxes&&s.finds)return s;}}catch(e){} return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
S=load();

const $=s=>document.querySelector(s);
let tab='danas', selBox=null;
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2600);}

function stats(){
  let cleared=0,today=0;
  for(const k in S.boxes){cleared++; if(S.boxes[k]===TODAY) today++;}
  return {cleared,today,clearedM2:cleared*BOX_M2,todayM2:today*BOX_M2,findsToday:S.finds.filter(f=>f.day===TODAY)};
}
function frontier(l){let r=1;while(r<=ROWS&&S.boxes[l+'-'+r])r++;return r<=ROWS?r:null;}
function activeSide(){return (S.shiftBase+Math.floor((Date.now()-S.cycleStart)/CYCLE))%2===0?'a':'b';}
function progressMap(){
  const m={}; if(!S.dayStarted) return m;
  const side=activeSide();
  PAIRS.forEach(p=>{const r=frontier(p.lane); if(r) m[p.lane+'-'+r]={who:p[side],pair:p[side==='a'?'b':'a']};});
  return m;
}
function addQueue(t){S.queue.push({t,at:hm(Date.now())});}

/* ---------- header ---------- */
function renderHeader(){
  $('#hdrMeta').textContent='Kamenica · Tim Alfa · '+DAYS_S[new Date().getDay()]+' '+new Date().getDate()+'. '+MONTHS[new Date().getMonth()].slice(0,3)+'.';
  const b=$('#syncBtn'); if(b.classList.contains('busy')) return;
  const n=S.queue.length;
  b.classList.toggle('ok',n===0);
  $('#syncLabel').textContent=n?('Bez mreže · '+n+' čeka'):('Poslato '+S.lastSync);
  b.setAttribute('aria-label',n?('Bez mreže, '+n+' zapisa čeka slanje. Dodirni za sinhronizaciju.'):('Sve poslato u '+S.lastSync));
}

/* ---------- today ---------- */
function renderDanas(){
  const st=stats(), pct=Math.min(100,st.todayM2/PLAN_DAY*100);
  const briefDone=S.brief.every(Boolean);
  const side=activeSide(), prog=progressMap();
  const laneOf={}; Object.keys(prog).forEach(k=>{laneOf[prog[k].who]=k.split('-')[0];});
  const recent=S.finds.slice().sort((a,b)=>(b.day+b.time).localeCompare(a.day+a.time)).slice(0,3);

  let h=`<div class="card">
    <div class="label">Očišćeno danas</div>
    <div class="big">${fmt(st.todayM2)}<span class="unit">m²</span></div>
    <div class="sub">plan ${fmt(PLAN_DAY)} m² · ${st.today} ${st.today===1?'boks':'boksa'} po ${BOX_M2} m²</div>
    <div class="bar" role="img" aria-label="${Math.round(pct)}% dnevnog plana"><span style="width:${pct}%"></span></div>
    <dl class="kv3">
      <div><dt>Radilište ukupno</dt><dd>${Math.round(st.clearedM2/TOTAL_M2*100)}% · ${fmt(st.clearedM2)} m²</dd></div>
      <div><dt>Nalazi danas</dt><dd>${st.findsToday.length}</dd></div>
      <div><dt>Staze u radu</dt><dd>${Object.keys(prog).length} od ${LANES}</dd></div>
    </dl>
  </div>`;

  if(S.dayStarted){
    h+=`<div class="card cycle">
      <div><div class="label">Rotacija u parovima · 40 min</div>
        <div class="timer" id="cycleTime">--:--</div>
        <div class="sub">do zamene u stazama</div></div>
      <button class="btn sm" type="button" data-act="rotate">Zameni sada</button>
    </div>`;
  }

  h+=`<div class="card">
    <div class="card-h"><h3>Brifing pre rada</h3><span class="chip ${briefDone?'ok':'work'}">${S.brief.filter(Boolean).length}/${BRIEF.length}${briefDone&&S.briefAt?' · '+S.briefAt:''}</span></div>
    ${!S.dayStarted?'<div class="notice">Rad ne može da počne dok sve stavke nisu potvrđene.</div>':''}
    <ul class="checks">${BRIEF.map((b,i)=>`<li><label><input type="checkbox" id="brief${i}" data-act="brief" data-i="${i}" ${S.brief[i]?'checked':''} ${S.dayStarted?'disabled':''}><span>${esc(b)}</span></label></li>`).join('')}</ul>
    ${!S.dayStarted?`<button class="btn primary block" type="button" data-act="start" ${briefDone?'':'disabled'}>Započni radni dan</button>`:`<div class="sub">Rad započet u ${esc(S.startAt)}</div>`}
  </div>`;

  h+=`<div class="card"><div class="card-h"><h3>Tim</h3><span class="sub">3 para · ${S.dayStarted?'smena '+(side==='a'?'A':'B')+' u stazama':'nije počelo'}</span></div>
    <ul class="rows">${TEAM.map(m=>{
      const lane=laneOf[m.id]; const pair=PAIRS.find(p=>p.a===m.id||p.b===m.id);
      return `<li><span class="mono">${m.id}</span><span class="grow">${esc(m.n)}<br><span class="sub">par u stazi L${pair.lane}</span></span>${lane?`<span class="chip work">U stazi L${lane}</span>`:`<span class="chip">${S.dayStarted?'Odmor':'Čeka'}</span>`}</li>`;
    }).join('')}</ul></div>`;

  h+=`<div class="card"><div class="card-h"><h3>Poslednji nalazi</h3><button class="linkbtn" type="button" data-act="tab" data-tab="izvestaj">Svi nalazi</button></div>
    <ul class="rows">${recent.map(findRow).join('')}</ul></div>`;

  h+=`<div class="demo-ctl"><button class="linkbtn" type="button" data-act="newday">Demo: započni novi dan</button><button class="linkbtn" type="button" data-act="reset">Vrati početne podatke</button></div>`;
  $('#v-danas').innerHTML=h;
  tick();
}
const TRI='<svg class="tri" viewBox="0 0 18 16" aria-hidden="true"><path d="M9 1 17 15H1z"/></svg>';
function findRow(f){
  return `<li>${TRI}<span class="grow"><b class="mono">${esc(f.type)}</b> <span class="sub">${f.id}</span><br><span class="sub">${boxId(f.l,f.r)} · ${f.depth} cm · ${f.day===TODAY?'danas':shortDay(f.day)} ${esc(f.time)}</span></span><span class="chip ${f.synced?'':'work'}">${f.synced?'poslato':'čeka slanje'}</span></li>`;
}
function shortDay(k){const [y,m,d]=k.split('-').map(Number);return d+'. '+m+'.';}

/* ---------- map ---------- */
const CW=36,CH=20,X0=34,Y0=24;
function renderMapa(){
  const prog=progressMap();
  const W=X0+LANES*CW+8, GH=ROWS*CH, BY=Y0+GH+8, H=BY+66;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Šema radilišta: ${LANES} staza po ${ROWS} boksova">`;
  for(let l=1;l<=LANES;l++) s+=`<text class="svgt lane" x="${X0+(l-1)*CW+CW/2-1}" y="14" text-anchor="middle">L${l}</text>`;
  for(const r of [1,5,10,15,20]) s+=`<text class="svgt" x="${X0-6}" y="${Y0+(ROWS-r)*CH+CH/2+2}" text-anchor="end">B${pad(r)}</text>`;
  for(let l=1;l<=LANES;l++) for(let r=1;r<=ROWS;r++){
    const k=l+'-'+r, x=X0+(l-1)*CW, y=Y0+(ROWS-r)*CH;
    let c='u'; if(S.boxes[k]) c=S.boxes[k]===TODAY?'t':'c'; else if(prog[k]) c='p';
    s+=`<rect class="bx b-${c}${selBox===k?' sel':''}" x="${x+1}" y="${y+1}" width="${CW-2}" height="${CH-2}" rx="2" data-act="box" data-k="${k}"><title>${boxId(l,r)}</title></rect>`;
    if(prog[k]) s+=`<text class="svgt who" x="${x+CW/2}" y="${y+CH/2+3}" text-anchor="middle">${prog[k].who}</text>`;
  }
  const by={}; S.finds.forEach(f=>{const k=f.l+'-'+f.r;(by[k]=by[k]||[]).push(f);});
  Object.keys(by).forEach(k=>{
    const [l,r]=k.split('-').map(Number); if(prog[k]) return;
    by[k].slice(0,3).forEach((f,i)=>{const cx=X0+(l-1)*CW+9+i*9, cy=Y0+(ROWS-r)*CH+CH/2;
      s+=`<path class="mk" d="M${cx} ${cy-5}L${cx+5} ${cy+4}H${cx-5}Z"/>`;});
  });
  s+=`<rect class="bound" x="${X0-2}" y="${Y0-2}" width="${LANES*CW+4}" height="${GH+4}" rx="3"/>`;
  s+=`<rect class="base" x="${X0}" y="${BY}" width="${LANES*CW}" height="24" rx="3"/>`;
  s+=`<text class="svgt ink" x="${X0+LANES*CW/2}" y="${BY+15}" text-anchor="middle">BAZNA LINIJA · BEZBEDNA ZONA</text>`;
  [[X0+30,'KT','kontrolna tačka'],[X0+LANES*CW/2,'MED','medicinar'],[X0+LANES*CW-30,'P','vozila']].forEach(([x,t,d])=>{
    s+=`<circle class="poi" cx="${x}" cy="${BY+42}" r="11"/><text class="svgt ink" x="${x}" y="${BY+45}" text-anchor="middle">${t}</text><text class="svgt" x="${x}" y="${BY+64}" text-anchor="middle">${d}</text>`;
  });
  s+='</svg>';

  const lanes=[];for(let l=1;l<=LANES;l++){let n=0;for(let r=1;r<=ROWS;r++) if(S.boxes[l+'-'+r]) n++; lanes.push(n);}
  $('#v-mapa').innerHTML=`
    <div><div class="label">Radilište · ${fmt(TOTAL_M2)} m²</div><h2>Staze i boksovi</h2></div>
    <div class="legend"><span><i style="background:var(--haz-soft)"></i>Sumnjivo</span><span><i style="background:var(--work-soft);outline:2px solid var(--work);outline-offset:-2px"></i>U radu</span><span><i style="background:var(--clr-soft);outline:2px solid var(--cleared);outline-offset:-2px"></i>Očišćeno danas</span><span><i style="background:var(--clr-soft)"></i>Očišćeno</span><span>${TRI.replace('class="tri"','class="tri" style="width:12px;height:11px;vertical-align:-1px;margin-right:5px"')}Nalaz</span></div>
    <div class="mapwrap">${s}</div>
    <div class="sub">Dodirni boks za detalje. Boks je 10 × 20 m, staze napreduju od bazne linije ka severu.</div>
    <div class="card"><div class="card-h"><h3>Napredak po stazama</h3><span class="sub">boksova očišćeno</span></div>
      <div class="lanes">${lanes.map((n,i)=>`<div class="lane-c"><b>L${i+1}</b> <span class="mono">${n}/${ROWS}</span><div class="mini"><span style="width:${n/ROWS*100}%"></span></div></div>`).join('')}</div>
    </div>`;
}

function openBox(k){
  selBox=k; renderMapa();
  const [l,r]=k.split('-').map(Number), prog=progressMap()[k];
  const st=S.boxes[k], finds=S.finds.filter(f=>f.l===l&&f.r===r);
  const status=st?(st===TODAY?'<span class="chip ok">Očišćeno danas</span>':'<span class="chip ok">Očišćeno '+shortDay(st)+'</span>'):(prog?'<span class="chip work">U radu</span>':'<span class="chip haz">Sumnjivo, nije pretraženo</span>');
  $('#sheet').innerHTML=`
    <div class="sheet-h"><div><div class="label">Staza L${l} · boks ${r}</div><h2 class="mono" style="font-family:var(--font-mono);font-size:24px">${boxId(l,r)}</h2></div><button class="x" type="button" data-act="closeSheet" aria-label="Zatvori">×</button></div>
    <dl class="kv">
      <dt>Status</dt><dd>${status}</dd>
      <dt>Površina</dt><dd>${BOX_M2} m² (10 × 20 m)</dd>
      <dt>Centar</dt><dd class="mono">${fmtLL(ll(l,r))}</dd>
      ${prog?`<dt>U stazi</dt><dd>${prog.who} (par ${prog.pair})</dd>`:''}
      <dt>Nalazi</dt><dd>${finds.length?finds.length:'nema'}</dd>
    </dl>
    ${finds.length?`<ul class="rows">${finds.map(findRow).join('')}</ul>`:''}
    <div class="btnrow">
      ${!st?`<button class="btn primary" type="button" data-act="clearBox" data-k="${k}">Označi kao očišćen</button>`:''}
      ${st===TODAY?`<button class="btn" type="button" data-act="unclearBox" data-k="${k}">Poništi čišćenje</button>`:''}
      <button class="btn" type="button" data-act="findHere" data-k="${k}">Dodaj nalaz ovde</button>
    </div>`;
  $('#scrim').hidden=false;
  const x=$('#sheet .x'); if(x) x.focus();
}
function closeSheet(){$('#scrim').hidden=true; if(selBox){selBox=null; if(tab==='mapa') renderMapa();}}

/* ---------- new find form ---------- */
let photoData=null, gps=null;
function initForm(){
  const cats=[...new Set(TYPES.map(t=>t.cat))];
  $('#typeChips').innerHTML=cats.map(c=>`<div class="cat">${c}</div><div class="chips">${TYPES.filter(t=>t.cat===c).map(t=>`<label><input type="radio" name="ftype" value="${t.id}" id="ft-${t.id.replace(/\W/g,'')}"><span>${t.id}</span></label>`).join('')}</div>`).join('');
  $('#condChips').innerHTML=CONDS.map((c,i)=>`<label><input type="radio" name="fcond" value="${c}" id="fc${i}" ${i===0?'checked':''}><span style="font-family:var(--font-body)">${c}</span></label>`).join('');
  $('#fAction').innerHTML=ACTIONS.map(a=>`<option>${a}</option>`).join('');
  $('#fLane').innerHTML=Array.from({length:LANES},(_,i)=>`<option value="${i+1}">L${i+1}</option>`).join('');
  $('#fRow').innerHTML=Array.from({length:ROWS},(_,i)=>`<option value="${i+1}">B${pad(i+1)}</option>`).join('');
  $('#fLane').addEventListener('change',newGps);
  $('#fRow').addEventListener('change',newGps);
  $('#fPhoto').addEventListener('change',onPhoto);
  $('#findForm').addEventListener('submit',onSubmit);
}
function prefillForm(k){
  let l,r;
  if(k){[l,r]=k.split('-').map(Number);}
  else{const p=Object.keys(progressMap())[0]; if(p){[l,r]=p.split('-').map(Number);} else {l=2;r=frontier(2)||1;}}
  $('#fLane').value=l; $('#fRow').value=r; newGps();
}
function newGps(){
  const l=+$('#fLane').value, r=+$('#fRow').value;
  gps=ll(l,r,.2+Math.random()*.6,.2+Math.random()*.6);
  $('#fGps').textContent=fmtLL(gps);
}
function onPhoto(e){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{
    const c=document.createElement('canvas'), m=200, sc=Math.min(1,m/Math.max(img.width,img.height));
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    photoData=c.toDataURL('image/jpeg',.7); URL.revokeObjectURL(url);
    $('#fPrev').src=photoData; $('#fPrev').hidden=false; $('#fPh').hidden=true;
    $('#fPhotoTxt').textContent='Fotografija dodata · dodirni za zamenu';
  };
  img.src=url;
}
function onSubmit(e){
  e.preventDefault();
  const t=document.querySelector('input[name="ftype"]:checked');
  if(!t){toast('Izaberi vrstu sredstva.'); $('#typeChips').scrollIntoView({behavior:'smooth',block:'start'}); return;}
  const l=+$('#fLane').value, r=+$('#fRow').value;
  const f={id:'N-'+String(S.nextFind).padStart(3,'0'),type:t.value,l,r,day:TODAY,time:hm(Date.now()),
    depth:Math.max(0,+$('#fDepth').value||0),qty:Math.max(1,+$('#fQty').value||1),
    cond:(document.querySelector('input[name="fcond"]:checked')||{}).value||CONDS[0],
    action:$('#fAction').value,lat:gps.lat,lon:gps.lon,synced:false,note:$('#fNote').value.trim(),photo:photoData};
  S.nextFind++; S.finds.push(f); addQueue('Nalaz '+f.id+' · '+f.type); save();
  $('#findForm').reset(); photoData=null; $('#fPrev').hidden=true; $('#fPh').hidden=false; $('#fPhotoTxt').textContent='Fotografiši sredstvo na licu mesta';

/* ---------- report ---------- */
function renderIzvestaj(){
  const st=stats(), d=new Date();
  const todayFinds=st.findsToday;
  const laneRows=[];
  for(let l=1;l<=LANES;l++){let t=0,all=0;for(let r=1;r<=ROWS;r++){const v=S.boxes[l+'-'+r];if(v){all++;if(v===TODAY)t++;}} if(t||PAIRS.some(p=>p.lane===l)) laneRows.push({l,t,all});}
  const incToday=S.incidents.filter(i=>i.day===TODAY);
  const week=[]; const seedV=[560,620,480,640,590,520];
  for(let i=6;i>=0;i--){const dd=daysAgo(i); const v=i===0?st.todayM2:(dd.getDay()===0?0:seedV[i-1]); week.push({d:dd,v,today:i===0});}
  const max=800, cw=320, chH=120, top=14, bw=26, gap=(cw-20)/7;
  const y=v=>top+chH-(v/max*chH);
  let chart=`<svg class="chart" viewBox="0 0 ${cw} ${top+chH+24}" role="img" aria-label="Očišćeno po danu, poslednjih 7 dana">`;
  [0,200,400,600,800].forEach(v=>{chart+=`<line class="gl" x1="20" x2="${cw}" y1="${y(v)}" y2="${y(v)}"/><text x="16" y="${y(v)+3}" text-anchor="end">${v}</text>`;});
  chart+=`<line class="plan" x1="20" x2="${cw}" y1="${y(PLAN_DAY)}" y2="${y(PLAN_DAY)}"/>`;
  week.forEach((w,i)=>{const x=20+i*gap+(gap-bw)/2;
    if(w.v>0) chart+=`<rect class="${w.today?'today':'barr'}" x="${x}" y="${y(w.v)}" width="${bw}" height="${top+chH-y(w.v)}" rx="2"/><text class="v" x="${x+bw/2}" y="${y(w.v)-4}" text-anchor="middle">${w.v}</text>`;
    else chart+=`<text x="${x+bw/2}" y="${top+chH-4}" text-anchor="middle">—</text>`;
    chart+=`<text x="${x+bw/2}" y="${top+chH+16}" text-anchor="middle">${w.today?'danas':DAYS_S[w.d.getDay()]}</text>`;});
  chart+='</svg>';

  $('#v-izvestaj').innerHTML=`
    <article class="report" id="reportDoc">
      <div class="report-h"><div class="label">Dnevni izveštaj o radu</div><h2>SHA-0147 · Kamenica</h2><div class="sub">${longDate(d)}</div></div>
      <dl class="kv">
        <dt>Organizacija</dt><dd>Primer d.o.o. (demo)</dd>
        <dt>Vođa tima</dt><dd>R. Nikolić · Tim Alfa</dd>
        <dt>Deminera</dt><dd>6 (3 para), medicinar, vozač</dd>
        <dt>Brifing</dt><dd>${S.brief.every(Boolean)?'završen '+esc(S.briefAt||''):'nije završen'}</dd>
        <dt>Početak rada</dt><dd>${S.dayStarted?esc(S.startAt):'—'}</dd>
        <dt>Metoda</dt><dd>Ručno čišćenje, detektor + sonda</dd>
      </dl>
      <div><h3>Očišćena površina</h3>
        <div class="tbl"><table><thead><tr><th>Staza</th><th class="num">Danas</th><th class="num">m² danas</th><th class="num">Ukupno</th></tr></thead>
        <tbody>${laneRows.map(r=>`<tr><td class="mono">L${r.l}</td><td class="num">${r.t}</td><td class="num">${fmt(r.t*BOX_M2)}</td><td class="num">${r.all}/${ROWS}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>Ukupno</td><td class="num">${st.today}</td><td class="num">${fmt(st.todayM2)}</td><td class="num">${fmt(st.clearedM2)} m²</td></tr></tfoot></table></div></div>
      <div><h3>Nalazi danas (${todayFinds.length})</h3>
        ${todayFinds.length?`<div class="tbl"><table><thead><tr><th>ID</th><th>Vrsta</th><th>Boks</th><th class="num">Dub.</th><th>Postupak</th></tr></thead>
        <tbody>${todayFinds.map(f=>`<tr><td class="mono">${f.id}</td><td>${esc(f.type)}${f.qty>1?' ×'+f.qty:''}</td><td class="mono">${boxId(f.l,f.r)}</td><td class="num">${f.depth} cm</td><td>${esc(f.action)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="sub">Nema nalaza.</p>'}</div>
      <div><h3>Incidenti</h3>${incToday.length?incToday.map(i=>`<p style="margin:4px 0">Incident ${esc(i.start)}–${esc(i.end)}, ${i.done}/${STEPS.length} koraka potvrđeno. MEDEVAC poslat.</p>`).join(''):'<p class="sub" style="margin:4px 0">Nema prijavljenih incidenata.</p>'}</div>
      <div class="sign"><div>Vođa tima</div><div>QA / nadzor</div></div>
    </article>
    <div class="btnrow">
      <button class="btn primary" type="button" data-act="copyReport">Kopiraj izveštaj</button>
      <button class="btn" type="button" data-act="copyCsv">Kopiraj CSV za IMSMA</button>
    </div>
    <pre class="out" id="copyOut" hidden></pre>
    <div class="card"><div class="card-h"><h3>Poslednjih 7 dana</h3><span class="sub">m² po danu · plan ${PLAN_DAY}</span></div>${chart}</div>
    <div class="card"><div class="card-h"><h3>Svi nalazi na radilištu</h3><span class="sub">${S.finds.length}</span></div>
      <ul class="rows">${S.finds.slice().reverse().map(findRow).join('')}</ul></div>`;
}
function reportText(){
  const st=stats(), d=new Date();
  const L=[];
  L.push('DNEVNI IZVEŠTAJ O RADU — SHA-0147 Kamenica');
  L.push(longDate(d));
  L.push('Vođa tima: R. Nikolić · Tim Alfa · 6 deminera');
  L.push('Početak rada: '+(S.dayStarted?S.startAt:'—')+' · Brifing: '+(S.brief.every(Boolean)?'završen':'nije završen'));
  L.push('');
  L.push('Očišćeno danas: '+fmt(st.todayM2)+' m² ('+st.today+' boksa) · plan '+PLAN_DAY+' m²');
  L.push('Radilište ukupno: '+fmt(st.clearedM2)+' / '+fmt(TOTAL_M2)+' m²');
  L.push('');
  L.push('Nalazi danas ('+st.findsToday.length+'):');
  st.findsToday.forEach(f=>L.push('- '+f.id+' '+f.type+(f.qty>1?' ×'+f.qty:'')+', '+boxId(f.l,f.r)+', '+f.depth+' cm, '+f.cond.toLowerCase()+', '+f.action.toLowerCase()+' ('+f.lat.toFixed(5)+', '+f.lon.toFixed(5)+')'));
  L.push('');
  const inc=S.incidents.filter(i=>i.day===TODAY);
  L.push('Incidenti: '+(inc.length?inc.map(i=>i.start+'–'+i.end).join(', '):'nema'));
  return L.join('\n');
}
function csvText(){
  const q=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const head='find_id,date,time,site,lane,box,latitude,longitude,item,category,quantity,depth_cm,condition,action,note';
  return [head].concat(S.finds.map(f=>[f.id,f.day,f.time,'SHA-0147','L'+f.l,boxId(f.l,f.r),f.lat.toFixed(6),f.lon.toFixed(6),f.type,typeOf(f.type).cat,f.qty,f.depth,f.cond,f.action,f.note].map(q).join(','))).join('\n');
}
function copy(text,label){
  const out=$('#copyOut')||$('#nineOut');
  const show=()=>{if(out){out.textContent=text;out.hidden=false;} toast('Kopiranje nije dozvoljeno ovde. Tekst je ispod, označi ga ručno.');};
  try{
    navigator.clipboard.writeText(text).then(()=>{if(out)out.hidden=true;toast(label+' kopiran.');},show);
  }catch(e){show();}
}

/* ---------- emergency ---------- */
const HELI={lat:ORIGIN.lat-0.0021,lon:ORIGIN.lon+0.0035};

  } else {
    h+=`<div class="inc"><div><div class="label" style="color:inherit;opacity:.85">Incident u toku od ${esc(inc.start)}</div><div class="timer" id="incTime">00:00</div></div>
      <button class="btn sm" type="button" data-act="incEnd" style="background:var(--surface-2);color:var(--ink);border-color:transparent">Završi</button></div>
      <div class="card"><h3 style="margin-bottom:6px">Postupak</h3><ol class="steps">${STEPS.map((s,i)=>`<li><label><input type="checkbox" id="step${i}" data-act="step" data-i="${i}" ${inc.steps[i]?'checked':''}><span>${esc(s)}</span><span class="t">${inc.steps[i]||''}</span></label></li>`).join('')}</ol></div>`;
  }
  h+=`<div class="card"><div class="card-h"><h3>MEDEVAC · 9 linija</h3><button class="btn sm" type="button" data-act="copyNine">Kopiraj</button></div>
    <ol class="nine">
      <li><span class="n">1</span><span><div class="q">Mesto prihvata</div><div class="a mono">${fmtLL(HELI)}</div></span></li>
      <li><span class="n">2</span><span><div class="q">Frekvencija i pozivni znak</div><div class="a">Kanal 3 · „Alfa-baza”</div></span></li>
      <li><span class="n">3</span><span><div class="q">Povređeni po hitnosti</div><div class="a">A hitno <input id="n3a" type="number" min="0" max="9" value="${c.a}" data-nine="a" aria-label="Hitno"> B prioritet <input id="n3b" type="number" min="0" max="9" value="${c.b}" data-nine="b" aria-label="Prioritet"> C rutinsko <input id="n3c" type="number" min="0" max="9" value="${c.c}" data-nine="c" aria-label="Rutinsko"></div></span></li>
      <li><span class="n">4</span><span><div class="q">Posebna oprema</div><div class="a">Nije potrebna</div></span></li>
      <li><span class="n">5</span><span><div class="q">Povređeni po načinu prenosa</div><div class="a">Ležeći <input id="n5l" type="number" min="0" max="9" value="${c.litter}" data-nine="litter" aria-label="Ležeći"> Pokretni <input id="n5a" type="number" min="0" max="9" value="${c.amb}" data-nine="amb" aria-label="Pokretni"></div></span></li>
      <li><span class="n">6</span><span><div class="q">Bezbednost mesta prihvata</div><div class="a">Minirano područje severno. Prilaz samo sa juga, preko bazne linije.</div></span></li>
      <li><span class="n">7</span><span><div class="q">Obeležavanje</div><div class="a">Narandžasti panel, zelena dimna kutija na zahtev</div></span></li>
      <li><span class="n">8</span><span><div class="q">Status povređenih</div><div class="a">Civili, članovi tima za razminiranje</div></span></li>
      <li><span class="n">9</span><span><div class="q">Teren i prepreke</div><div class="a">Ravna livada, dalekovod 300 m severoistočno</div></span></li>
    </ol>
    <pre class="out" id="nineOut" hidden></pre>
  </div>`;
  h+=`<div class="card"><h3 style="margin-bottom:6px">Kontakti</h3><ul class="rows">
    <li class="contact"><span class="grow"><span class="num">194</span><br><span class="sub">Hitna medicinska pomoć</span></span><button class="btn sm" type="button" data-act="copyNum" data-v="194">Kopiraj</button></li>
    <li class="contact"><span class="grow"><span class="num">112</span><br><span class="sub">Jedinstveni broj za hitne slučajeve</span></span><button class="btn sm" type="button" data-act="copyNum" data-v="112">Kopiraj</button></li>
    <li class="contact"><span class="grow"><b>Kanal 3 · „Alfa-baza”</b><br><span class="sub">Šef projekta i baza</span></span></li>
    <li class="contact"><span class="grow"><b>Opšta bolnica (primer)</b><br><span class="sub">23 km · oko 28 min vozilom · urgentni prijem 0–24</span></span></li>
  </ul></div>`;

function renderDist(){const s=SAFE[$('#safeSel').value];$('#distOut').innerHTML=`<div><span class="sub">Razmak između deminera</span><b>${s.space} m</b></div><div><span class="sub">Zona pri uništavanju</span><b>${s.demo} m</b></div>`;}

/* ---------- timers ---------- */
function tick(){
  const ct=$('#cycleTime');
  if(ct&&S.dayStarted){const rem=CYCLE-((Date.now()-S.cycleStart)%CYCLE);const s=Math.floor(rem/1000);ct.textContent=pad(Math.floor(s/60))+':'+pad(s%60);}
  const it=$('#incTime');
  if(it&&S.incident){const s=Math.floor((Date.now()-S.incident.t0)/1000);it.textContent=pad(Math.floor(s/60))+':'+pad(s%60);}
}
let lastSide=activeSide();
setInterval(()=>{tick(); const s=activeSide(); if(s!==lastSide){lastSide=s; if(tab==='danas')renderDanas(); if(tab==='mapa')renderMapa(); toast('Vreme je za zamenu parova u stazama.');}},1000);

/* ---------- navigation ---------- */
const RENDER={danas:renderDanas,mapa:renderMapa,izvestaj:renderIzvestaj,hitno:renderHitno,nalaz:()=>{}};
function go(t,opts){
  tab=t;
  document.querySelectorAll('.view').forEach(v=>{v.hidden=v.id!=='v-'+t;});
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(t==='nalaz') prefillForm(opts&&opts.box);
  RENDER[t](); renderHeader();
  $('#main').scrollTop=0;
  try{localStorage.setItem(KEY+'-tab',t);}catch(e){}
}
function rerender(){RENDER[tab](); renderHeader();}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){ if(e.target.id==='scrim') closeSheet(); return; }
  const a=el.dataset.act;
  switch(a){
    case 'tab': go(el.dataset.tab); break;
    case 'box': openBox(el.dataset.k); break;
    case 'closeSheet': closeSheet(); break;
    case 'clearBox': {const k=el.dataset.k;S.boxes[k]=TODAY;const [l,r]=k.split('-').map(Number);addQueue('Boks '+boxId(l,r)+' očišćen');save();closeSheet();rerender();toast('Boks '+boxId(l,r)+' očišćen, +'+BOX_M2+' m².');break;}
    case 'unclearBox': {const k=el.dataset.k;delete S.boxes[k];const [l,r]=k.split('-').map(Number);addQueue('Boks '+boxId(l,r)+' vraćen u neočišćeno');save();closeSheet();rerender();break;}
    case 'findHere': {const k=el.dataset.k;$('#scrim').hidden=true;selBox=null;go('nalaz',{box:k});break;}
    case 'regps': newGps(); break;
    case 'brief': {S.brief[+el.dataset.i]=el.checked; if(S.brief.every(Boolean)) S.briefAt=hm(Date.now()); save(); renderDanas(); const f=$('#brief'+el.dataset.i); if(f) f.focus(); break;}
    case 'start': S.dayStarted=true;S.startAt=hm(Date.now());S.cycleStart=Date.now();S.shiftBase=0;lastSide=activeSide();addQueue('Radni dan započet');save();rerender();toast('Radni dan započet. Smena A ulazi u staze.');break;
    case 'rotate': {const cur=activeSide();S.cycleStart=Date.now();S.shiftBase=cur==='a'?1:0;lastSide=activeSide();save();rerender();toast('Parovi zamenjeni. Smena '+(lastSide==='a'?'A':'B')+' u stazama.');break;}
    case 'sync': {
      const b=$('#syncBtn'); if(b.classList.contains('busy')) break;
      if(!S.queue.length){toast('Sve je već poslato šefu projekta.');break;}
      const n=S.queue.length; b.classList.add('busy'); $('#syncLabel').textContent='Šaljem '+n+'…';
      setTimeout(()=>{S.queue=[];S.finds.forEach(f=>f.synced=true);S.lastSync=hm(Date.now());save();b.classList.remove('busy');rerender();toast('Poslato '+n+' zapisa. Šef projekta vidi stanje.');},1400);
      break;}
    case 'newday': {
      const y=dayKey(daysAgo(1));
      for(const k in S.boxes) if(S.boxes[k]===TODAY) S.boxes[k]=y;
      S.finds.forEach(f=>{if(f.day===TODAY){f.day=y;f.synced=true;}});
      S.queue=[];S.brief=BRIEF.map(()=>false);S.briefAt=null;S.dayStarted=false;S.startAt=null;S.incident=null;
      save();go('danas');toast('Novi dan. Završi brifing da bi rad počeo.');break;}
    case 'reset': try{localStorage.removeItem(KEY);}catch(e){} S=seed();lastSide=activeSide();save();go('danas');toast('Početni podaci vraćeni.');break;
    case 'copyReport': copy(reportText(),'Izveštaj'); break;
    case 'copyCsv': copy(csvText(),'CSV'); break;
    case 'copyNine': copy(nineText(),'MEDEVAC'); break;
    case 'copyNum': copy(el.dataset.v,'Broj'); break;
    case 'incStart': S.incident={t0:Date.now(),start:hm(Date.now()),steps:STEPS.map(()=>null)};addQueue('INCIDENT prijavljen');save();renderHitno();renderHeader();break;
    case 'step': {S.incident.steps[+el.dataset.i]=el.checked?hm(Date.now()):null;save();renderHitno();const f=$('#step'+el.dataset.i);if(f)f.focus();break;}
    case 'incEnd': {const i=S.incident;S.incidents.push({day:TODAY,start:i.start,end:hm(Date.now()),done:i.steps.filter(Boolean).length});S.incident=null;addQueue('Incident zatvoren');save();renderHitno();renderHeader();toast('Incident zatvoren i upisan u dnevni izveštaj.');break;}
  }
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.nine;if(k){S.nineCounts[k]=Math.max(0,+e.target.value||0);save();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)closeSheet();});

initForm();
let startTab='danas'; try{const t=localStorage.getItem(KEY+'-tab'); if(t&&RENDER[t]) startTab=t;}catch(e){}
const hash=(location.hash||'').slice(1); if(RENDER[hash]) startTab=hash;
go(startTab);
})();
